# E2E tests for SBproxy. Runs on tag pushes, on a weekly schedule,
# and on manual dispatch. The PR-required CI lane (`ci.yml`) excludes
# the bulk of `sbproxy-e2e` because the harness spawns the proxy
# binary, listens on real ports, and exercises the network stack; on
# shared GitHub runners the heavier tests (mesh gossip, websocket
# upgrade) produce startup-timeout flakiness that does not reflect a
# real regression. A small offline subset IS required on every code
# PR (the `e2e-subset` job in ci.yml, WOR-2469); this workflow stays
# the full sweep that validates the whole stack before a release
# ships.

name: e2e

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  # Scheduled runs use the default branch (main). Manual dispatch keeps
  # the branch selector, so a deliberate break can prove this lane from
  # a test branch without moving main.
  schedule:
    - cron: '30 9 * * 1' # 09:30 UTC every Monday
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # The payments-featured binary below builds with this workspace's
  # [profile.release] (fat LTO, codegen-units=1). release.yml's
  # aarch64-unknown-linux-gnu leg SIGKILLed under this profile even at
  # CARGO_BUILD_JOBS=1, but that runner is a smaller/constrained class
  # (ubuntu-24.04-arm). This job runs on ubuntu-latest, the same class
  # as release.yml's x86_64-unknown-linux-gnu leg, which has always
  # built this exact profile fine at full parallelism. A previous fix
  # here defensively capped this job at CARGO_BUILD_JOBS=1 too, which
  # instead fully serialized it for no reason and pushed it right up
  # against its own timeout (confirmed: cancelled building this exact
  # step at precisely 75min). Left at cargo's default.
  # settlement_gate.rs and usage_bridge.rs each start a 4-process
  # cluster; give proxy startup more room than a quiet dev machine
  # needs when the runner is also compiling the payments binary above.
  # SBPROXY_E2E_STARTUP_TIMEOUT_SECS is the harness's own documented
  # override for "an unusually slow host" (e2e/src/lib.rs).
  SBPROXY_E2E_STARTUP_TIMEOUT_SECS: '60'

jobs:
  e2e:
    name: e2e (workspace)
    runs-on: ubuntu-latest
    # The 2026-08-31 run spent 57min building the three proxy flavors and
    # another 7min compiling tests. The 75min cap then cancelled the suite
    # before it finished. Leave room for the complete test sweep as well as
    # the payments binary's fat-LTO build, including a cold cache.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/rust-setup
        with:
          cache-key: e2e

      # governance_strict starts its own isolated redis-server on an
      # ephemeral port and waits for that exact process to accept TCP
      # connections. Install and verify the packaged executable here;
      # the test provides the readiness check without relying on init.
      - name: install Redis test dependency
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y redis-server
          redis-server --version

      # The e2e harness spawns the proxy binary at runtime; cargo
      # cannot infer the ordering between the e2e crate and the
      # binary crate, so build it explicitly first.
      - name: build sbproxy binary
        run: cargo build -p sbproxy --locked

      # The no-default-features e2e harness (e.g. headless_detection_e2e's
      # disabled-feature test) spawns a separate binary built without
      # default features; build it into its own target dir so the harness
      # finds it.
      - name: build no-default-features sbproxy binary (e2e harness)
        run: CARGO_TARGET_DIR=target/no-default-features cargo build -p sbproxy --no-default-features --locked

      # settlement_gate.rs and usage_bridge.rs spawn a payments-featured
      # binary via ProxyHarness::start_payments_with_yaml_and_env; without
      # this, every test in both files fails with "payments-featured
      # sbproxy binary missing" (WOR-2222 - this lane never built one).
      # The command and target dir match e2e/src/lib.rs's own error
      # message exactly.
      - name: build payments-featured sbproxy binary (e2e harness)
        run: CARGO_TARGET_DIR=target/payments cargo build --release -p sbproxy --features payment-x402,payment-mpp,payment-stripe,payment-lightning-cln --locked

      # Run single-threaded. Each e2e test spawns its own proxy process
      # with a full multi-core tokio runtime, so the default test-thread
      # count (= CPU count) massively oversubscribes the runner and makes
      # timing-sensitive tests (cache stale-while-revalidate, rate-limit
      # budget windows, ...) flake. The required single-threaded gate in
      # release-checks.yml runs the same suite green; match it here.
      - name: e2e
        if: github.event_name == 'push'
        # --no-fail-fast: without it, cargo stops launching further test
        # binaries the moment one fails, so a single failing test hides
        # every result after it alphabetically - the run then looks
        # like a different flake every retry when it's really the same
        # earliest-alphabetical failure masking whatever comes later.
        run: cargo test -p sbproxy-e2e --locked --no-fail-fast -- --test-threads=1

      - name: e2e (weekly/manual, Redis required)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          # Pin the harness to the binaries built in this job. The harness
          # otherwise prefers a release binary when one is present.
          SBPROXY_E2E_BIN: ${{ github.workspace }}/target/debug/sbproxy
          SBPROXY_E2E_NO_DEFAULT_FEATURES_BIN: ${{ github.workspace }}/target/no-default-features/debug/sbproxy
          # Dependency-complete CI must never turn governance_strict into a
          # successful skip merely because redis-server disappeared.
          SBPROXY_E2E_REQUIRE_REDIS: '1'
        # --no-fail-fast: without it, cargo stops launching further test
        # binaries the moment one fails, so a single failing test hides
        # every result after it alphabetically - the run then looks
        # like a different flake every retry when it's really the same
        # earliest-alphabetical failure masking whatever comes later.
        run: cargo test -p sbproxy-e2e --locked --no-fail-fast -- --test-threads=1

  notify-failure:
    name: failure notification (GitHub issue)
    needs: e2e
    if: ${{ always() && needs.e2e.result == 'failure' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Serialize the issue lookup/create critical section across runs.
    concurrency:
      group: sbproxy-e2e-failure-notification
      cancel-in-progress: false
    # Keep write authority out of the job that builds and executes the
    # repository. This job needs only enough access to report a failure.
    permissions:
      issues: write
    steps:
      - name: open or update the e2e failure issue
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- sbproxy-e2e-workflow-failure -->';
            const incidentTitle = 'Debug e2e workflow is failing';
            const runId = process.env.GITHUB_RUN_ID;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${runId}`;
            const report = [
              marker,
              'The non-required debug e2e workflow failed.',
              '',
              `- Run: [${runId}](${runUrl})`,
              `- Trigger: \`${process.env.GITHUB_EVENT_NAME}\``,
              `- Ref: \`${process.env.GITHUB_REF}\``,
              `- Commit: \`${process.env.GITHUB_SHA}\``,
              '',
              '### Next steps',
              '',
              '1. Inspect the failed step and its logs in the linked run.',
              `2. Re-run failed jobs after a transient runner failure: \`gh run rerun ${runId} --failed\`.`,
              '3. Reproduce a named e2e target with Redis installed and `SBPROXY_E2E_REQUIRE_REDIS=1`.'
            ].join('\n');

            const openIssues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100
              }
            );
            const existing = openIssues.find(
              issue =>
                !issue.pull_request &&
                issue.user?.login === 'github-actions[bot]' &&
                issue.title === incidentTitle &&
                issue.body?.startsWith(marker)
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: report.replace(`${marker}\n`, '')
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: incidentTitle,
                body: report
              });
            }
