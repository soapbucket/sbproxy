# Verify the workspace still compiles on the Rust version it claims to support.
#
# `rust-version` in the root Cargo.toml is a compatibility promise: downstream
# packagers and anyone pinned to a distribution toolchain read it and believe
# it. Until this lane existed nothing checked it, so the promise could drift
# the moment any dependency or any `let ... else` crept in, and nobody would
# learn about it until a user reported a build failure.
#
# Its own workflow because it installs a pinned older toolchain, which is a
# different cache and a different fingerprint from every stable-toolchain job
# in ci.yml.
#
# When this lane fails, resist bumping `rust-version` reflexively. Two honest
# fixes exist and the right one depends on why it broke:
#
#   1. Raise the floor, if the feature that crossed it is worth the cost to
#      downstream packagers. Say so in the Cargo.toml comment.
#   2. Back out whatever crossed it, if the floor is load bearing for a
#      packager we care about.
#
# Either way it should be a decision someone made on purpose, which is the
# whole reason to check it in CI rather than discover it in an issue.
name: msrv

on:
  pull_request:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
      - '.github/workflows/msrv.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msrv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check against declared rust-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # For the cache-prune step at the end of the job; `gh cache delete`
      # needs it. Job-level is the narrowest scope GitHub offers, and the
      # prune step itself only runs on non-PR events.
      actions: write
    steps:
      - uses: actions/checkout@v4

      # Read the floor out of Cargo.toml rather than hardcoding it here, so
      # the lane cannot silently drift away from the value it exists to
      # protect. A workflow with its own copy of the number would pass while
      # testing the wrong toolchain, which is worse than no lane at all.
      - name: read declared MSRV
        id: msrv
        run: |
          set -euo pipefail
          version="$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          if [ -z "$version" ]; then
            echo "::error::no rust-version found in Cargo.toml; this lane has nothing to verify"
            exit 1
          fi
          echo "declared MSRV: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: install the declared toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2
        id: msrv-cache
        with:
          shared-key: msrv
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler clang libclang-dev libc6-dev

      # `cargo check` rather than a full build: this lane answers "does it
      # still compile on the old toolchain", and codegen adds minutes without
      # adding an answer. Package selection matches the test lane so the
      # feature union is the one CI already resolves elsewhere.
      #
      # RUSTUP_TOOLCHAIN outranks rust-toolchain.toml, which in turn
      # outranks the `rustup default` the install step above sets. Without
      # this the root pin would win and the lane would check the pinned
      # stable while reporting that the MSRV still compiles, which is the
      # exact "passes while testing the wrong toolchain" failure the step
      # above exists to prevent.
      - name: check workspace on the declared MSRV
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: cargo check --workspace --exclude sbproxy-e2e --locked --all-targets

      # Keep exactly one msrv cache generation. rust-cache writes a new entry
      # whenever the lockfile hash or the declared toolchain changes and never
      # deletes the superseded one, so with this repo's Cargo.lock churn two
      # ~0.8 GB msrv generations were live at once. The second one is pure
      # eviction pressure against the 10 GB budget accounted for in ci.yml's
      # header: a superseded generation is never restored again (prefix
      # restore picks the newest), so keeping it buys nothing. On an exact
      # cache hit the entry this run restored is the live generation: keep
      # it, delete the rest. On a miss the post-job save is about to write
      # the new live generation: delete everything already there. Runs only
      # on non-PR events, the same condition under which this workflow may
      # save, and only after a green check, so a failing run cannot delete
      # the cache and then bank nothing.
      - name: prune superseded msrv cache generations
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          MSRV_CACHE_HIT: ${{ steps.msrv-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          keep_id=""
          if [ "${MSRV_CACHE_HIT}" = "true" ]; then
            keep_id="$(gh cache list --key v0-rust-msrv --limit 100 \
              --json id,lastAccessedAt \
              --jq 'sort_by(.lastAccessedAt) | last | .id // empty')"
          fi
          gh cache list --key v0-rust-msrv --limit 100 --json id --jq '.[].id' \
          | while read -r cache_id; do
              [ -n "${cache_id}" ] || continue
              if [ "${cache_id}" != "${keep_id}" ]; then
                # Tolerate a concurrent delete; losing that race means the
                # entry is already gone, which is the goal.
                gh cache delete "${cache_id}" \
                  || echo "cache ${cache_id} already deleted"
              fi
            done
