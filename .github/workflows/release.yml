# Release pipeline for SBproxy.
#
# Activates on tags matching v*.*.*. Produces signed binaries (4 platforms),
# signed multi-arch Docker images on ghcr.io, a CycloneDX SBOM, and SLSA
# build provenance attestations. All signing is keyless via Sigstore +
# GitHub OIDC; the expected cert identity for tag vX.Y.Z is documented in
# SUPPLY-CHAIN.md.
#
# Every publish-side job is guarded by
# `if: github.repository == 'soapbucket/sbproxy'` so the workflow stays
# inert on forks.
#
# Model-host certification gate (WOR-1858): `certify-model-host-*`
# below run scripts/certify-model-host.sh and the deterministic
# model-host DoD suite on every release tag and dispatch, and the
# `release` / `image` publish jobs `needs` both. Before WOR-1858,
# certify-model-host.sh was a script a human had to remember to run by
# hand against a provisioned GPU box; nothing stopped a release from
# shipping with zero executable hardware evidence. Arming it here means
# a failing lane blocks the draft release and the image push, not just
# a stale doc claim.
#
# certify-model-host-apple-silicon runs the real DoD checklist (cold
# completion, warm completion, kill -9 recovery) against a real
# `sbproxy run` + managed llama-server on the runner's own Apple
# Silicon GPU (macos-14 runners are M-series hardware, not emulated).
# NVIDIA single/multi-GPU certification is NOT included: no
# GitHub-hosted runner has a GPU, and this repository has no
# self-hosted GPU runner registered today. Per docs/model-host-capabilities.md,
# engine.vllm_uv, engine.vllm_container, platform.nvidia_cuda, and
# cluster.remote_dispatch stay `preview` until a GPU runner exists and
# a lane is added here to certify them; that is tracked as a follow-up
# to WOR-1858, not silently claimed as covered by this workflow.

name: release

# No `schedule:` trigger here, deliberately. The `release` and `image`
# publish jobs are guarded by `github.repository` and `!inputs.dry_run`
# but NOT by a tag-ref condition, so a scheduled run (which executes on
# the default branch with empty `inputs`) would attempt to sign and
# publish from a branch ref. Until the publish jobs gain a
# `startsWith(github.ref, 'refs/tags/')` guard, on-demand coverage of
# the build and certification lanes comes from `workflow_dispatch`
# with `dry_run: true`; the nightly rot check for tag-only lanes lives
# in e2e.yml and release-checks.yml instead.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build artifacts but do not publish or sign'
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: build / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # Linux builds run inside a rust:bookworm container so the binaries
    # link against glibc 2.36, the floor shared by the distroless
    # cc-debian12 Docker base and Debian-12-era hosts. Building directly
    # on the runner links against the runner's glibc (ubuntu-24.04 =
    # 2.39), which produced Docker images that could not start at all:
    # "version `GLIBC_2.39' not found". The `container` value is empty
    # for macOS, which GitHub treats as "no container".
    container: ${{ matrix.container }}
    # Was 60. aarch64-apple-darwin's rust-cache entry has never
    # successfully saved this cut (cache only saves on job success, and
    # this job kept timing out / getting cancelled first for unrelated
    # reasons), so every attempt has paid a cold-cache fat-LTO build in
    # full and landed right at the old limit ("No cache found." in the
    # job log, ~60min wall time). certify-model-host-apple-silicon
    # already gives the same fat-LTO-on-macOS profile 75min for exactly
    # this reason; matching it here rather than tuning to the minute.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            platform: linux_amd64
            container: rust:1.97-bookworm
            lto: fat
            # No cap: this target has always built fine at cargo's
            # default (one rustc per core). A previous fix here
            # accidentally capped every target at 1 workflow-wide,
            # which serialized this build and aarch64-apple-darwin's
            # for no reason and pushed the latter over its timeout.
            build_jobs: 16
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            platform: linux_arm64
            container: rust:1.97-bookworm
            # [profile.release]'s fat LTO SIGKILLs this target even at
            # CARGO_BUILD_JOBS=1 (fully serialized - one rustc process
            # at a time), so this is not a parallelism/contention problem:
            # the single fat-LTO link itself needs more memory than this
            # runner has, for this dependency graph's size. Thin LTO still
            # gets most of the cross-crate optimization at a fraction of
            # the peak memory of merging the whole graph into one unit.
            # build_jobs stays 1 regardless: even with thin LTO, this is
            # still the smallest/most memory-constrained of the three
            # runners, and 1 costs only wall-clock time here.
            lto: thin
            build_jobs: 1
          - target: aarch64-apple-darwin
            runner: macos-latest
            lto: fat
            # No cap - see x86_64-unknown-linux-gnu above.
            build_jobs: 16
            platform: darwin_arm64
          # darwin_amd64 (Intel Mac) is not built. The GitHub macos-13
          # runner pools have multi-hour queue times that stalled
          # every release attempt, and Apple Silicon has been the
          # default for new Macs since 2020. Intel Mac users run the
          # linux_amd64 binary under Docker or build from source. See
          # `scripts/install.sh` for the same fallback message.

    steps:
      - uses: actions/checkout@v5

      # Linux jobs take their toolchain from the pinned rust:bookworm
      # container image; installing another one via rustup would only
      # reintroduce drift. macOS still needs the action.
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'macOS'
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # The binary pulls in sbproxy-classifier-proto / sbproxy-classifiers,
      # whose build scripts run prost/tonic codegen and need `protoc` on
      # PATH. rquickjs-sys's bindgen also needs libclang on Linux. ci.yml
      # installs these for its build/test job; the release runners are
      # separate machines, so they need the same install or the build
      # fails with "Could not find `protoc`".
      - name: install protoc and build deps
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_OS}" in
            Linux)
              # Inside the rust:bookworm container we are root and sudo
              # does not exist; on a bare runner we are not and it does.
              SUDO="$(command -v sudo || true)"
              ${SUDO} apt-get update
              ${SUDO} apt-get install -y protobuf-compiler libclang-dev clang cmake nasm
              ;;
            macOS)
              brew install protobuf
              ;;
          esac

      # WOR-1781: build the admin SPA and embed it, so shipped binaries
      # serve the dashboard at /admin/ui instead of "Admin UI not built".
      # ui/dist is gitignored (only a keepfile is tracked), so the release
      # lane must produce it before cargo embeds it via include_dir.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: build admin ui
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: build release binary
        # CARGO_PROFILE_RELEASE_LTO overrides [profile.release]'s
        # workspace-wide `lto = "fat"` per matrix leg (see the `lto: thin`
        # comment on the aarch64-unknown-linux-gnu entry above).
        # CARGO_BUILD_JOBS is per matrix leg too, not workflow-wide: only
        # aarch64-unknown-linux-gnu needs the parallelism cap.
        env:
          CARGO_PROFILE_RELEASE_LTO: ${{ matrix.lto }}
          CARGO_BUILD_JOBS: ${{ matrix.build_jobs }}
        run: cargo build --release --locked --target ${{ matrix.target }} --bin sbproxy --features embed-admin-ui

      # Contract: linux binaries must not require a glibc newer than the
      # distroless cc-debian12 runtime base (2.36), or the Docker image
      # dies on startup and the tarball only runs on 2026-era distros.
      - name: assert glibc baseline (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/sbproxy"
          MAX_ALLOWED="2.36"
          NEEDED="$(objdump -T "${BIN}" | grep -o 'GLIBC_2\.[0-9]*' | sort -uV | tail -1 | cut -d_ -f2)"
          echo "highest glibc symbol version required: ${NEEDED} (allowed: <= ${MAX_ALLOWED})"
          HIGHEST="$(printf '%s\n%s\n' "${NEEDED}" "${MAX_ALLOWED}" | sort -V | tail -1)"
          if [ "${HIGHEST}" != "${MAX_ALLOWED}" ]; then
            echo "::error::binary requires GLIBC_${NEEDED} > ${MAX_ALLOWED}; it will not start on the distroless cc-debian12 image. Build inside the pinned rust:bookworm container."
            exit 1
          fi

      - name: package tarball
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          STAGE="sbproxy-${GITHUB_REF_NAME}-${{ matrix.platform }}"
          mkdir -p "${STAGE}"
          cp "target/${{ matrix.target }}/release/sbproxy" "${STAGE}/sbproxy"
          cp LICENSE NOTICE README.md SECURITY.md SUPPLY-CHAIN.md "${STAGE}/" 2>/dev/null || true
          # Pack the CONTENTS of the staging dir (binary, license, readme)
          # so the tarball extracts to a flat layout: sbproxy + LICENSE etc.
          # at root so install.sh and the Homebrew formula find the binary
          # at the expected path.
          tar -czf "dist/sbproxy_${{ matrix.platform }}.tar.gz" -C "${STAGE}" .
          # sha256sum on Linux (present in the rust:bookworm container),
          # shasum on macOS; both emit the same "HASH  filename" shape.
          if command -v sha256sum >/dev/null; then
            (cd dist && sha256sum "sbproxy_${{ matrix.platform }}.tar.gz" > "sbproxy_${{ matrix.platform }}.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "sbproxy_${{ matrix.platform }}.tar.gz" > "sbproxy_${{ matrix.platform }}.tar.gz.sha256")
          fi

      - name: upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: bin-${{ matrix.platform }}
          path: dist/
          retention-days: 7

  sbom:
    name: sbom (cyclonedx)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: generate cyclonedx sbom
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: sbom.cyclonedx.json
          output-file: sbom.cyclonedx.json

      - name: upload sbom
        uses: actions/upload-artifact@v5
        with:
          name: sbom
          path: sbom.cyclonedx.json
          retention-days: 7

  certify-model-host-deterministic:
    name: model-host certification / deterministic gate (WOR-1858)
    # Arms the "Deterministic gate" from docs/model-host-certification.md
    # as a required release check. These suites need no GPU: they prove
    # immutable artifact selection, process argv, container isolation,
    # source-build publication, per-device capacity, bounded queue
    # behavior, atomic rollback, status shape, and CLI contracts. They
    # cannot prove a driver loads a model or returns tokens on real
    # hardware; certify-model-host-apple-silicon below covers that.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: certify-model-host-deterministic

      - name: install protoc and libclang
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libclang-dev clang

      # The model_cluster_control / model_cluster_dispatch e2e suites
      # spawn target/debug/sbproxy at runtime; build it before the test
      # step below so they do not fail with "release binary missing".
      - name: build sbproxy binary (needed by e2e harness)
        run: cargo build -p sbproxy --locked

      - name: record version metadata
        run: |
          set -euo pipefail
          echo "git revision: $(git rev-parse HEAD)"
          echo "git ref:      ${GITHUB_REF_NAME}"
          echo "runner:       $(uname -srm)"

      - name: deterministic model-host DoD suite
        run: |
          set -euo pipefail
          cargo test -p sbproxy-model-host --test engine_drivers --locked
          cargo test -p sbproxy-model-host --test cuda_build --locked
          cargo test -p sbproxy-model-host --test runtime_reconcile --locked
          cargo test -p sbproxy-model-host --test local_admission --locked
          cargo test -p sbproxy-core --test model_host_reload --locked
          cargo test -p sbproxy --test models_lifecycle_cli --locked
          cargo test -p sbproxy-model-host --test placement --locked
          cargo test -p sbproxy-model-host --test capability_contract --locked
          cargo test -p sbproxy-ai --test managed_replica_routing --locked
          cargo test -p sbproxy-core --test cluster_control_plane --locked
          cargo test -p sbproxy-core --test model_plane_envelope --test model_plane_transport --test managed_replica_dispatch --locked
          SBPROXY_E2E_BIN="${PWD}/target/debug/sbproxy" cargo test -p sbproxy-e2e --test model_cluster_control --locked -- --nocapture
          SBPROXY_E2E_BIN="${PWD}/target/debug/sbproxy" cargo test -p sbproxy-e2e --test model_cluster_dispatch --locked -- --nocapture

  certify-model-host-apple-silicon:
    # Blocking since the v1.9.0 cycle. The lane's two historical failure
    # modes are both fixed: the pinned llama-server refusing the hosted
    # macos-14 runner (resolved by the runner-compat pin fix) and the
    # kill -9 recovery check timing out because Failed was a terminal
    # state (resolved by auto-relaunch on the request path). Three
    # consecutive live runs passed on 2026-07-28 before the flip.
    name: model-host certification / Apple Silicon (WOR-1858)
    # Arms scripts/certify-model-host.sh as a required release check by
    # running it for real: boots `sbproxy run` with a managed
    # llama-server on the runner's own Apple Silicon GPU, then drives a
    # cold completion, a warm completion, engine kill -9 recovery,
    # gateway SIGKILL/restart ownership recovery, final SIGTERM
    # engine/listener cleanup, and the real launchd service-uninstall
    # lifecycle. This is the same procedure previously
    # recorded by hand in docs/model-host-certification.md's "Apple
    # Metal gate for this PR" section; it now runs on every release
    # instead of relying on a human to run it before merging a PR.
    #
    # `sbproxy run <model>` synthesizes a config with origins
    # "127.0.0.1" and "localhost" only (crates/sbproxy/src/main.rs
    # prepare_run()); it does not recognize the "ai.local" hostname
    # certify-model-host.sh defaults to for `serve:`-block deployments,
    # so SB_HOST is pinned to 127.0.0.1 below to match.
    runs-on: macos-14
    # The release-profile build (fat LTO) alone can exceed 30 minutes on
    # a cold macOS runner cache; certification needs headroom on top.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: certify-model-host-apple-silicon

      # sbproxy-classifier-proto's build script requires protoc; macOS
      # runners do not ship it, unlike the preprovisioned Linux images.
      - name: install protoc
        run: brew install protobuf

      - name: build release binary
        run: cargo build --release -p sbproxy --locked

      - name: record version metadata
        run: |
          set -euo pipefail
          echo "git revision: $(git rev-parse HEAD)"
          echo "git ref:      ${GITHUB_REF_NAME}"
          sw_vers
          uname -srm
          sysctl -n machdep.cpu.brand_string || true
          python3 - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone
          def cmd(*args):
              return subprocess.check_output(args, text=True).strip()
          host = {
              "recorded_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "git_revision": cmd("git", "rev-parse", "HEAD"),
              "os": cmd("uname", "-s"),
              "os_release": cmd("uname", "-r"),
              "arch": cmd("uname", "-m"),
              "macos_version": cmd("sw_vers", "-productVersion"),
              "macos_build": cmd("sw_vers", "-buildVersion"),
              "chip": cmd("sysctl", "-n", "machdep.cpu.brand_string"),
              "memory_bytes": int(cmd("sysctl", "-n", "hw.memsize")),
          }
          os.makedirs("/tmp/sbproxy-cert-artifacts", exist_ok=True)
          with open("/tmp/sbproxy-cert-host.json", "w") as handle:
              json.dump(host, handle, indent=2)
              handle.write("\n")
          PY

      - name: boot sbproxy and certify against it
        env:
          MODEL: qwen2.5-0.5b-instruct
        run: |
          set -uo pipefail
          # Fixed path (not mktemp) so the diagnostics step below can
          # find the model-host's durable operation job records after
          # a failure.
          CACHE_DIR="/tmp/sbproxy-cert-cache"
          mkdir -p "${CACHE_DIR}"
          OWNERSHIP_DIR="${RUNNER_TEMP}/sbproxy-cert-ownership-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${OWNERSHIP_DIR}"
          chmod 700 "${OWNERSHIP_DIR}"
          export SBPROXY_ENGINE_OWNERSHIP_DIR="${OWNERSHIP_DIR}"
          SB_PID=""
          SERVICE_ATTEMPTED=0

          ownership_pid() {
            python3 - "${OWNERSHIP_DIR}" <<'PY'
          import glob, json, os, sys
          records = sorted(glob.glob(os.path.join(sys.argv[1], "*.json")), key=os.path.getmtime)
          if records:
              with open(records[-1]) as handle:
                  print(json.load(handle)["engine"]["pid"])
          PY
          }

          wait_ready() {
            local pid="$1" attempts="$2"
            for _ in $(seq 1 "${attempts}"); do
              if curl -sf -o /dev/null "http://127.0.0.1:48123/v1/models"; then
                return 0
              fi
              kill -0 "${pid}" 2>/dev/null || return 1
              sleep 2
            done
            return 1
          }

          wait_exit() {
            local pid="$1" attempts="$2"
            for _ in $(seq 1 "${attempts}"); do
              kill -0 "${pid}" 2>/dev/null || return 0
              sleep 1
            done
            return 1
          }

          start_sbproxy() {
            local log="$1"
            ./target/release/sbproxy run "${MODEL}" \
              --variant q4_k_m \
              --cache-dir "${CACHE_DIR}" \
              --port 48123 \
              --admin-port 48124 \
              > "${log}" 2>&1 &
            SB_PID=$!
          }

          cleanup() {
            if [ "${SERVICE_ATTEMPTED}" -eq 1 ]; then
              ./target/release/sbproxy service uninstall >/dev/null 2>&1 || true
            fi
            if [ -n "${SB_PID}" ] && kill -0 "${SB_PID}" 2>/dev/null; then
              kill -TERM "${SB_PID}" 2>/dev/null || true
              wait_exit "${SB_PID}" 15 || kill -9 "${SB_PID}" 2>/dev/null || true
            fi
            local engine_pid
            engine_pid="$(ownership_pid 2>/dev/null || true)"
            if [ -n "${engine_pid}" ] && kill -0 "${engine_pid}" 2>/dev/null; then
              kill -TERM "${engine_pid}" 2>/dev/null || true
              sleep 1
              kill -9 "${engine_pid}" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          BOOT_START="$(date +%s)"
          start_sbproxy /tmp/sbproxy-cert-boot.log

          # Wait for the HTTP port to accept connections. This only
          # proves the process is up; certify-model-host.sh's own
          # cold-call timeout (600s) separately absorbs the time to
          # load the model on first request.
          if ! wait_ready "${SB_PID}" 60; then
            echo "sbproxy never opened :48123" >&2
            cat /tmp/sbproxy-cert-boot.log >&2 || true
            exit 1
          fi

          # time_to_ready_seconds is the ready-banner elapsed
          # (docs/model-host-certification.md). HTTP-up is only a
          # fallback after the banner wait expires, so a wording
          # change cannot leave the field unset after a successful boot.
          HTTP_READY_SECS=$(( $(date +%s) - BOOT_START ))
          READY_SECS=-1
          for _ in $(seq 1 90); do
            if grep -q "is ready on" /tmp/sbproxy-cert-boot.log 2>/dev/null; then
              READY_SECS=$(( $(date +%s) - BOOT_START ))
              break
            fi
            sleep 1
          done
          if [ "${READY_SECS}" -lt 0 ]; then
            echo "ready banner not found; recording HTTP-ready elapsed ${HTTP_READY_SECS}s"
            READY_SECS="${HTTP_READY_SECS}"
          fi
          echo "${READY_SECS}" > /tmp/sbproxy-cert-ready-secs

          # Derive the supervised engine from sbproxy's exact durable
          # ownership record, never from an executable-name sweep.
          ENGINE_PID=""
          for _ in $(seq 1 60); do
            ENGINE_PID="$(ownership_pid 2>/dev/null || true)"
            [ -n "${ENGINE_PID}" ] && break
            sleep 1
          done
          if [ -z "${ENGINE_PID}" ]; then
            echo "managed engine ownership record was not published" >&2
            exit 1
          fi

          set +e
          SB_URL="http://127.0.0.1:48123" SB_HOST=127.0.0.1 MODEL="${MODEL}" \
            ENGINE_PID="${ENGINE_PID}" \
            bash scripts/certify-model-host.sh
          CERT_STATUS=$?
          set -e
          if [ "${CERT_STATUS}" -ne 0 ]; then
            exit "${CERT_STATUS}"
          fi

          READY_SECS="$(cat /tmp/sbproxy-cert-ready-secs 2>/dev/null || echo -1)"
          ADMIN_PASSWORD="$(grep -m1 'Admin password:' /tmp/sbproxy-cert-boot.log | awk '{print $3}')"
          SB_ADMIN_URL="http://127.0.0.1:48124" \
          SB_ADMIN_USERNAME=admin \
          SB_ADMIN_PASSWORD="${ADMIN_PASSWORD}" \
            ./target/release/sbproxy models ps --format json \
            > /tmp/sbproxy-cert-ps.json || true
          # certify-model-host.sh kill -9s ENGINE_PID. Re-read the
          # current ownership record so RSS is sampled from a live
          # post-recovery engine, then fail closed if the envelope
          # check cannot run.
          LIVE_ENGINE_PID="$(ownership_pid 2>/dev/null || true)"
          OBSERVED_RSS=0
          if [ -n "${LIVE_ENGINE_PID}" ] && kill -0 "${LIVE_ENGINE_PID}" 2>/dev/null; then
            rss_kb="$(ps -o rss= -p "${LIVE_ENGINE_PID}" 2>/dev/null | tr -d ' ')"
            OBSERVED_RSS=$(( ${rss_kb:-0} * 1024 ))
          fi
          python3 - "${READY_SECS}" "${OBSERVED_RSS}" <<'PY'
          import json, os, sys
          ready = int(sys.argv[1])
          observed = int(sys.argv[2])
          host = {}
          if os.path.exists("/tmp/sbproxy-cert-host.json"):
              host = json.load(open("/tmp/sbproxy-cert-host.json"))
          findings = {}
          if os.path.exists("/tmp/sbproxy-cert-findings.json"):
              findings = json.load(open("/tmp/sbproxy-cert-findings.json"))
          engine_version = None
          digest = None
          planned = None
          if os.path.exists("/tmp/sbproxy-cert-ps.json"):
              status = json.load(open("/tmp/sbproxy-cert-ps.json"))
              payload = status.get("data") or status
              deployments = payload.get("deployments") or []
              if deployments:
                  engine_version = deployments[0].get("engine_version")
                  digest = deployments[0].get("artifact_digest")
                  mem = deployments[0].get("memory") or {}
                  planned = mem.get("total_bytes") or None
          findings["engine_version"] = engine_version
          findings["artifact_digest"] = digest
          findings["time_to_ready_seconds"] = ready if ready >= 0 else None
          findings["planned_memory_bytes"] = planned
          findings["observed_rss_bytes"] = observed or None
          findings["memory_overshoot"] = 0.25
          sys.path.insert(0, "scripts/lib")
          from cert_record import live_rss_within_planned_envelope, write_record
          if not planned or int(planned) <= 0 or observed <= 0:
              raise SystemExit(
                  f"live RSS envelope check did not run "
                  f"(planned={planned!r} observed={observed})"
              )
          if not live_rss_within_planned_envelope(int(planned), observed):
              raise SystemExit(
                  f"live RSS {observed} overshoots planned {planned} by more than 25%"
              )
          os.makedirs("/tmp/sbproxy-cert-artifacts", exist_ok=True)
          write_record("/tmp/sbproxy-cert-artifacts/record.json", host, findings)
          print("wrote /tmp/sbproxy-cert-artifacts/record.json")
          PY

          # SIGKILL the gateway, then start the same managed run again.
          # The replacement must reap the exact old engine identity before
          # it launches a new one.
          ORPHAN_ENGINE_PID="$(ownership_pid)"
          kill -9 "${SB_PID}"
          wait "${SB_PID}" 2>/dev/null || true
          SB_PID=""
          start_sbproxy /tmp/sbproxy-cert-restart.log
          if ! wait_ready "${SB_PID}" 90; then
            echo "replacement sbproxy never became ready" >&2
            cat /tmp/sbproxy-cert-restart.log >&2 || true
            exit 1
          fi
          REPLACEMENT_ENGINE_PID=""
          for _ in $(seq 1 60); do
            REPLACEMENT_ENGINE_PID="$(ownership_pid 2>/dev/null || true)"
            if [ -n "${REPLACEMENT_ENGINE_PID}" ] \
              && [ "${REPLACEMENT_ENGINE_PID}" != "${ORPHAN_ENGINE_PID}" ]; then
              break
            fi
            sleep 1
          done
          if kill -0 "${ORPHAN_ENGINE_PID}" 2>/dev/null; then
            echo "replacement left exact orphan engine pid ${ORPHAN_ENGINE_PID} alive" >&2
            exit 1
          fi
          if [ -z "${REPLACEMENT_ENGINE_PID}" ] \
            || [ "${REPLACEMENT_ENGINE_PID}" = "${ORPHAN_ENGINE_PID}" ]; then
            echo "replacement engine ownership was not refreshed" >&2
            exit 1
          fi

          # Final SIGTERM must reap the replacement engine, clear its record,
          # and release the public listener for an immediate restart.
          kill -TERM "${SB_PID}"
          if ! wait_exit "${SB_PID}" 60; then
            echo "sbproxy ignored SIGTERM" >&2
            exit 1
          fi
          wait "${SB_PID}" 2>/dev/null || true
          SB_PID=""
          if kill -0 "${REPLACEMENT_ENGINE_PID}" 2>/dev/null; then
            echo "SIGTERM left engine pid ${REPLACEMENT_ENGINE_PID} alive" >&2
            exit 1
          fi
          if find "${OWNERSHIP_DIR}" -name '*.json' -print -quit | grep -q .; then
            echo "SIGTERM left a managed-engine ownership record behind" >&2
            exit 1
          fi
          python3 - <<'PY'
          import socket
          sock = socket.socket()
          sock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          sock.bind(("0.0.0.0", 48123))
          sock.close()
          PY

          # Exercise the operator-facing launchd lifecycle itself. The
          # service starts from a sparse launchd environment, so publish
          # the exact ownership directory through its supported env file.
          SERVICE_ENV="${HOME}/Library/Application Support/sbproxy/service/env"
          mkdir -p "$(dirname "${SERVICE_ENV}")"
          printf 'SBPROXY_ENGINE_OWNERSHIP_DIR=%s\n' "${OWNERSHIP_DIR}" > "${SERVICE_ENV}"
          chmod 600 "${SERVICE_ENV}"
          # From this point on, neither the launchd service nor the uninstall
          # command may inherit the direct-run override from this shell. The
          # service env file is the only source of the ownership directory.
          unset SBPROXY_ENGINE_OWNERSHIP_DIR
          SERVICE_ATTEMPTED=1
          ./target/release/sbproxy service install "${MODEL}" \
            --variant q4_k_m \
            --cache-dir "${CACHE_DIR}" \
            --port 48123 \
            --admin-port 48124 \
            > /tmp/sbproxy-cert-service-install.log

          SERVICE_READY=0
          for _ in $(seq 1 90); do
            if ./target/release/sbproxy service status >/dev/null 2>&1 \
              && curl -sf -o /dev/null "http://127.0.0.1:48123/v1/models"; then
              SERVICE_READY=1
              break
            fi
            sleep 2
          done
          if [ "${SERVICE_READY}" -ne 1 ]; then
            echo "launchd service never became ready" >&2
            cat "${HOME}/Library/Logs/sbproxy/service.err.log" >&2 || true
            exit 1
          fi
          SERVICE_ENGINE_PID="$(ownership_pid)"
          if [ -z "${SERVICE_ENGINE_PID}" ]; then
            echo "launchd service did not publish managed-engine ownership" >&2
            exit 1
          fi

          ./target/release/sbproxy service uninstall --format json \
            > /tmp/sbproxy-cert-service-uninstall.json
          SERVICE_ATTEMPTED=0
          if ./target/release/sbproxy service status >/dev/null 2>&1; then
            echo "service uninstall left the launchd agent running" >&2
            exit 1
          fi
          if ! wait_exit "${SERVICE_ENGINE_PID}" 15; then
            echo "service uninstall left engine pid ${SERVICE_ENGINE_PID} alive" >&2
            exit 1
          fi
          if find "${OWNERSHIP_DIR}" -name '*.json' -print -quit | grep -q .; then
            echo "service uninstall left a managed-engine ownership record behind" >&2
            exit 1
          fi
          python3 - <<'PY'
          import socket
          sock = socket.socket()
          sock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          sock.bind(("0.0.0.0", 48123))
          sock.close()
          PY

      # The engine's bounded stderr tail is what an engine_early_exit
      # failure tells the operator to inspect. The model-host keeps
      # that tail in memory only and the engine supervisor logs it into
      # the proxy log on every failed launch attempt, so the boot log
      # must ship in the artifact in full, alongside the durable
      # operation job records (launch/load outcomes with reason and
      # remediation) from the model-host cache dir.
      - name: collect certification diagnostics
        if: always()
        run: |
          set -uo pipefail
          OUT="/tmp/sbproxy-cert-artifacts"
          mkdir -p "${OUT}"
          # Full proxy boot log, bounded only against pathological
          # growth (engine stderr tails are <= 8 KiB each).
          if [ -f /tmp/sbproxy-cert-boot.log ]; then
            tail -c 8388608 /tmp/sbproxy-cert-boot.log > "${OUT}/sbproxy-cert-boot.log"
          fi
          if [ -f /tmp/sbproxy-cert-artifacts/record.json ]; then
            cp /tmp/sbproxy-cert-artifacts/record.json "${OUT}/record.json"
          fi
          if [ -f /tmp/sbproxy-cert-host.json ]; then
            cp /tmp/sbproxy-cert-host.json "${OUT}/host.json"
          fi
          if [ -f /tmp/sbproxy-cert-findings.json ]; then
            cp /tmp/sbproxy-cert-findings.json "${OUT}/findings.json"
          fi
          # Durable model-host operation job records (<cache>/jobs/*.json).
          find /tmp/sbproxy-cert-cache -type d -name jobs 2>/dev/null | while read -r dir; do
            mkdir -p "${OUT}/jobs"
            cp "${dir}"/*.json "${OUT}/jobs/" 2>/dev/null || true
          done
          ls -la "${OUT}" || true

      - name: upload certification diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: model-host-cert-apple-silicon-log
          path: /tmp/sbproxy-cert-artifacts/
          retention-days: 14

  release:
    name: publish release
    if: github.repository == 'soapbucket/sbproxy' && !inputs.dry_run
    needs: [build, sbom, certify-model-host-deterministic, certify-model-host-apple-silicon]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5

      - name: download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: stage release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.sha256' -o -name 'sbom.cyclonedx.json' \) -exec cp {} dist/ \;
          ls -la dist/

      - uses: sigstore/cosign-installer@v3

      - name: sign binaries with cosign (keyless)
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          set -euo pipefail
          for tarball in dist/sbproxy_*.tar.gz; do
            cosign sign-blob --yes \
              --bundle "${tarball}.cosign.bundle" \
              "${tarball}"
          done
          ls -la dist/

      - name: attest build provenance for binaries
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/sbproxy_*.tar.gz'

      - name: create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Draft notes are the tagged version's CHANGELOG section, not
          # the whole file: GitHub caps release bodies at 125k
          # characters and the full CHANGELOG passed that at v1.9.0.
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { on = 1; print; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if ! [ -s /tmp/release-notes.md ]; then
            echo "no CHANGELOG section found for ${version}" >&2
            exit 1
          fi
          # A tag-time-only failure's documented recovery is to move the
          # tag (git tag -d + recreate + push) and let this workflow run
          # again. gh release create refuses to reuse a tag name a draft
          # release already claims and silently creates an orphaned
          # "untagged-*" draft instead, leaving the stale first-attempt
          # release (and its assets) live under the real tag. Caught at
          # v1.11.0: the tag moved 4 times and the published release kept
          # attempt 1's binaries through 3 more rebuilds. Delete any
          # existing release for this tag first (never the tag itself,
          # which is what triggered this run) so a retag always produces
          # exactly one release, matching the assets this run just built.
          gh release delete "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" --yes 2>/dev/null || true
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/release-notes.md \
            --draft \
            dist/*

  image:
    name: publish container image
    if: github.repository == 'soapbucket/sbproxy' && !inputs.dry_run
    needs: [build, sbom, certify-model-host-deterministic, certify-model-host-apple-silicon]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5

      - name: download binaries
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: bin-*

      - name: download sbom
        uses: actions/download-artifact@v5
        with:
          name: sbom
          path: artifacts/sbom

      - name: prepare docker context
        shell: bash
        run: |
          set -euo pipefail
          # Tarballs are FLAT layout (built with `tar -C STAGE .`), so
          # the archive's first entry is "./" which clashes with /tmp's
          # sticky bit when we extract there directly. Stage each arch
          # in its own subdirectory we own, then move just the binary.
          mkdir -p docker-ctx/linux/amd64 docker-ctx/linux/arm64
          mkdir -p stage/amd64 stage/arm64
          tar -xzf artifacts/bin-linux_amd64/sbproxy_linux_amd64.tar.gz -C stage/amd64/
          tar -xzf artifacts/bin-linux_arm64/sbproxy_linux_arm64.tar.gz -C stage/arm64/
          mv stage/amd64/sbproxy docker-ctx/linux/amd64/sbproxy
          mv stage/arm64/sbproxy docker-ctx/linux/arm64/sbproxy
          chmod +x docker-ctx/linux/*/sbproxy
          cp artifacts/sbom/sbom.cyclonedx.json docker-ctx/sbom.cyclonedx.json
          # Staged empty dir: distroless has no shell, so the writable
          # state directory must arrive via COPY from the build context.
          mkdir -p docker-ctx/var/lib/sbproxy
          cat > docker-ctx/Dockerfile <<'EOF'
          # syntax=docker/dockerfile:1.7
          FROM gcr.io/distroless/cc-debian12:nonroot
          ARG TARGETOS
          ARG TARGETARCH
          COPY ${TARGETOS}/${TARGETARCH}/sbproxy /usr/local/bin/sbproxy
          # /var/lib/sbproxy must exist and be writable by the nonroot
          # runtime user (uid 65532): the documented defaults for the
          # key_management keystore and usage rollups live there, and
          # the base image only has a root-owned /var/lib (WOR-2087).
          COPY --chown=65532:65532 var/lib/sbproxy /var/lib/sbproxy
          EXPOSE 8080 9090
          ENTRYPOINT ["/usr/local/bin/sbproxy"]
          EOF

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub (soapbucket org). Authenticates with an organization
      # access token stored as the DOCKERHUB_TOKEN secret; the login user
      # is the org namespace.
      - name: log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: soapbucket
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: derive tag
        id: meta
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "image=${REGISTRY}/${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "dockerhub_image=docker.io/soapbucket/sbproxy" >> "${GITHUB_OUTPUT}"

      - name: build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: docker-ctx
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.dockerhub_image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.dockerhub_image }}:latest
          provenance: true
          sbom: false

      # The one check that would have caught the glibc-mismatch images:
      # actually start the container we just pushed. `--version` exits 0
      # only if the dynamic linker resolves, i.e. the binary's glibc
      # requirement fits the distroless base.
      - name: smoke test pushed image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm "${{ steps.meta.outputs.dockerhub_image }}@${{ steps.push.outputs.digest }}" --version

      - uses: sigstore/cosign-installer@v3

      - name: sign images with cosign (keyless)
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          for ref in \
            "${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}" \
            "${{ steps.meta.outputs.dockerhub_image }}@${{ steps.push.outputs.digest }}"; do
            cosign sign --yes "$ref"
          done

      # Provenance MUST be pushed before the cosign SBOM attestation.
      # attest-build-provenance's push-to-registry replaces the image's
      # sha256-<digest>.att tag wholesale, so any attestation attached
      # earlier is wiped (v1.5.0 shipped without a registry-visible
      # CycloneDX attestation because of this). cosign attest appends to
      # the existing .att manifest, so it must run last.
      - name: attest build provenance for ghcr image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: attest build provenance for Docker Hub image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.meta.outputs.dockerhub_image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: attach sbom attestation to images
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          for ref in \
            "${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}" \
            "${{ steps.meta.outputs.dockerhub_image }}@${{ steps.push.outputs.digest }}"; do
            cosign attest --yes \
              --predicate docker-ctx/sbom.cyclonedx.json \
              --type cyclonedx \
              "$ref"
          done
