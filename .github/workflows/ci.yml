name: CI
# --- Workflow shape (updated 2026-07-31) ---
# Every lane runs in parallel and `build / test` is a zero-cost aggregator
# that fails if any lane failed. Branch protection keeps requiring the one
# `build / test` check; the work underneath it fans out.
#
#   changes        (~10 s)  path filter, consumed by every other lane
#   test           (~9 min) one workspace build -> nextest -> doctests ->
#                           generated-artifact freshness checks
#   lint           (~4 min) fmt, clippy, rustdoc
#   obs-budgets    (~5 min) e2e cardinality + redaction, observability paths only
#                           (three test targets; see the job for why)
#   e2e-subset     (~6 min) five offline e2e files against a spawned proxy,
#                           required on every code PR (WOR-2469)
#   payments       (~8 min) tests under the settlement feature union
#   payments-clippy (~4 min) clippy under the same union, as a parallel job
#   ui             (~40 s)  node typecheck + vitest
#   supply-chain   (~60 s)  cargo-deny (crates) + npm audit (admin UI)
#   embed-admin-ui (~6 min) SPA build + the release binary's feature union
#   build / test   (~5 s)   aggregator; the required status check
#
# The dominant cost here is rustc, not test execution: 8763 tests run in
# about 96 seconds. Two rules keep the rustc bill down.
#
#   1. Every cargo invocation inside a job MUST use the same package
#      selection. Under resolver = "2" the feature union is computed from
#      the selected packages, so `-p some-crate` resolves a different
#      feature set than `--workspace` and silently recompiles the whole
#      dependency graph. A `cargo test -p sbproxy-e2e` step used to rebuild
#      179 crates to run two tests.
#   2. A lane that genuinely needs a different package selection (e2e) gets
#      its own job and its own cache key rather than paying that rebuild
#      inline on the critical path.
#
# --- Actions cache budget (10 GB per repo, LRU; inventoried 2026-08-18) ---
# Every rust-cache key a PR restores must still exist when the PR runs, or
# the lane pays a cold build. The repo held ~12 GB of entries against the
# 10 GB limit, so the least-recently-restored keys (payments, release, e2e)
# kept getting evicted between a main-push save and the next PR restore;
# that churn is the whole median-vs-worst spread in lane times (payments
# 10m49 median vs 20m36 worst, and a 24m18 lint outlier that spent 15m30
# inside cache restore). The lines below are the steady-state writers and
# their approximate sizes; entries marked (est.) were already evicted at
# inventory time and are sized from their feature unions.
#
#   test                    ~1.3 GB
#   lint                    ~0.8 GB
#   e2e                     ~2.0 GB (est.; obs-budgets + e2e-subset share
#                                    it, e2e.yml's weekly run refreshes it)
#   payments                ~1.5 GB (est.; written by the payments test
#                                    job only, never by payments-clippy)
#   embed-admin-ui          ~0.8 GB
#   release                 ~2.0 GB (est.; release-profile deps, -p sbproxy)
#   msrv                    ~0.8 GB (msrv.yml; pruned to one generation there)
#   codeql overlays + node  ~0.1 GB
#   ----------------------------------
#   total                   ~9.3 GB, ~0.7 GB headroom for estimate error
#
# The sum fits only because three scheduled/tag lanes that held ~6.2 GB
# are restore-only now: certify-model-host-deterministic (~2.6 GB,
# release.yml) and the two context-compression keys (~2.0 GB + ~1.6 GB,
# context-compression-eval.yml). Do not add a cache key, and do not
# re-enable one of those saves, without redoing this arithmetic; the
# budget has no room for another multi-GB line. A Cargo.lock bump briefly
# doubles some lines with a second generation; a superseded generation is
# never restored again once the newer one exists, so LRU evicts it first
# and the set self-corrects. Tag and nightly workflows (release.yml's
# build matrix, release-checks.yml) still write occasional lines outside
# this budget; whatever those evict re-saves on the next push to main.
#
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default to no permissions; jobs that need more set their own.
# CodeQL (actions/missing-workflow-permissions) wants every workflow
# to declare its permissions explicitly rather than rely on the
# repo-level default.
permissions:
  contents: read

# Cancel superseded runs on the same ref so force-pushes don't burn
# minutes finishing the obsolete commit's jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Full debuginfo was roughly 30% of rustc wall time here and the bulk of a
  # 3.4 GB target directory, which pushed the repo past the 10 GB Actions
  # cache limit and made every restore a partial one. line-tables-only still
  # gives file and line numbers in RUST_BACKTRACE output, which is all CI
  # ever reads.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # WOR-2222: before the payments lane existed, no cargo invocation anywhere
  # in this repository, in scripts/check.sh, or in any other workflow ever
  # enabled a payment feature. The only `--all-features` in the repo is
  # cargo-deny's, and cargo-deny reads metadata instead of compiling. So the
  # whole settlement path built nowhere: sbproxy-core's inline settle gate,
  # the recovery worker and reconciliation sweep in billing_runtime, the
  # usage bridge's runtime half, and every one of sbproxy-billing's
  # feature-gated modules, which is most of that crate. Roughly 217 tests,
  # including eleven of its twelve integration test files, compiled into
  # nothing and reported as passing.
  #
  # One feature selection, named once here at workflow level and used
  # verbatim by the two payments jobs below. Two per-job literals that
  # drifted by a single rail would resolve two feature unions behind one
  # cache key, which is both the recompile this file's whole shape exists
  # to avoid and a lint pass quietly checking a different union than the
  # tests run.
  #
  # Selected through the `sbproxy` binary's flags rather than
  # `sbproxy-core`'s, so the union is the one a real payments release
  # produces: everything the `test` lane already resolves (rag-full,
  # agent-class, inprocess-*, tls-fingerprint, gpu-*) plus settlement.
  # That makes this union a strict superset of the `test` lane's. Picking
  # `-p sbproxy-core` instead, as the smallest thing that covers the gated
  # modules, would resolve FEWER features than CI does and report dead-code
  # failures CI never sees, and it would miss sbproxy-billing's test targets
  # entirely. See CLAUDE.md, "A per-crate lint can fail while the workspace
  # lint passes".
  #
  # All six rails at once, `payment-lightning-lnd` included. Every rail
  # implies `payments`, so naming the rails is enough. The resolved
  # dependency graph under this union is identical to the default one,
  # crate for crate and version for version: rusqlite, tokio, rand,
  # reqwest, and aes-gcm are all already pulled in by something else in the
  # workspace. The extra rails therefore cost compile units, not a wider
  # supply chain.
  PAYMENT_FEATURES: sbproxy/payment-mpp,sbproxy/payment-stripe,sbproxy/payment-x402,sbproxy/payment-lightning-cln,sbproxy/payment-lightning-lnd

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      observability: ${{ steps.filter.outputs.observability }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '!**.md'
              - '!docs/**'
              - '!examples/**'
              - '!LICENSE'
              - '!NOTICE'
              - '!.gitignore'
            observability:
              - 'crates/sbproxy-observe/**'
              - 'crates/sbproxy-modules/src/policy/**'
              # The obs-budgets lane's own test targets. Without these a
              # PR could rewrite the assertions the lane is named for and
              # never run the lane that would have checked them, which is
              # how both files drifted into asserting less than they said.
              - 'e2e/tests/cardinality.rs'
              - 'e2e/tests/metrics_per_agent.rs'
              - 'e2e/tests/redaction.rs'
              - '.github/workflows/ci.yml'
            ui:
              - 'ui/**'

  test:
    name: test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # The workspace's target/ plus ~/.cargo/registry/ outgrows the runner's
      # free space, which crashes the rust-cache post-step on `No space left
      # on device`, so the composite reclaims disk first. libclang-dev is
      # needed for rquickjs-sys's bindgen build script; without it clang's
      # bundled stdbool.h is missing from the include path and the build
      # fails with `'stdbool.h' file not found`. redis-server backs the live
      # Redis tests below. Most of them own an isolated ephemeral-port
      # process rather than sharing mutable CI state; the two governance
      # suites are the documented exception and the step below explains
      # why sharing one daemon is safe for them.
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: test
          install-redis: 'true'

      - uses: taiki-e/install-action@nextest

      # One build for the whole lane. `--workspace --exclude sbproxy-e2e` is
      # the package selection every later cargo call in this job repeats
      # verbatim, so they all resolve the same feature union and reuse these
      # artifacts instead of recompiling the graph.
      #
      # This also produces target/debug/sbproxy and the generate-* binaries
      # the freshness checks below exec directly.
      - name: build workspace
        run: cargo build --workspace --exclude sbproxy-e2e --locked

      # The bulk of the e2e suite is intentionally OUT OF SCOPE for this
      # job. Those tests spin up the full proxy binary, listen on real
      # ports, and exercise the network stack; on shared CI runners the
      # heavier ones (mesh gossip, websocket upgrade) hit startup-timeout
      # flakiness that does not signal a real regression. Run them locally
      # with `cargo test --workspace` after building the binary, or rely
      # on the scheduled lanes. Two narrow slices are the exception: the
      # cardinality and redaction canaries in the obs-budgets job, and the
      # required offline subset in the e2e-subset job (WOR-2469).
      - name: test (excludes e2e)
        run: cargo nextest run --workspace --exclude sbproxy-e2e --locked --profile ci

      # These tests are #[ignore]d in the default lane because they require a
      # redis-server executable. CI installs Redis above and runs them through
      # the same invocation shape as the lane above so they reuse its
      # artifacts. Running them as `cargo test -p sbproxy-platform` instead
      # cost 2m07 of pure recompilation for a handful of assertions.
      # -j1 replaces the old `--test-threads=1`.
      #
      # `governance_redis` and `quota_pool_redis` (WOR-2300) are the one
      # exception to the isolated-process rule stated at the top of this
      # job. Unlike the suites above, which spawn their own `DisposableRedis`
      # on an ephemeral port, those two read a `REDIS_URL` and hard-fail
      # without one, so this step starts a single shared daemon for them.
      # Sharing is safe here and nowhere else because both files derive
      # every key they touch from a `unique_prefix()` helper built from the
      # process id plus a nanosecond timestamp
      # (crates/sbproxy-ai/tests/governance_redis.rs and
      # crates/sbproxy-ai/tests/quota_pool_redis.rs), neither one ever issues
      # FLUSHDB or FLUSHALL, and neither reads a key it did not write. Two
      # tests, two runs, or two jobs therefore cannot collide on a key. The
      # daemon runs with persistence off and a working directory outside the
      # checkout so no dump.rdb lands in the tree and trips a later
      # freshness check.
      - name: Redis live state (secure DSN + Lua fencing + recovery)
        env:
          REDIS_URL: redis://127.0.0.1:6399
        run: |
          redis-server --version
          tls_probe_output="$(redis-server --port 0 --tls-port 1 2>&1 || true)"
          if ! grep -q 'No tls-cert-file configured' <<<"${tls_probe_output}"; then
            echo "::error::redis-server lacks the TLS support required by secure Redis tests"
            exit 1
          fi
          unset tls_probe_output
          if ! command -v redis-cli >/dev/null 2>&1; then
            echo "::error::redis-cli is required to probe the shared governance Redis daemon"
            exit 1
          fi
          shared_redis_dir="$(mktemp -d)"
          redis-server --port 6399 --bind 127.0.0.1 --save '' --appendonly no \
            --dir "${shared_redis_dir}" --daemonize yes
          for _ in $(seq 1 50); do
            if redis-cli -p 6399 ping >/dev/null 2>&1; then
              break
            fi
            sleep 0.2
          done
          if ! redis-cli -p 6399 ping; then
            echo "::error::shared Redis on 6399 never became ready"
            exit 1
          fi
          cargo nextest run --workspace --exclude sbproxy-e2e --locked --profile ci \
            --run-ignored only -j1 \
            -E 'binary(redis_secure) + test(compression_store::redis::tests::live_redis_) + test(storage::async_redis::tests::redis_connection_recovers_after_server_restart) + test(semantic_cache_runtime::redis::tests::live_redis_semantic_) + binary(governance_redis) + binary(quota_pool_redis)'

      # nextest does not execute doctests, so they need their own pass.
      - name: doctests
        run: cargo test --workspace --exclude sbproxy-e2e --locked --doc

      # These checks exec the binaries produced by the `build workspace` step.
      # Left to themselves they run `cargo run -p <crate>`, which re-resolves
      # features for a single package and rebuilds.
      - name: generated artifacts are current
        env:
          SBPROXY_PREBUILT_BINS: '1'
        run: |
          bash scripts/check-config-schema.sh
          bash scripts/check-config-readers.sh
          bash scripts/check-model-host-capabilities.sh
          bash scripts/check-metrics-stability.sh
          bash scripts/check-decision-contract.sh

      # dead_code cannot see a `pub` item inside a `pub mod` of a library
      # crate, so write-only code lands with a green build. This ratchet
      # stops the count from growing while the existing backlog is worked
      # down. Runs without the enterprise cross-check, which is fine: the
      # count is the same either way, and the cross-check only matters
      # before a deletion.
      - name: no new pub items whose only consumer is a test (WOR-2065)
        run: bash scripts/check-pub-item-ratchet.sh

      - name: install.sh verifies its download (WOR-1914)
        run: sh scripts/tests/install_verify.sh

      - name: prometheus rules validate and the SLO burns (WOR-1894)
        run: |
          PROMTOOL_VERSION=2.53.1
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${PROMTOOL_VERSION}/prometheus-${PROMTOOL_VERSION}.linux-amd64.tar.gz" \
            | tar xz -C /tmp
          sudo install "/tmp/prometheus-${PROMTOOL_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool
          bash scripts/check-prometheus-rules.sh

      # Only meaningful ahead of a cache save, which now happens on main only.
      - name: cleanup build artifacts
        if: always() && github.ref == 'refs/heads/main'
        run: bash scripts/cleanup-build-artifacts.sh --ci

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45  # was 30; hit the wall twice on 2026-08-18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: gate helper self-tests
        run: |
          bash scripts/tests/workspace_bin_test.sh
          bash scripts/tests/runner_disk_test.sh

      # clippy-driver and rustdoc write artifacts the `test` lane cannot link
      # against, so this job keeps its own cache entry rather than fighting
      # the test lane over one key. That mutual uselessness is also why these
      # steps are worth moving off the critical path: the 3m15 they spend is
      # never reused by the build.
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: lint
          components: rustfmt, clippy

      - name: fmt
        run: cargo fmt --all -- --check

      # A GIF is the worst place for a secret to land: nothing greps it,
      # no secret scanner reads it, and it survives every later edit to
      # the doc around it. Two shipped that way before this existed.
      - name: no tape renders a credential into a GIF
        run: bash scripts/check-tape-secrets.sh

      # A tape whose output was never recorded, and a README embedding the
      # GIF that recording would have produced, are one failure seen from
      # two sides. `make tapes-check` keeps tapes in sync with their example
      # configs and never opens docs/assets/; wire-example-gifs.py only
      # inserts an image that already exists. Neither can see this, and both
      # passed while a reader got a broken image mid-walkthrough. Also runs
      # in docs-ci.yml, which is the lane a docs-only PR actually reaches.
      - name: every promised doc asset exists
        run: python3 scripts/check-doc-assets.py

      # Shares one script with scripts/check.sh so the local gate fails on
      # the same drift, instead of this being the only place that looks.
      # The script discovers the nested workspaces rather than listing
      # them, so a new one is covered when it lands.
      - name: standalone workspace lockfiles are current
        run: bash scripts/check-nested-lockfiles.sh

      # Reject internal tracker placeholders in source-available rustdoc.
      # A literal `WOR-XXX` is an unfinished TODO that announces incomplete
      # work without making it trackable. If a tracker reference is needed,
      # use a full URL or replace it with a descriptive sentence.
      - name: no internal tracker placeholders
        run: |
          if grep -rn 'WOR-XXX' crates/ --include='*.rs' --include='*.toml'; then
            echo "::error::WOR-XXX placeholders are not allowed; open a real ticket or rewrite as prose"
            exit 1
          fi

      # Reject process-global env mutation outside the documented
      # per-crate test helpers. Production code must not call
      # std::env::set_var / remove_var at all; the semantic race those
      # calls carry is why Rust 2024 makes them unsafe. Shares one
      # script with scripts/check.sh so the local gate fails on the
      # same violation.
      - name: no process-global env mutation outside test helpers
        run: bash scripts/check-env-mutation.sh

      # Apache 2.0 section 4(d): every Apache-2.0-only crate must be
      # named in NOTICE. Shares one script with scripts/check.sh.
      # cargo metadata does not compile and does not change this job's
      # package selection.
      - name: NOTICE covers Apache-2.0-only crates (WOR-2449)
        run: bash scripts/check-notice.sh

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: doc
        env:
          RUSTDOCFLAGS: -D warnings -D missing_docs
        run: cargo doc --workspace --no-deps --locked

  obs-budgets:
    name: observability budgets
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.observability == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # sbproxy-e2e widens the feature union past what the `test` lane
      # selects, so its artifacts live behind their own key. Running these two
      # tests inline on the test lane cost 3m12, of which 3m09 was recompiling
      # 179 crates under the changed feature set.
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: e2e

      # `--workspace` rather than `-p sbproxy-e2e` so both calls in this job
      # agree on the feature union and the build is paid once. cargo cannot
      # infer that `cargo test -p sbproxy-e2e` needs the sbproxy binary
      # first, so it is built explicitly.
      - name: build sbproxy binary (for the e2e harness)
        run: cargo build --workspace --locked

      # Cardinality + redaction regressions are easy to break silently
      # (a new label sneaks in, the limiter overflows into __other__,
      # a redactor regex misses a new shape). This canary runs only when
      # observability or policy code changed. `--test <name>` selects these
      # three targets out of the 170 under e2e/tests.
      #
      # metrics_per_agent is the cardinality half that needs a process.
      # It lowers hostname_cap in config, drives 250 distinct hostnames
      # through a spawned proxy, and asserts the __other__ sentinel and
      # the overflow counter both land in a real /metrics scrape. It was
      # written for exactly this property and sat outside the lane named
      # for it, running only in the weekly e2e sweep, while cardinality.rs
      # held an ignored stub of the same idea. Same package selection as
      # the two targets already here, so it adds no rebuild.
      - name: observability budgets (cardinality + redaction)
        run: >-
          cargo test --workspace --locked
          --test cardinality --test metrics_per_agent --test redaction

  e2e-subset:
    name: e2e subset (required)
    needs: changes
    # WOR-2469: PR #1049 changed 425 lines across request_phase.rs and
    # proxy_http.rs, merged with every required check green, and altered
    # four documented end-to-end behaviors, one of them an outright break
    # of a shipped example (WOR-2468). The only tests that assert
    # end-to-end observable behavior ran weekly, so the break sat on main
    # for three days. This lane closes that false green: a small offline
    # slice of the e2e suite runs on every code PR, and it is required.
    #
    # The broad `code` filter, deliberately, and not an allowlist of the
    # two files #1049 touched, for the same reason the payments lane
    # documents below: what this lane guards is assembled end-to-end
    # behavior, and that breaks from sbproxy-modules, sbproxy-transport,
    # config compilation, and the pingora glue just as well as from
    # request_phase.rs. A lane that does not fire on the change that
    # breaks it reports success while doing nothing.
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # The harness's documented override for an unusually slow host
      # (e2e/src/lib.rs). Shared runners need more startup headroom than
      # a quiet dev machine; e2e.yml sets the same value.
      SBPROXY_E2E_STARTUP_TIMEOUT_SECS: '60'
    steps:
      - uses: actions/checkout@v5

      # Same package selection and cache key as obs-budgets: sbproxy-e2e
      # widens the feature union past the `test` lane's, so its artifacts
      # live behind the `e2e` key. On a push to main both jobs may reach
      # the save step for this key; the second save finds the entry
      # already present and skips, so sharing the key is cheaper than a
      # third multi-GB cache line against the 10 GB per-repo limit.
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: e2e

      # `--workspace` rather than `-p sbproxy-e2e` so both calls in this
      # job agree on the feature union and the build is paid once. cargo
      # cannot infer that the harness spawns the sbproxy binary at
      # runtime, so the build step produces it explicitly.
      - name: build sbproxy binary (for the e2e harness)
        run: cargo build --workspace --locked

      # The subset, five files, retracing three of #1049's four silent
      # behavior changes plus the response-phase class the sessions
      # example documents (the fourth, MCP session-id freshness, lives in
      # the MCP stream tests, which are too heavy for the offline bar):
      #
      #   static_action  - harness smoke; "if this fails everything else
      #                    is suspect" (its own module doc)
      #   body_routing   - JSON-body forward_rules routing, the exact
      #                    shipped-example shape #1049 broke (WOR-2468)
      #   sessions       - session-cookie issuance in the proxied response
      #                    filter, the shipped sessions example's
      #                    contract; response-filter injection is the
      #                    rubric's recurring silent-no-op class
      #   admin_reload   - POST /admin/reload swaps the live pipeline;
      #                    #1049 changed the rejected-reload status
      #   transform_json - response-transform contracts including the
      #                    fail_on_error failure path, whose status
      #                    semantics #1049 changed undocumented
      #
      # Selection bar, in order: offline (MockUpstream or static actions
      # on loopback; no mesh, no websockets, no Redis, no payments or
      # no-default-features binary), absent from the known load-flake
      # roster, and covering a behavior a shipped example documents.
      # model_cluster_control is deliberately NOT here: its root-cause
      # fix (#1142) is a day old, and a test earns a place in a required
      # lane by a quiet scheduled history first. Grow the list under the
      # same bar; one timing-sensitive test flaking here would burn trust
      # in exactly the lane that exists to restore it.
      #
      # --test-threads=1 for the same reason e2e.yml runs the full suite
      # single-threaded: every test spawns its own proxy process with a
      # multi-core tokio runtime, and parallel harnesses oversubscribe
      # the runner. A handful of tests; the serialization costs seconds.
      # SBPROXY_E2E_BIN pins the harness to the binary this job just
      # built, because the harness prefers target/release/sbproxy when
      # one is present and nothing restored from cache may shadow the
      # code under test.
      - name: e2e subset (shipped-example behavior)
        env:
          SBPROXY_E2E_BIN: ${{ github.workspace }}/target/debug/sbproxy
        run: >-
          cargo test --workspace --locked
          --test static_action --test body_routing --test sessions
          --test admin_reload --test transform_json
          -- --test-threads=1

  payments:
    name: payments (settlement features)
    needs: changes
    # The broad `code` filter, deliberately, and not a narrow allowlist of the
    # payment paths. What this lane guards is a feature UNION, and a union
    # breaks from outside the files it covers: `sbproxy-billing` reaches the
    # network through `sbproxy-httpkit`, its types are shared with the crawl
    # policy in `sbproxy-modules`, and the runtime is assembled in
    # `sbproxy-core`'s lifecycle. A filter listing only crates/sbproxy-billing
    # would have shown green for every one of those. A lane that does not fire
    # on the change that breaks it is worse than no lane, because it reports
    # success while doing nothing, which is the exact failure WOR-2222 is
    # about.
    #
    # This job and payments-clippy below are one lane in two halves. They
    # used to be two serial steps of one job, but the two compiles share no
    # artifacts (clippy-driver's output cannot be linked by a test build), so
    # serial cost clippy + test where the split costs max(clippy, test):
    # about 2m30 off the lane, which was the PR critical path on the runs
    # where it came back cold. Both halves use the same package selection,
    # the same PAYMENT_FEATURES union (defined once, at workflow level), and
    # the same cache key, and both are in the `build / test` aggregator's
    # needs list.
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # Its own cache key, per the one-package-selection rule in CLAUDE.md:
      # the package selection matches the `test` lane's exactly and only the
      # feature union differs, but a different union is a different
      # fingerprint. This job is the payments key's ONLY writer:
      # payments-clippy restores the same key read-only, so a push to main
      # has exactly one save and the two halves cannot race on it. The saved
      # entry still serves both halves, because cargo clippy sends only
      # workspace members through clippy-driver; the dependency graph
      # compiles under plain rustc either way, so the dependency artifacts
      # saved here are exactly what the clippy job restores.
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: payments

      - uses: taiki-e/install-action@nextest

      # Narrow the tests, never the packages. The build stays
      # `--workspace --exclude sbproxy-e2e` so the feature union is the one
      # the payments-clippy job lints, and the filterset selects the three
      # crates that carry payment-gated code. Re-running the other ~8500
      # workspace tests under a union that differs only in payment features
      # would buy a second roll against the same known flakes and nothing
      # else.
      #
      # `package(...)` rather than a list of module or binary names on
      # purpose: a payment test added to a module nobody remembered to add to
      # a hand-maintained list would silently not run, which is the shape of
      # the bug this lane exists to prevent.
      #
      # The price of that choice is that sbproxy-core's whole suite runs here
      # too, including `model_host_reload`, which is a known flake. Excluding
      # it by name would be safe (an exclusion cannot hide a new payment test
      # the way a stale inclusion list can) and it is already covered by the
      # `test` lane, so subtract it here if the reruns become a tax. It is not
      # subtracted today because one maintained list in this lane invites the
      # next one.
      - name: test (payment-gated crates)
        run: |
          cargo nextest run --workspace --exclude sbproxy-e2e --locked --profile ci \
            --features "${PAYMENT_FEATURES}" \
            -E 'package(sbproxy-billing) + package(sbproxy-core) + package(sbproxy-modules)'

  payments-clippy:
    name: payments clippy (settlement features)
    needs: changes
    # Same broad `code` filter as the payments test half, for the reason
    # documented there: the union this lane guards breaks from outside the
    # payment files.
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # Same cache key as the payments test job: same package selection, same
      # feature union, same fingerprint, so per the unions-define-cache-keys
      # rule the two halves share one entry rather than holding two multi-GB
      # lines against the budget in this file's header. Restore-only
      # (cache-save: 'false') so the test half stays the key's only writer.
      # The restored dependency artifacts are fully reusable here: only
      # workspace members compile under clippy-driver, so this job recompiles
      # the workspace crates each run and nothing else.
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: payments
          cache-save: 'false'

      # The only clippy pass anywhere that compiles payment-gated code. It is
      # worth its own compile of the graph rather than being folded into the
      # lint lane, because a different feature union is a different
      # fingerprint and the lint lane's cache could not absorb it.
      #
      # -D warnings also promotes the `#![warn(missing_docs)]` at the top of
      # sbproxy-billing to an error, so undocumented public items in the
      # gated modules fail here rather than at the next release.
      - name: clippy (payment settlement features)
        run: |
          cargo clippy --workspace --exclude sbproxy-e2e --all-targets --locked \
            --features "${PAYMENT_FEATURES}" -- -D warnings

  ui:
    name: ui
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: ui typecheck and test
        working-directory: ui
        run: |
          npm ci
          npm run typecheck
          npm run test -- --run

  embed-admin-ui:
    name: release feature (embed-admin-ui)
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # WOR-2133: this combination is what every release image builds
      # (Dockerfile.cloudbuild, Dockerfile.gateway, Dockerfile.worker all run
      # `cargo build --bin sbproxy --features embed-admin-ui --locked`), and
      # until now nothing on a PR compiled it. `embed-admin-ui` is in no
      # default feature set, so `cargo build --workspace`,
      # `cargo clippy --workspace --all-targets`, and `scripts/check.sh` all
      # miss it, and a break reaches a tag instead of a PR. It cost ten
      # compile errors that only showed up in `docker compose build`.
      #
      # Why this lane is worth its runner minutes rather than a one-off fix:
      # the workspace resolves TWO prometheus versions. 0.13.4 arrives through
      # the pingora fork (pingora-core), 0.14 is the workspace pin, and
      # sbproxy-core has both in its graph. Which one a given metric call
      # resolves through depends on feature unification, which is exactly what
      # this feature changes. The reported errors ("expected `&[&String]`,
      # found `&[&str; 4]`", pointing into prometheus-0.14.0/src/vec.rs) are
      # that ambiguity surfacing. They do not reproduce on this commit, but
      # nothing has deduplicated the two versions, so the hazard is latent and
      # only a lane that compiles this union will catch its return.
      #
      # Its own job with its own cache key, per the one-package-selection
      # rule in CLAUDE.md: this feature union differs from the `test` lane's,
      # so sharing that job would recompile the graph on the critical path.
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: embed-admin-ui

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # `include_dir!` reads ui/dist at compile time, so the SPA has to exist
      # before cargo runs. Without it the build fails inside the macro and
      # never reaches the code this lane is here to check.
      - name: build the admin SPA
        working-directory: ui
        run: |
          npm ci
          npm run build

      # `cargo check` rather than `cargo build`: this lane exists to catch
      # type and feature-resolution breakage, which check finds. Codegen for
      # the real release binary is the release-build job's work, and paying
      # for it twice on every PR is what the profile split above avoids.
      - name: check the release feature union
        run: cargo check --bin sbproxy --features embed-admin-ui --locked

  supply-chain:
    name: supply chain (cargo-deny + npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # Runs advisories + bans + licenses + sources against deny.toml.
      # See SUPPLY-CHAIN.md section 4.3 for the policy rationale.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
          log-level: warn

      # The admin SPA is a second ecosystem and cargo-deny cannot see it.
      # `ui/` is a Vue + Vite app with its own `package-lock.json`, it is
      # built into `ui/dist` and embedded into the release binary by the
      # `embed-admin-ui` feature, and until this step existed nothing in
      # this repository scanned it. The gap was not theoretical: a high
      # severity advisory against `nanoid` (transitive, via postcss) sat
      # open while every Rust lane was green, because no Rust tool reads a
      # npm lockfile.
      #
      # This lives here rather than in the `ui` job on purpose. The `ui`
      # job is path-filtered to `ui/**`, so it is skipped on most pull
      # requests, and a security gate that only runs when someone happens
      # to touch the directory is green precisely when a newly published
      # advisory needs to turn it red. This job has no `needs: changes`
      # and no `if:`, so both ecosystems get scanned on every run, which
      # is the same reason cargo-deny is unconditional.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `--package-lock-only` resolves the tree from `package-lock.json`
      # without installing anything, so this needs no `npm ci` and no
      # `node_modules`. `npm ci` installs exactly what the lockfile pins,
      # so auditing the lockfile and auditing the installed tree are the
      # same audit.
      #
      # Threshold: `high`, meaning high and critical fail and moderate and
      # below only print. The tree is 112 dev dependencies against 27
      # production ones, almost all of it build tooling (Vite, vitest,
      # vue-tsc), and that kind of tree carries a steady background of
      # moderate transitive advisories in tooling that never reaches a
      # browser. Gating on moderate would make this lane a rotating chore,
      # and a gate people route around is worse than a narrower one they
      # respect. High and critical is the bar that catches the class of
      # finding worth blocking a merge for, and it would have caught the
      # nanoid advisory above. Raise it to moderate if the noise turns out
      # to be lower than expected; do not lower it past high.
      - name: npm audit (admin UI)
        working-directory: ui
        run: npm audit --package-lock-only --audit-level=high

  release-build:
    name: release build
    # Only run on pushes to main, not on pull_request events. Release builds
    # take 16-17 runner-minutes (lto = "fat", codegen-units = 1); skipping
    # them on PRs saves those minutes and avoids double-billing when a
    # squash-merge PR lands (the merge commit re-triggers on push anyway).
    # Deliberately kept on the true release profile: a smoke test built with
    # a faster profile would not catch LTO-only breakage, and discovering
    # that at tag time is the expensive failure.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # `sbproxy-classifiers` has a `build.rs` that runs `tonic-build`,
      # which needs `protoc` on PATH (added by PR #156, Classifier Judge
      # RPC). The main `test` job already installs it; the release-build
      # job is a separate runner so it needs the same install.
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: release
          free-disk: 'false'

      - name: build release binary
        run: cargo build --release -p sbproxy --locked

      - name: smoke test the binary
        run: |
          test -x target/release/sbproxy
          file target/release/sbproxy
          ls -lh target/release/sbproxy
          # Binary exits 1 with a usage banner when no args. Capture stderr,
          # confirm the banner is present, and treat exit 1 as success.
          ./target/release/sbproxy 2>&1 | tee /tmp/sb.out || true
          grep -q 'Usage: sbproxy' /tmp/sb.out

  # The single required status check. Keeping the `build / test` name means
  # branch protection needs no change while the work underneath it fans out
  # across parallel jobs. A lane skipped by its path filter is not a failure;
  # anything else is. Every lane job in this file must be added to the
  # needs list below in the same commit that adds the job: a required
  # aggregate that does not need a lane reports green while that lane
  # fails, so the lane's red goes unreported.
  #
  # `payments` and `payments-clippy` are in this list rather than left
  # advisory. An advisory lane on
  # the settlement path is a lane whose red is a notification, and the reason
  # WOR-2222 exists is that nobody was watching a signal that was never sent
  # in the first place. A second one that can be scrolled past is not an
  # improvement. The cost of being wrong in the two directions is not
  # symmetric either: a false red here is a rerun, while a false green ships
  # code that moves money.
  #
  # `e2e-subset` is in the list on the same asymmetry: a false red is a
  # rerun, while a false green is a behavior change or an outright break
  # sitting on main until the weekly sweep notices, which is how WOR-2468
  # went out and stayed out for three days (WOR-2469).
  required:
    name: build / test
    if: always()
    needs: [changes, test, lint, obs-budgets, e2e-subset, payments, payments-clippy, ui, supply-chain, embed-admin-ui]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: every lane passed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "lane results: ${results}"
          status=0
          for result in ${results}; do
            case "${result}" in
              success | skipped) ;;
              *)
                echo "::error::a required lane concluded '${result}'"
                status=1
                ;;
            esac
          done
          exit "${status}"

  # macOS regression coverage and single-threaded test-isolation runs
  # live in release-checks.yml and run on tag pushes plus
  # workflow_dispatch. Per-PR coverage is debug-test on Linux only.

  # ACME integration against Pebble and single-threaded test isolation
  # live in release-checks.yml and run on tag pushes plus
  # workflow_dispatch. Per-PR coverage is debug-test on Linux only.
  # macOS regression coverage is intentionally not in CI: developers
  # working on Darwin catch portability issues locally before pushing.
