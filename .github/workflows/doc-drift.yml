# Guards against regression of the provider-count and routing-strategy
# claims in user-facing docs. Lives separately from docs-ci.yml so the
# lychee link-check (which is currently failing on pre-existing
# fragments outside this PR's scope) does not block this lighter check.

name: doc-drift

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'llms.txt'
      - 'README.md'
      # The three targets below were policed by the script and had no
      # trigger, so a PR touching only one of them never ran the lane.
      # MIGRATION.md is the page WOR-2627 found still claiming "90+".
      - 'MIGRATION.md'
      - 'SECURITY.md'
      - 'CLAUDE.md'
      # The provider count is now read from the catalog, so a PR that
      # adds a provider and updates no prose is exactly the PR this
      # lane has to run on.
      - 'crates/sbproxy-ai/data/**'
      - 'schemas/sb-config.schema.json'
      - 'scripts/check-doc-drift.sh'
      - '.github/workflows/release.yml'
      - '.github/workflows/doc-drift.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: doc-drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: check doc drift
        run: |
          set -euo pipefail
          if [ ! -x scripts/check-doc-drift.sh ]; then
            chmod +x scripts/check-doc-drift.sh
          fi
          bash scripts/check-doc-drift.sh
