# Docs CI (Wave 1, B1.10).
#
# Runs the documentation lint + executable-snippet harness on every PR
# that touches this repository's docs or the runner script itself. The
# actual checks live in scripts/docs-ci.sh, owned by
# the QA lane (Q1.10); this workflow only invokes it.
#
# Two passes happen inside scripts/docs-ci.sh:
#
#   1. Link check via lychee (broken external + relative links).
#   2. Code-block syntax checks via rustc and bash.
#
# We cache the lychee `.lycheecache/` directory between runs so the
# external HTTP HEAD checks do not hammer upstream sites on every push.

name: docs-ci

on:
  pull_request:
    paths:
      # The docs live at the repo root's docs/; the old sbproxy-rust/
      # prefix predates the repo split and matched nothing, so this
      # workflow never fired on doc changes.
      - 'docs/**'
      - 'README.md'
      - 'MIGRATION.md'
      - 'CHANGELOG.md'
      - 'examples/**'
      - 'Makefile'
      - 'scripts/docs-ci.sh'
      - 'scripts/sync-doc-configs.py'
      - 'scripts/check-spec-citations.sh'
      - 'scripts/gen-example-tapes.py'
      - 'scripts/record-tapes.sh'
      - 'scripts/wire-example-gifs.py'
      - 'scripts/check-doc-assets.py'
      - 'scripts/tests/test_doc_generators.py'
      - 'scripts/regen-llms-full.sh'
      - '.lycheeignore'
      - '.github/workflows/docs-ci.yml'

# Default to read-only contents access for every job in this workflow.
# CodeQL (actions/missing-workflow-permissions) wants every workflow
# to declare its permissions explicitly rather than inherit a broader
# default from the repo settings.
permissions:
  contents: read
  # The llms-full guard below asks the API for the PR's file list.
  pull-requests: read

# Cancel superseded runs on the same ref so force-pushes do not
# double-spend runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-ci:
    name: docs / lint + exec
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # --- Cache lychee link-check results ---
      #
      # Keyed off the .lycheeignore content plus a calendar-day suffix so
      # the cache rolls over once a day; that prevents stale 200-cached
      # entries from masking newly-broken links indefinitely while still
      # avoiding per-PR upstream traffic.
      - name: cache lychee
        uses: actions/cache@v5
        with:
          path: .lycheecache
          key: lychee-${{ hashFiles('.lycheeignore') }}-${{ github.run_id }}
          restore-keys: |
            lychee-${{ hashFiles('.lycheeignore') }}-

      - name: install lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # We do not want the action to *run* lychee here; we just want
          # the binary on PATH so scripts/docs-ci.sh can invoke it. The
          # action's `args: '--version'` is the lightest no-op.
          args: --version
          fail: false

      - name: install rust toolchain
        uses: ./.github/actions/pinned-toolchain

      - name: install nextest
        uses: taiki-e/install-action@nextest

      - name: run docs-ci
        env:
          # Honor CI=true inside the script so it can switch to
          # GitHub-Actions-friendly output (problem matchers, no TTY
          # colors, etc.).
          CI: "true"
        run: |
          set -euo pipefail
          if [ ! -x scripts/docs-ci.sh ]; then
            echo "scripts/docs-ci.sh is not executable or not present yet."
            echo "It is owned by Q1.10; this workflow waits for that to land."
            echo "Failing closed."
            exit 1
          fi
          bash scripts/docs-ci.sh

      - name: documentation configs match canonical examples
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/sync-doc-configs.py --check
          cargo nextest run -p sbproxy-config --test validate_examples \
            -E 'test(every_oss_example_compiles)' --locked

      - name: generated tapes and GIF wiring are current
        run: make tapes-check

      # The step above never opens docs/assets/, and wire-example-gifs.py
      # only inserts an image that is already on disk, so neither can see a
      # tape whose recording was never run or a README embed pointing at
      # the GIF it would have produced. This lane is the one a docs-only PR
      # reaches; ci.yml's lint lane runs the same script for code PRs.
      - name: every promised doc asset exists
        run: python3 scripts/check-doc-assets.py

      # WOR-528: catch the four spec-citation regressions called out in
      # the 2026-05-15 Public RFCs audit before they ship.
      - name: spec citation hygiene
        run: bash scripts/check-spec-citations.sh

      # WOR-1826 asked every branch to regenerate docs/llms-full.txt so
      # the corpus never drifted from the docs. That worked, and it also
      # meant two concurrent doc PRs always conflicted on a 2 MB
      # generated file. WOR-2119 answered that by having a workflow push
      # the file to main after every merge, and rejecting any branch
      # that carried it.
      #
      # That push is gone. `main` requires a pull request now, so the
      # workflow's direct push was refused on every run and the corpus
      # went stale while CI stayed green. Rather than hand a bypass
      # credential to a docs generator, regeneration moved to release
      # prep: a release cannot be cut with a stale corpus, enforced by
      # release-checks.yml, and the file is allowed to go stale in
      # between.
      #
      # So this step no longer forbids the file. It requires that a
      # branch carrying it carries the generator's own output, which is
      # what stops a hand edit. Conflicts are back in principle, but
      # only between branches that opt into regenerating, and ordinary
      # doc PRs have no reason to.
      - name: llms-full.txt is current if carried
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Ask the API which files the PR touches rather than diffing
          # locally: checkout is shallow here, so the merge base a
          # `base...HEAD` diff needs is usually not in the clone.
          if ! gh pr view "${{ github.event.pull_request.number }}" \
                 --json files --jq '.files[].path' \
               | grep -qx 'docs/llms-full.txt'; then
            echo "docs/llms-full.txt untouched by this branch"
            exit 0
          fi
          # `--check` reuses the committed `Generated:` timestamp, so a
          # current corpus does not read as stale on its header alone.
          if bash scripts/regen-llms-full.sh --check; then
            echo "docs/llms-full.txt matches the generator"
            exit 0
          fi
          # Workflow commands are read from stdout, so the annotation
          # has to go there rather than stderr to reach the PR.
          cat <<'MSG'
          ::error::docs/llms-full.txt does not match the generator.

          This branch changes the corpus, so it has to be generated
          output rather than a hand edit. Regenerate it:

            bash scripts/regen-llms-full.sh

          Edit the source docs/*.md; never the corpus itself.
          MSG
          exit 1
