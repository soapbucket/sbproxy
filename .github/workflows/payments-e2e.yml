# Payments e2e for SBproxy: the settlement gate and the usage bridge,
# run nightly against a payments-featured binary.
#
# WHY THIS IS NOT A PR LANE. Two reasons and they stack. The e2e harness
# spawns the proxy as a real child process on real ports, which is the
# documented reason `ci.yml` excludes `sbproxy-e2e` from the required
# lane and the reason `e2e.yml` runs off-PR at all: on shared runners
# that pattern produces startup-timeout flakiness that is not a
# regression. On top of that, no payment feature is in any default set,
# so the binary these tests spawn is a release build of a feature union
# nothing else in CI produces. Either one alone would be a bad trade on
# the PR critical path; together they are the whole argument.
#
# WHY IT EXISTS ANYWAY, given two lanes already touch these tests.
# `release-checks.yml`'s test-isolation job runs them nightly and
# `e2e.yml` runs them weekly, but in both cases they are passengers.
# Neither job is named for them. Neither reports which payment test
# failed. `release-checks.yml` files no issue when it goes red, and it
# has been red on an unrelated docs check, so a settlement failure
# inside it would be six lines in a seventeen-thousand-line log behind
# roughly 8500 other tests. This lane runs twelve tests, names the ones
# that failed, and opens an issue.
#
# WHAT IT PROTECTS. `challenge_settle_allow_and_replay_refusal` in
# `e2e/tests/settlement_gate.rs` asserts the origin served exactly once
# for one settled payment and then refuses the replay. Two neighbours
# assert the same property from different directions:
# `an_early_retry_then_payment_is_never_billed_twice` and
# `two_settlements_in_one_store_each_get_their_own_receipt`. That
# property is the difference between a paywall and a leak, and until
# WOR-2222 the subsystem around it had roughly 217 tests, including
# eleven of twelve integration files, that compiled into nothing and
# reported as passing. Coverage that looks real and is not is the
# specific failure this lane is insurance against, so it is deliberately
# small, deliberately named, and deliberately loud.

name: payments e2e

on:
  # Nightly, not weekly, and not per-PR.
  #
  # Per-PR is ruled out above. Weekly is `e2e.yml`'s cadence and it puts
  # mean detection latency at three and a half days with a worst case of
  # seven; at this repository's merge rate that is dozens of commits in
  # the bisect window for a money bug. Nightly puts the mean at twelve
  # hours and bounds the window at one day of merges.
  #
  # More often than nightly does not pay. The dominant cost here is the
  # release build of a feature union nothing else in CI caches; the two
  # test targets themselves finish in about seven seconds. A four-hourly
  # lane would pay that build six times for the same commit on a quiet
  # day and learn nothing new.
  #
  # 03:40 UTC is chosen, not arbitrary. It sits about six hours ahead of
  # `release-checks.yml` (09:30 UTC daily) and `e2e.yml` (09:30 UTC
  # Mondays), so a failure issue is already filed when the day starts, so
  # this lane does not contend with the two heavy jobs for hosted
  # runners, and so the three cache saves do not land in the same minute
  # against the 10 GB per-repository Actions cache limit. The minute is
  # off the hour because on-the-hour schedules are the most contended
  # and are delayed the most.
  schedule:
    - cron: '40 3 * * *' # 03:40 UTC daily
  # Manual dispatch keeps the branch selector, so a fix can be proven
  # from a branch without waiting for the next night or moving main.
  workflow_dispatch: {}

# Deliberately no `push` trigger, on tags or otherwise. There is no
# `pull_request` trigger either, so this workflow cannot be selected as
# a required status check by accident. Tag-time coverage of these same
# two test targets already exists twice over, in `e2e.yml` and in
# `release-checks.yml`; duplicating a release build at the moment a
# release is most time-pressured would cost more than it tells us. What
# is missing between releases, and what this lane supplies, is a short
# detection latency.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Thin LTO for the spawned binary, matching release-checks.yml's build
  # of the same binary. The harness asserts on HTTP status, receipt
  # chains, and SQLite rows, never on throughput, so fat LTO buys this
  # lane nothing and costs the majority of its wall clock.
  # release-checks.yml's nightly runs these exact tests against a
  # thin-LTO payments binary and they pass, so this is evidence rather
  # than a guess.
  CARGO_PROFILE_RELEASE_LTO: thin
  # settlement_gate.rs and usage_bridge.rs each stand up a small cluster
  # of processes, and this runner is also compiling. 60s is the harness's
  # own documented override for an unusually slow host
  # (`startup_timeout()` in e2e/src/lib.rs, default 30s), and it is what
  # e2e.yml already uses for these same two files.
  SBPROXY_E2E_STARTUP_TIMEOUT_SECS: '60'

jobs:
  payments-e2e:
    name: payments e2e (settlement gate + usage bridge)
    runs-on: ubuntu-latest
    # One thin-LTO release binary plus two test targets. e2e.yml needs 75
    # minutes for a fat-LTO build of the same binary, two debug binaries,
    # and all 170 test files; this is a fraction of that on both halves.
    timeout-minutes: 60
    outputs:
      failed-tests: ${{ steps.failures.outputs.failed }}
    steps:
      - uses: actions/checkout@v5

      # Its own job with its own cache key, per the one-selection rule in
      # CLAUDE.md. The two cargo invocations below use DIFFERENT package
      # selections (`-p sbproxy` then `-p sbproxy-e2e`), which is exactly
      # what that rule warns about, and the reason it is safe here is
      # that CARGO_TARGET_DIR puts the first one in `target/payments`.
      # Disjoint trees means neither invocation can invalidate the
      # other's fingerprints. That does not make the payments build
      # cheap, it makes it non-destructive and cacheable, which is the
      # property the rule is actually protecting.
      #
      # A distinct cache key for the same reason. This job's artifact set
      # is a release build of the settlement feature union in
      # `target/payments` plus debug test targets for `sbproxy-e2e` in
      # `target`. Neither the `payments` lane in ci.yml (no e2e package,
      # no release profile) nor the `e2e` lane (default-feature binary,
      # whole suite) produces that pair, so sharing a key would make
      # every restore partial and every save a candidate for evicting a
      # good entry.
      #
      # rust-setup's `cache-save` defaults to every trigger except
      # pull_request. This workflow has no pull_request trigger, so it
      # always saves and cannot rot behind a stale entry.
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: payments-e2e

      # usage_bridge's `the_examples_own_walkthrough_still_runs` shells
      # out to `bash bin/bill-one-call.sh` and then replays every
      # `sqlite3 ...` CAPTURE command in the example's README against the
      # file the proxy wrote. curl and python3 are guaranteed on the
      # image; sqlite3 is present today but is not something rust-setup
      # installs, and release-checks.yml's doc-captures job installs it
      # explicitly rather than trust the image. A lane whose whole job is
      # to be the reliable payments proof should not inherit an image
      # dependency it can close for two seconds of apt.
      - name: install the sqlite3 CLI the usage-bridge walkthrough runs
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sqlite3
          sqlite3 --version

      # The one binary this lane needs. Command, target dir, and feature
      # list are byte-identical to `missing_hint()` in e2e/src/lib.rs, to
      # the build step in e2e.yml, and to the command scripts/check.sh
      # prints when it skips these tests. Four places name this list; a
      # developer who runs the command one of them printed has to end up
      # with the binary the harness then looks for.
      #
      # Note this is NOT ci.yml's five-rail PAYMENT_FEATURES union. That
      # one is the workspace union for the clippy and test lane; this one
      # builds the binary the harness spawns. They have drifted on
      # payment-lightning-lnd, and matching the harness is what matters
      # here.
      - name: build the payments-featured sbproxy binary
        run: CARGO_TARGET_DIR=target/payments cargo build --release -p sbproxy --features payment-x402,payment-mpp,payment-stripe,payment-lightning-cln --locked

      # No default-feature binary is built and none is needed: every
      # `ProxyHarness::` call in both test files is
      # `start_payments_with_yaml_and_env`. Skipping that build is the
      # largest single saving this lane has over e2e.yml and
      # release-checks.yml. If a future test in either file starts a
      # default-feature proxy, this lane fails on "sbproxy binary missing
      # at .../target/release/sbproxy" with the harness's own hint naming
      # the build command. That is a loud, correct, actionable failure
      # rather than a silent skip, which is the trade being made
      # knowingly.
      #
      # SBPROXY_E2E_PAYMENTS_BIN is set explicitly even though the
      # harness would discover `target/payments/release/sbproxy` on its
      # own. An absolute path pins the lane to the binary this job just
      # built and removes the fallback to `target/payments/debug/sbproxy`
      # that a restored cache could otherwise satisfy with something
      # stale.
      #
      # --test-threads=1 is load bearing, not caution. settlement_gate is
      # red under parallelism (WOR-2295), and the `sbproxy-e2e` test
      # group in .config/nextest.toml that serializes it does not apply
      # here because this is `cargo test`, not nextest.
      #
      # `cargo test` rather than nextest is also deliberate. The `ci`
      # nextest profile sets `retries = 1`, and retrying is precisely the
      # wrong behavior for an exactly-once property: a nondeterministic
      # double-serve would be retried into green.
      #
      # --no-fail-fast because settlement_gate sorts before usage_bridge,
      # so without it one settlement failure suppresses the usage-bridge
      # results entirely and every rerun looks like a different bug.
      #
      # `set -o pipefail` before the tee: GitHub's default shell is
      # `bash -e`, which does NOT enable pipefail, and without it the
      # step's exit status would be tee's and every failure would report
      # green. Nothing runs after the pipeline, so the step status is
      # cargo's status.
      - name: payments e2e
        env:
          SBPROXY_E2E_PAYMENTS_BIN: ${{ github.workspace }}/target/payments/release/sbproxy
        run: |
          set -o pipefail
          cargo test -p sbproxy-e2e --locked --no-fail-fast \
            --test settlement_gate --test usage_bridge \
            -- --test-threads=1 2>&1 | tee payments-e2e.log

      # Names the failures. A scheduled lane nobody reads is the same as
      # no lane, so the failing test names go into the run summary and
      # into the issue body rather than only into the log. The fallback
      # matters as much as the happy path: a harness that never reached
      # a test (missing binary, startup timeout, apt failure) prints no
      # `... FAILED` line at all, and reporting an empty list there would
      # be the silent failure this step exists to prevent.
      - name: name the failing tests
        id: failures
        if: failure()
        run: |
          set -uo pipefail
          # Strip ANSI before matching. libtest does not colorize `test
          # ... FAILED` when its stdout is a pipe, which the tee above
          # guarantees, but CARGO_TERM_COLOR=always does colorize cargo's
          # own lines in the same file, so the cheap defense is worth more
          # than the assumption.
          if [ -f payments-e2e.log ]; then
            sed -e 's/\x1b\[[0-9;]*m//g' payments-e2e.log \
              | grep -E '^test .+ \.\.\. FAILED$' > failed.txt || true
          else
            : > failed.txt
          fi
          if [ ! -s failed.txt ]; then
            {
              echo 'No test reported FAILED. The run did not get that far.'
              echo 'Tail of the log:'
              tail -n 40 payments-e2e.log 2>/dev/null || echo '(no log was written)'
            } > failed.txt
          fi
          {
            echo '### payments e2e failures'
            echo
            echo '```text'
            cat failed.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'failed<<PAYMENTS_E2E_EOF'
            cat failed.txt
            echo 'PAYMENTS_E2E_EOF'
          } >> "$GITHUB_OUTPUT"

  notify-failure:
    name: failure notification (GitHub issue)
    needs: payments-e2e
    # This repository's convention for a scheduled lane that goes red is
    # a marker issue opened by github-actions[bot] and commented on
    # thereafter, established by e2e.yml. Same mechanism here, with its
    # own marker and title so the two lanes cannot collapse into one
    # thread. `release-checks.yml` has no equivalent and relies on
    # GitHub emailing the scheduled run's actor, which is why its nightly
    # has been red on a docs check with nobody acting on it.
    if: ${{ always() && needs.payments-e2e.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Serialize the issue lookup/create critical section across runs.
    concurrency:
      group: sbproxy-payments-e2e-failure-notification
      cancel-in-progress: false
    # Keep write authority out of the job that builds and executes the
    # repository. This job needs only enough access to report a failure.
    permissions:
      issues: write
    steps:
      - name: open or update the payments e2e failure issue
        uses: actions/github-script@v8
        env:
          FAILED_TESTS: ${{ needs.payments-e2e.outputs.failed-tests }}
        with:
          script: |
            const marker = '<!-- sbproxy-payments-e2e-workflow-failure -->';
            const incidentTitle = 'Payments e2e is failing';
            const runId = process.env.GITHUB_RUN_ID;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${runId}`;
            const failed = (process.env.FAILED_TESTS || '').trim()
              || 'The job failed before any test reported a result.';
            const report = [
              marker,
              'The scheduled payments e2e lane failed. These tests are the only',
              'automated proof that a settled payment serves the origin exactly',
              'once, so treat a red run here as a revenue defect until shown',
              'otherwise.',
              '',
              `- Run: [${runId}](${runUrl})`,
              `- Trigger: \`${process.env.GITHUB_EVENT_NAME}\``,
              `- Ref: \`${process.env.GITHUB_REF}\``,
              `- Commit: \`${process.env.GITHUB_SHA}\``,
              '',
              '### What failed',
              '',
              '```text',
              failed,
              '```',
              '',
              '### Next steps',
              '',
              '1. Inspect the failed step and its logs in the linked run.',
              '2. Reproduce locally, which needs the same binary the lane builds:',
              '',
              '```bash',
              'CARGO_TARGET_DIR=target/payments cargo build --release -p sbproxy --locked \\',
              '  --features payment-x402,payment-mpp,payment-stripe,payment-lightning-cln',
              'cargo test -p sbproxy-e2e --locked --no-fail-fast \\',
              '  --test settlement_gate --test usage_bridge -- --test-threads=1',
              '```',
              '',
              `3. Re-run failed jobs after a transient runner failure: \`gh run rerun ${runId} --failed\`.`,
              '   Do not re-run to make an exactly-once assertion go green. A',
              '   settlement test that passes on the second attempt is a finding.'
            ].join('\n');

            const openIssues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100
              }
            );
            const existing = openIssues.find(
              issue =>
                !issue.pull_request &&
                issue.user?.login === 'github-actions[bot]' &&
                issue.title === incidentTitle &&
                issue.body?.startsWith(marker)
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: report.replace(`${marker}\n`, '')
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: incidentTitle,
                body: report
              });
            }
