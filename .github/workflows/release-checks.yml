name: release checks

# Heavyweight regression checks that run before a release rather than
# on every PR. Process-isolated tests rerun the full workspace
# one test at a time, and the ACME integration test stands up
# a Pebble service container and exercises real cert issuance. Both
# run on tag pushes, nightly, and on workflow_dispatch so day-to-day
# CI stays cheap while we still catch ordering and CA regressions
# before we ship.
#
# macOS coverage is intentionally NOT in CI: macOS runners are billed
# at 10x the Linux rate, sbproxy uses no platform-specific syscalls,
# and developers running on Darwin catch portability issues locally
# before pushing.

on:
  push:
    tags:
      - 'v*'
  # Nightly run so this lane cannot rot silently between releases:
  # tag-only triggers mean a breakage introduced mid-cycle only
  # surfaces during the release itself. Failures do not page anyone;
  # GitHub emails the scheduled run's actor on failure, which is the
  # intended default.
  schedule:
    - cron: '30 9 * * *' # 09:30 UTC daily
  workflow_dispatch:
    inputs:
      scope:
        description: 'Checks to run (documentation replays captures and checks the corpus)'
        type: choice
        options:
          - all
          - documentation
        default: all

# Default to read-only contents access for every job in this workflow.
# CodeQL (actions/missing-workflow-permissions) wants every workflow
# to declare its permissions explicitly rather than inherit a broader
# default from the repo settings.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.scope || 'all' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # test-isolation builds two debug binaries and then compiles every
  # workspace test target in the same job. At cargo's default
  # parallelism (one rustc per core) this has died silently mid-run
  # with no uploaded logs, the signature of the runner itself being
  # OOM-killed rather than a clean test failure. Capping parallelism
  # trades some wall-clock time for not needing a retry, which costs a
  # full ~60 min job. Same fix already validated for this symptom in
  # the local gate script.
  CARGO_BUILD_JOBS: 2
  # Confirmed by direct evidence (a run that got past both binary
  # builds this time): the job runs out of DISK, not memory - "No
  # space left on device" linking the first debug binary alone, with
  # 88 GiB free at job start. CARGO_BUILD_JOBS controls parallelism,
  # not total artifact size, so it cannot fix this on its own.
  # `cargo test --workspace` then compiles one binary per integration
  # test file across ~30 crates on top of that; full DWARF debug info
  # for a dependency graph this size (wasmtime, tract, rquickjs, the
  # AWS SDKs, ...) is the largest single contributor to target/'s
  # size. line-tables-only keeps file:line for panic backtraces
  # (relied on throughout this project's own CI triage) while dropping
  # the per-variable DWARF data responsible for most of that weight.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # Inserted ahead of the heavier lanes deliberately: it costs a couple of
  # minutes and it answers a question the rest of CI cannot, so a stale
  # doc should not wait behind a 60-minute single-threaded test run.
  doc-captures:
    name: documented output still reproduces
    runs-on: ubuntu-latest
    # A recent cold build took 33m18s, leaving about a minute for replay
    # under the former 35-minute cap. Keep time for the full capture sweep.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/rust-setup

      - name: install protoc and libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev sqlite3

      # The settlement captures talk to a stub Core Lightning node, so the
      # binary has to carry the rail's feature. No payment feature is in
      # any default set. CARGO_PROFILE_RELEASE_LTO=thin matches
      # test-isolation's identical build step below; this job was still on
      # the workspace's default fat-LTO profile, which is why it kept
      # running long enough to threaten the job timeout.
      - name: build a payments-featured binary
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
        run: cargo build --release -p sbproxy --features payment-lightning-cln,payment-stripe --locked

      # Replays every CAPTURE marker in document order against a fixture
      # this script starts, and diffs the result against the block the doc
      # shows. Volatile fields (dates, intent ids, ports) are normalized on
      # both sides rather than skipped, so a block containing one is still
      # compared on the part that matters.
      - name: replay documented commands
        env:
          SBPROXY_CAPTURE_BIN: target/release/sbproxy
        run: python3 -u scripts/check-doc-captures.py --check

  test-isolation:
    # A manual documentation replay does not rebuild the unchanged workspace.
    # Tag, nightly, and default manual runs always retain this coverage.
    if: inputs.scope != 'documentation'
    name: test isolation (serial processes)
    runs-on: ubuntu-latest
    # A recent run spent 71m33s compiling its three binary variants and
    # workspace tests, then hit the old 90-minute cap mid-suite. Preserve
    # single-threaded coverage and allow the complete sweep to finish.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      # Replaces the old standalone free-disk-space + rust-toolchain +
      # rust-cache steps. This job builds two debug binaries and then
      # compiles every workspace test target, and has died silently
      # mid-run (no uploaded logs) at the runner's default disk
      # cleanup, the signature of the runner running out of room or
      # memory rather than a clean failure. The shared action logs
      # `df -h` before and after its cleanup, so a repeat at least
      # leaves diagnostic evidence instead of a blank job.
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: test-isolation

      - uses: taiki-e/install-action@nextest

      # Build the standalone sbproxy binary BEFORE running tests. The
      # e2e harness in `e2e/src/lib.rs` spawns `target/debug/sbproxy` at
      # runtime; `cargo test --workspace` builds test binaries but does
      # not necessarily build the `[[bin]]` target, so without this step
      # every e2e test panics with "release binary missing at ...".
      - name: build sbproxy binary (needed by e2e harness)
        run: cargo build -p sbproxy --locked

      # Some e2e tests spawn a no-default-features build via the harness
      # (target/no-default-features/); build it so they do not panic with
      # "no-default-features sbproxy binary missing".
      - name: build no-default-features sbproxy binary (needed by e2e harness)
        run: CARGO_TARGET_DIR=target/no-default-features cargo build -p sbproxy --no-default-features --locked

      # settlement_gate.rs and usage_bridge.rs spawn a payments-featured
      # binary via ProxyHarness::start_payments_with_yaml_and_env; without
      # this, every test in both files fails with "payments-featured
      # sbproxy binary missing" (WOR-2222 - this lane never built one
      # either, same gap e2e.yml had). CARGO_PROFILE_RELEASE_LTO=thin
      # matches release.yml's aarch64 fix - this is still a fat-LTO
      # [profile.release] build by default, no reason to risk the same
      # OOM here untested.
      - name: build payments-featured sbproxy binary (needed by e2e harness)
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
        run: CARGO_TARGET_DIR=target/payments cargo build --release -p sbproxy --features payment-x402,payment-mpp,payment-stripe,payment-lightning-cln --locked

      # Cheap insurance: if line-tables-only above is not enough, this
      # is the evidence the next fix needs instead of another guess.
      - name: report disk usage before the full test compile
        run: |
          df -h /
          du -sh target target/no-default-features 2>/dev/null || true

      # Tests intentionally own immutable process-wide registrations (event
      # egress, audit chains, secret resolvers). Sharing one libtest process
      # makes later tests inherit a dead fixture's registration or cache.
      # Match the required runner while retaining the full workspace and
      # serial scheduling. No retries: release validation reports every failure.
      - name: test (one isolated process at a time)
        id: isolated-tests
        run: cargo nextest run --workspace --locked --profile ci --test-threads 1 --retries 0 --no-fail-fast

      # nextest does not execute doctests. Run these even after a test failure
      # so one failing target does not conceal the rest of the release evidence.
      - name: doctests
        if: success() || (failure() && steps.isolated-tests.outcome == 'failure')
        run: cargo test --workspace --locked --doc --no-fail-fast -- --test-threads=1

      - name: upload test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-isolation-results
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn

  acme-pebble:
    if: inputs.scope != 'documentation'
    name: acme integration (pebble)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Pin Pebble to a specific tag rather than `:latest` so an
      # upstream image change cannot break our release-readiness lane
      # silently. Bump deliberately when we want to track a new
      # Pebble revision.
      pebble:
        image: ghcr.io/letsencrypt/pebble:2.6.0
        ports:
          - 14000:14000
          - 15000:15000
        env:
          PEBBLE_VA_ALWAYS_VALID: "1"
          PEBBLE_VA_NOSLEEP: "1"
          # Pebble rejects a percentage of otherwise-valid nonces to
          # exercise the client retry RFC 8555 s6.5 asks for, and the
          # default is 5%. Held at the default on purpose: an issuance
          # is ~20 JWS posts, so this is the only lane that drives the
          # badNonce path against a real server at all.
          #
          # The knob is PEBBLE_WFE_NONCEREJECT. This block used to set
          # PEBBLE_WA_NONCE_REJECT, which is not a name Pebble reads, so
          # the lane it claimed to make deterministic was running at the
          # 5% default the whole time. That is what flaked the v1.9.0
          # tag inside test_full_cert_issuance. Use the spelling in
          # test/pebble/docker-compose.yml when changing this.
          PEBBLE_WFE_NONCEREJECT: "5"
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/pinned-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: acme-pebble

      - name: wait for pebble directory
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -sk https://localhost:14000/dir >/dev/null; then
              echo "Pebble is up."
              exit 0
            fi
            echo "Waiting for Pebble (${i}/30)..."
            sleep 2
          done
          echo "Pebble did not become reachable on https://localhost:14000/dir"
          exit 1

      # `--ignored` selects the seven Pebble-dependent tests in that
      # file. It is a filter, and a filter that matches nothing exits 0,
      # so dropping an `#[ignore]` would quietly shrink the ACME lane a
      # release is signed off against. Assert the count; the number moves
      # in the same commit that adds or removes one of them.
      #
      # Which lane notices, since nothing here runs on a pull request:
      # this workflow triggers on a `v*` tag push and the 09:30 UTC cron
      # only. An eighth ignored test merges green and reddens the next
      # nightly, or the tag build if it lands after one. Say it rather
      # than let the next reader assume the PR that breaks the count is
      # the PR that goes red.
      - name: run acme integration tests
        run: |
          set -euo pipefail
          . scripts/lib/expect-tests.sh
          expect_tests 7 "acme integration (Pebble)" -- \
            cargo test -p sbproxy-tls --test acme_integration --locked -- --ignored

  llms-full-corpus:
    name: llms-full.txt is current
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # `docs/llms-full.txt` is generated, committed, and published as
      # sbproxy.dev/llms-full.txt. Nothing regenerates it on merge any
      # more: main requires a pull request, so the workflow that used to
      # push it there was refused on every run, and the alternative was
      # giving a docs generator a credential that bypasses branch
      # protection. It is regenerated during release prep instead.
      #
      # Which makes this the gate that keeps "regenerate before you tag"
      # from being folklore. On a `v*` tag it fails the release lane. On
      # the nightly run it is the early warning that the corpus has
      # drifted since the last release, which is exactly the rot this
      # workflow's header says it exists to catch. Being stale mid-cycle
      # is expected and is not itself a problem; being stale at a tag is.
      - name: corpus matches the docs it is generated from
        run: |
          set -euo pipefail
          if bash scripts/regen-llms-full.sh --check; then
            exit 0
          fi
          cat <<'MSG'
          ::error::docs/llms-full.txt is stale.

          Regenerate it and commit the result before tagging:

            bash scripts/regen-llms-full.sh
            git add docs/llms-full.txt
            git commit -m 'chore(docs): regenerate llms-full.txt'

          The corpus ships as sbproxy.dev/llms-full.txt, so a release
          cut from here publishes documentation that does not match the
          docs in the same tag.
          MSG
          exit 1
