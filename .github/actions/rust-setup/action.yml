# Shared Rust + system-package setup for SBproxy CI lanes.
#
# Bundles the four steps every Rust job in this repo otherwise
# repeats: disk cleanup, the pinned toolchain, rust-cache, and the apt
# packages the workspace's transitive deps need. Centralising them
# means future runner-image churn (clang headers, protoc location,
# disk policy) is fixed once instead of in every workflow.
#
# Usage from a workflow step:
#
#   - uses: ./.github/actions/rust-setup
#     with:
#       cache-key: ci          # short label that segregates caches
#       free-disk: 'true'      # measure and reclaim below the 40 GiB floor
#       install-system-deps: 'true'
#
# The composite intentionally does NOT run cargo. Each caller picks
# its own `cargo fmt|clippy|build|test|doc` shape so this action
# stays a setup primitive, not a workflow.

name: rust-setup
description: Pinned Rust toolchain, rust-cache, and system packages for SBproxy CI.

inputs:
  cache-key:
    description: 'shared-key passed to Swatinem/rust-cache. Distinct caches stay split; jobs that share a build matrix should pass the same value.'
    required: false
    default: ci
  cache-save:
    description: 'Whether this job writes the cache. Defaults to every trigger except pull_request. A ~3 GB entry per PR evicts the good entry against the 10 GB per-repo limit, which makes every restore a partial one, so PRs restore and do not save. Tag, schedule, and dispatch runs still save; e2e.yml has no push-to-main trigger and would otherwise never refresh its cache.'
    required: false
    default: ''
  components:
    description: 'Extra rustup components, comma separated (for example "rustfmt, clippy").'
    required: false
    default: ''
  free-disk:
    description: 'Measure runner disk before the build and reclaim the allowlisted toolchains at or below the 40 GiB floor. Disable when the job needs no disk policy.'
    required: false
    default: 'true'
  install-system-deps:
    description: 'Install protobuf-compiler, clang, libclang-dev, libc6-dev. Required by the workspace transitive deps; disable only when the job does no Rust compilation.'
    required: false
    default: 'true'
  install-redis:
    description: 'Also install redis-server, for lanes that run the live Redis integration tests.'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # Current hosted images have about 109 GB free after this cleanup, while
    # deleting the preinstalled toolchains costs about 70 seconds. Measure
    # first and keep the same allowlist for runners below the 40 GiB floor.
    - name: reclaim runner disk when space is low
      if: inputs.free-disk == 'true'
      shell: bash
      run: bash "${{ github.action_path }}/reclaim-disk.sh"

    # rust-toolchain.toml is the single source of truth for the version,
    # but dtolnay/rust-toolchain does not read it. That action selects
    # purely from the `@rev` it is called by, which is how `@stable`
    # floated onto 1.98.0 mid-week and turned the lint lane red on PRs
    # that had touched none of the failing code. Parse the channel here
    # and pass it explicitly, so the file governs CI as well as rustup.
    # Do not inline the version: two copies drift, and the copy CI
    # believes would be the one nobody edits.
    - name: read the pinned toolchain
      id: toolchain
      shell: bash
      run: |
        set -euo pipefail
        pin="$GITHUB_WORKSPACE/rust-toolchain.toml"
        channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$pin" | head -n1)"
        if [ -z "$channel" ]; then
          echo "::error::no channel found in rust-toolchain.toml; every Rust lane resolves its compiler from that file"
          exit 1
        fi
        echo "pinned toolchain: $channel"
        echo "channel=$channel" >> "$GITHUB_OUTPUT"

    - name: install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        components: ${{ inputs.components }}

    - name: rust-cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ inputs.cache-save != '' && inputs.cache-save || github.event_name != 'pull_request' }}

    - name: install system deps
      if: inputs.install-system-deps == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler clang libclang-dev libc6-dev
        if [ "${{ inputs.install-redis }}" = "true" ]; then
          sudo apt-get install -y redis-server
        fi
