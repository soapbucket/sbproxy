# cargo-deny configuration for sbproxy.
#
# Run locally: cargo deny check
# Enforced in CI as part of the lint job. Failing this gate fails CI; the
# enterprise gate runs the same config. See SUPPLY-CHAIN.md section 4.3 for
# the rationale.
#
# Reference: https://embarkstudios.github.io/cargo-deny/
#
# When this config changes, update the rationale in the PR description and
# in SUPPLY-CHAIN.md if a category-level decision shifts.

[graph]
all-features = false
no-default-features = false
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]

[output]
feature-depth = 1

# --- Advisories ---------------------------------------------------------------
#
# The RustSec advisory database is the source of truth. Anything with a known
# vulnerability fails CI. Unmaintained and yanked crates warn so we see them
# in the lint output without blocking unrelated changes; we triage them in
# the next dependency-update PR.

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
# `unmaintained` is a scope setting in cargo-deny v0.16+. "all" detects every
# unmaintained crate in the graph, including transitive ones, and gates on
# them. We use "all" so each unmaintained finding must be explicitly triaged
# in the `ignore` list below with a named owner and a revisit trigger, rather
# than silently warned-and-forgotten. New transitive unmaintained crates that
# are not yet triaged will fail the gate, which is the intended signal: decide
# and document before merging (see WOR-616).
unmaintained = "all"
ignore = [
  # Tracked transitive findings. Each entry should carry a comment naming
  # the crate, the pulling-in dependency, and the fix plan. Remove entries
  # when the upstream releases a patched version and Renovate has updated
  # Cargo.lock; CI will then enforce automatically.

  # --- AWS SDK: transitive rustls 0.21 -> rustls-webpki 0.101.7 ---
  # Historical, kept as the record of what was ignored here and why it
  # stopped being needed. No entries remain.
  #
  # Three advisories (RUSTSEC-2026-0098, -0099, -0104) flagged the unpatched
  # `rustls-webpki 0.101.7`, which `aws-smithy-http-client 1.1.13` pinned
  # through `rustls 0.21`. None of the three applied to the
  # `aws-sdk-secretsmanager` / `aws-sdk-sts` use case: we connect to
  # AWS-issued certificates over standard TLS chains and do not parse CA
  # certs with name constraints, do not consume Certificate Revocation
  # Lists, and do not verify wildcard DNS-name SANs against permitted
  # subtree constraints. `sbproxy-mesh` peer-mTLS also uses rustls-webpki
  # but pinned the patched 0.103.13 throughout, so that path was never
  # affected.
  #
  # Removed 2026-08-07, when cargo-deny began reporting "no crate matched
  # advisory criteria" for all three: the AWS SDK had moved to a patched
  # base, exactly as the note predicted. WOR-2673 then dropped the last
  # consumer of the legacy stack (`sbproxy-cache`'s AWS-SDK reserve
  # backend), so the lockfile now carries one `rustls-webpki` (0.103.13),
  # one `h2` (0.4.16), and one `hyper` (1.9.0). Nothing here can match
  # again without that stack coming back.

  # --- WOR-616: unmaintained transitive crates -----------------------------
  # The following six advisories are all `unmaintained`-class warnings (not
  # active vulnerabilities; `cargo audit` reports 0 vulnerabilities). Each
  # crate enters the graph transitively through a direct dependency we cannot
  # patch from here, and none has a maintained drop-in replacement reachable
  # without an upstream bump. We ignore them so the supply-chain gate stays
  # green while keeping an owner and a revisit trigger per entry. Reassess at
  # each dependency bump; remove the entry once the named direct dep stops
  # pulling the crate.

  # RUSTSEC-2025-0012: backoff 0.4.0. Path: backoff -> kube-runtime -> kube
  # (direct dep) -> sbproxy-k8s-operator. Unmaintained, no maintained
  # replacement reachable; transitive; revisit when kube updates.
  "RUSTSEC-2025-0012",

  # RUSTSEC-2024-0388: derivative 2.2.0. Paths: derivative -> pingora-core
  # (direct dep) and derivative -> kube-runtime -> kube (direct dep).
  # Unmaintained, no maintained replacement reachable; transitive; revisit
  # when pingora and kube update.
  "RUSTSEC-2024-0388",

  # RUSTSEC-2024-0384: instant 0.1.13. Paths: instant -> notify-types ->
  # notify (direct dep) and instant -> backoff -> kube-runtime -> kube
  # (direct dep). Unmaintained, no maintained replacement reachable;
  # transitive; revisit when notify and kube update.
  "RUSTSEC-2024-0384",

  # RUSTSEC-2024-0436: paste 1.0.15. Paths: paste -> tract-* -> tract-onnx
  # (direct dep) and paste -> macro_rules_attribute -> tokenizers (direct
  # dep). Unmaintained, no maintained replacement reachable; transitive;
  # revisit when tract-onnx and tokenizers update. The tract path would
  # disappear on tract 0.22, which uses the maintained `pastey` fork, but
  # that bump is blocked (see RUSTSEC-2026-0217 below).
  "RUSTSEC-2024-0436",

  # RUSTSEC-2026-0217: tract-nnef 0.21.10, integer overflow in the NNEF
  # .dat tensor parser on attacker-controlled files.
  #
  # NOT REACHABLE, and this is a call-site fact rather than a judgement:
  # there is no NNEF entry point anywhere in this workspace. `grep -rn
  # 'nnef\|NNEF' crates/ e2e/` returns nothing. tract-nnef is in the graph
  # only because tract-onnx depends on it, and every model this process
  # loads goes through the ONNX path.
  #
  # BLOCKED, re-verified 2026-08-29 (WOR-2694) by extracting the .crate
  # tarballs rather than trusting a summary. Two separate blockers, and the
  # cheapest way out is the first one:
  #
  # 0.21.17 is the release to want. It carries the containment fix for the
  # ONNX external_data read AND the NNEF fix (from 0.21.16), and it has
  # none of the Gather regression below: its Gather is still the checked
  # `data_view.get(&*icoords).context("Invalid gather")?`. It is blocked by
  # exactly one character. tract-data 0.21.17 declares
  # `libm = "=0.2.11"`, an exact pin, while wasmtime-internal-core needs
  # `^0.2.16` and this lockfile resolves libm 0.2.16. Drop the `=` and it
  # resolves. That is the upstream ask: a 0.21.18 patch relaxing one
  # requirement, which is a far smaller request than the alternative below.
  #
  # 0.22 and 0.23 do resolve, because they already write that requirement
  # as a caret. They are refused for a different reason.
  #
  # The reason now is a panic regression. tract 0.22 added an unchecked
  # block-copy fast path to the Gather op (tract-core/src/ops/array/
  # gather.rs, `can_block_copy`) that indexes a slice directly:
  #
  #     let input_offset = resolved_index * block_len;
  #     output_slice[..].clone_from_slice(&input_slice[input_offset..][..block_len]);
  #
  # 0.21 used a checked `data_view.get(&*icoords).context("Invalid
  # gather")?` and returned an error. An out-of-range index, which is what
  # a tokenizer and model whose vocabularies disagree produce, therefore
  # panics on 0.22 where it used to fail cleanly. Two tests catch it:
  # prompt_injection_v2::body_aware::tests::{configured_composite_failure_
  # is_retried_and_never_cached, classification_cache_isolates_real_
  # inprocess_configs_with_different_pins}, which assert a typed
  # DetectionFailureKind::Inference and get ::Worker instead. 0.23.5 has
  # the same fast path, so it is not an escape either.
  #
  # Trading an unreachable integer overflow for a panic on the AI request
  # path is the wrong direction, so the bump is not taken here.
  #
  # What is NOT carried: the ONNX external_data arbitrary file read
  # (GHSA-h668-6x6g-f8r5, see the prose section below) is closed in our own
  # code as of WOR-2694 and does not depend on this entry.
  #
  # EXPIRES 2026-11-30. This is a carry with a deadline, not a permanent
  # exemption: if no tract release fixes the Gather panic by then, the
  # decision is reopened rather than renewed silently. cargo-deny 0.19 has
  # no `expires` field on an ignore entry, so the date lives here and the
  # reason travels with the id.
  #
  # Owner: whoever next touches the classifier stack. Remove this entry when
  # a tract release carries both the advisory fix and a bounds-checked
  # Gather, or when the Gather panic is fixed upstream.
  { id = "RUSTSEC-2026-0217", reason = "tract-nnef NNEF parser overflow; no NNEF call site in this workspace, and 0.22/0.23 regress Gather to a panic on out-of-range indices (WOR-2694); expires 2026-11-30" },

  # RUSTSEC-2025-0134: rustls-pemfile 2.2.0. Paths: rustls-pemfile ->
  # pingora-rustls -> pingora-core (direct dep), -> object_store (direct
  # dep), -> kube-client -> kube (direct dep), and -> axum-server (direct
  # dep). The workspace's own direct rustls-pemfile use is already retired in
  # favor of rustls-pki-types; only these transitive copies remain.
  # Unmaintained, no maintained replacement reachable; transitive; revisit
  # when pingora, object_store, kube, and axum-server update.
  "RUSTSEC-2025-0134",

  # --- quick-xml 0.37.5 DoS advisories (transitive via object_store) -------
  # These two are `vulnerability`-class (not merely unmaintained), so they
  # are ignored with a tighter rationale. Path: quick-xml -> object_store
  # 0.11.2 (direct dep of sbproxy-modules, the cloud blob-storage config
  # backend) -> sbproxy-modules. quick-xml never parses proxy request bodies
  # or MCP traffic; the only XML it decodes is the LIST/GET responses from
  # the operator's own configured object store (S3/GCS/Azure), so the DoS
  # surface is an operator-trusted endpoint, not attacker-controlled input.
  # The fix is in quick-xml 0.38, which object_store 0.11's `^0.37` bound
  # does not allow; there is no compatible patched release. Predates this
  # change and is present on main. Transitive; revisit when object_store
  # bumps its quick-xml floor to a 0.38 line.
  #
  # RUSTSEC-2026-0194: quadratic run time checking a start tag for duplicate
  # attribute names.
  "RUSTSEC-2026-0194",
  # RUSTSEC-2026-0195: unbounded namespace-declaration allocation in
  # `NsReader` (memory-exhaustion DoS).
  "RUSTSEC-2026-0195",

  # RUSTSEC-2026-0258 (h2 0.3.27, unbounded empty DATA frames) was ignored
  # here for the `aws-smithy-mocks` dev-dependency of the AWS-SDK
  # cache-reserve backend's tests, which pulled the legacy hyper 0.14 / h2
  # 0.3 client. WOR-2673 retired that backend in favor of the object-storage
  # one, and with it the whole legacy stack: the lockfile now holds one h2
  # (0.4.16) and one hyper (1.9.0). Entry removed 2026-08-27.

  # --- ttf-parser unmaintained (transitive via lopdf) ----------------------
  # RUSTSEC-2026-0192 is `informational = "unmaintained"`, not a
  # vulnerability: the author has said the crate will get no further fixes
  # and points at `skrifa` as the replacement. There is no patched version
  # to move to, because there is nothing to patch.
  #
  # Path: ttf-parser -> lopdf 0.42 -> `pdf-extract` and the `pdf_markdown`
  # transform (WOR-2670), both behind the optional, off-by-default
  # `transform-pdf` cargo feature. A build that does not turn that feature
  # on does not compile this crate at all, so the default binary and every
  # CI lane except the pdf one carry none of it.
  #
  # Why not simply avoid it: `ttf-parser` is an unconditional dependency of
  # lopdf (no feature gates it), and 0.43 and 0.44 still declare it, so no
  # lopdf release drops it. The alternative is staying on lopdf 0.38, which
  # carries RUSTSEC-2026-0187: an unbounded-recursion stack overflow that
  # aborts the process on a ~21 KB crafted PDF and cannot be caught. Trading
  # a remotely triggerable process kill for an unmaintained-crate notice is
  # the right direction, and the notice is what is recorded here.
  #
  # Owner: whoever next touches the `pdf_markdown` transform. Revisit when
  # lopdf moves to `skrifa` or another maintained font parser, or if this
  # advisory is ever reclassified from informational to a vulnerability.
  "RUSTSEC-2026-0192",
]

# --- Advisories this file structurally CANNOT gate -----------------------
#
# cargo-deny resolves `ignore` entries against the RustSec advisory database
# and nothing else. GitHub's advisory database is a superset: it ingests
# every RustSec advisory, and it also carries GitHub-reviewed Rust
# advisories that were never assigned a RUSTSEC id. Those are invisible to
# cargo-deny, and an `ignore` entry naming one would simply never match, so
# they are recorded here as comments instead of list entries. Dependabot is
# the only scanner in this repository that sees them; see SUPPLY-CHAIN.md
# section 4.3.
#
# The entries below were triaged on 2026-08-08. Re-check whether RustSec has
# since assigned an id (`ls ~/.cargo/advisory-db/crates/<crate>`); if it has,
# the finding becomes gateable and moves into the `ignore` list above with the
# same rationale, or gets fixed.
#
# GHSA-h668-6x6g-f8r5 / CVE-2026-55832 (medium): tract-onnx arbitrary file
# read via an unsanitized ONNX `external_data` `location` field, i.e. path
# traversal at model-load time. Vulnerable < 0.21.17; we resolve 0.21.10.
#
# FIXED IN OUR CODE 2026-08-29 (WOR-2694), not carried and not deferred.
# `sbproxy_classifiers::reject_external_tensor_data` refuses any model that
# declares external tensor data, and every ONNX loader in the workspace
# translates the parsed protobuf with no model directory in the parsing
# context, which is the state tract itself treats as "external data cannot be
# resolved". `scripts/check-onnx-model-loaders.sh` fails the build if any
# crate goes back to the one-shot `model_for_path` / `model_for_read`.
# See crates/sbproxy-classifiers/src/onnx_external_data.rs and
# docs/model-pinning.md.
#
# The reachability note that used to sit here claimed an attacker who could
# substitute the .onnx file already had write access to the operator's model
# directory. That was wrong, and it is why this was fixed rather than
# re-dated: operators point sbproxy at models they did not author, so the
# bytes of that field are attacker-controlled without any host access at all.
#
# This entry stays as a comment rather than moving to the `ignore` list
# because it has no RUSTSEC id for cargo-deny to match. Dependabot will keep
# reporting it against the 0.21 line until the version moves, which is
# blocked on the Gather panic documented under RUSTSEC-2026-0217 above. The
# vector it describes is closed regardless of that version.
#
# GHSA-w9wp-h8wv-79jx / CVE-2026-48504 (medium): opentelemetry_sdk unbounded
# memory allocation in W3C Baggage propagation. Vulnerable <= 0.32.0; we
# resolve 0.27.1, so we are in range. Not reachable: the vulnerable code is
# the Baggage propagator, and sbproxy never installs it. The only
# `global::set_text_map_propagator` call in the workspace is
# crates/sbproxy-observe/src/telemetry.rs, which registers
# `TraceContextPropagator` and nothing else; MCP's `baggage` `_meta` key
# (sbproxy-extension/src/mcp/types.rs) is a reserved name the gateway
# recognizes but never emits or parses. Not fixable as a lockfile bump
# either: the patched 0.32.1 is five minor releases past our `0.27` pins,
# and crates/sbproxy-observe/Cargo.toml pins opentelemetry,
# opentelemetry_sdk, opentelemetry-otlp, and
# opentelemetry-semantic-conventions together on 0.27 with
# tracing-opentelemetry 0.28 bridging them. Moving the stack is a
# deliberate breaking upgrade of all five, not a `cargo update`.

# --- Licenses -----------------------------------------------------------------
#
# Allowlist. Any crate whose license is not in this list fails CI. Add entries
# deliberately and document the reason in the PR. We do not ship copyleft
# (GPL, AGPL, LGPL) in the gateway.
#
# Wave 4 (B4.4) audit:
#   - pulldown-cmark 0.12         (MIT)  - HTML-to-Markdown projection (G4.3).
#   - pulldown-cmark-escape 0.11  (MIT)  - transitive of pulldown-cmark.
#   - quick-xml 0.37              (MIT)  - audit; landed via reqwest dep tree
#                                          (the licenses.xml emitter is
#                                          hand-rolled, not quick-xml).
# All three sit under the existing MIT allow entry; no new allow rules
# are required. The `cargo deny check` gate remains clean across the
# Wave 4 surface.

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  # 0BSD (BSD Zero Clause): public-domain-equivalent, more permissive than
  # MIT, no attribution required. Transitive via the mistral.rs `embedded`
  # engine tree (doctest-file, recvmsg under interprocess).
  "0BSD",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "Unlicense",
  "OpenSSL",
  # Mozilla CA root data, transitive via webpki-roots. Permissive for data;
  # documented at https://cdla.dev/permissive-2-0/.
  "CDLA-Permissive-2.0",
]
exceptions = []

# All workspace crates are publish = false (see CLAUDE.md). They are licensed
# under Apache-2.0 (the project license, see LICENSE). Apache-2.0 is already in
# the third-party allowlist above, but keeping our own first-party crates out
# of the license gate is still correct: cargo-deny does not need to police our
# own license choices, and the allowlist governs transitive dependencies.
[licenses.private]
ignore = true

# Crates with non-SPDX or no machine-readable license. Add entries here only
# after confirming the upstream license out of band.
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# --- Bans ---------------------------------------------------------------------
#
# Multiple-version warnings are noisy in the Rust ecosystem; we accept them.
# Wildcard dependencies are forbidden because they break reproducibility.

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal crates use `path = "..."` without a version, which Cargo
# resolves as a wildcard. Allow the wildcard in that case so the gate still
# catches external `version = "*"` dependencies, which are the real risk.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

# --- Sources ------------------------------------------------------------------
#
# Only crates.io. Git and path sources require explicit allowlisting in PR
# review; this gate prevents silent introduction of unaudited registries.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# WOR-1772: pingora is patched to our fork (dynamic rustls cert resolver).
#
# The mistral.rs and candle.git entries were removed 2026-08-07: neither
# resolves any longer (cargo-deny reports "allowed source was not
# encountered"), because the `embedded` inference engine that pulled them is
# no longer in the graph.
allow-git = [
    "https://github.com/soapbucket/pingora",
]
