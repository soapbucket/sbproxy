# SBproxy SLO alerting rules (Wave 1, B1.7)
#
# Tier mapping:
#   page   -> PagerDuty rotation, ack within 15 min.
#   ticket -> oncall:ticket label, next business day.
#   log    -> Alertmanager log-only route, no human notification.
#
# Burn-rate windows follow the SRE workbook chapter 5
# (multiwindow / multi-burn-rate). Page tier fires the 14.4x and 6x
# pairs; ticket tier fires the 3x pair; log tier records the 1x pair.
#
# Every alert carries a runbook_id label and a runbook_url annotation whose
# fragment is that id lowercased. The fragment is the anchor of the id's
# section in docs/operator-runbook.md, which indexes every id any rule here
# can emit. crates/sbproxy-observe/tests/runbook_index.rs fails the build when
# a rule emits an id the index does not carry, when the index points at a
# heading that is not there, and when a runbook_url ends somewhere else. This
# comment previously claimed the section ids already matched the labels; the
# runbook did not contain a single one of them.
#
# Wave 1 ships substrate, ledger, and audit alerts. Per-rail and
# per-classifier alerts land with their pillars in later waves; the
# placeholder comments below mark the integration points.

groups:
  # --- Substrate availability burn-rate alerts ---
  - name: sbproxy_alerts_substrate_availability
    rules:
      # 14.4x burn over 1h (page) - 2% of 30d budget burned in 1h.
      - alert: SBPROXY-SUBSTRATE-AVAIL-1H
        expr: |
          (1 - sbproxy:slo:substrate:availability:5m) > (14.4 * (1 - 0.999))
          and
          (1 - sbproxy:slo:substrate:availability:1h) > (14.4 * (1 - 0.999))
        for: 2m
        labels:
          severity: page
          slo_id: SLO-AVAIL-INBOUND
          runbook_id: RB-SUBSTRATE-AVAIL
          window: 1h
          burn_rate: "14.4"
        annotations:
          summary: "Substrate availability burning fast (14.4x over 1h)"
          description: |
            Inbound 5xx ratio exceeds 14.4x of the 30d error budget over
            the last 1h. At this rate the entire month's budget burns in
            under 2 days. Page on-call.
          runbook_url: "https://docs.sbproxy.dev/runbook#rb-substrate-avail"

      # 6x burn over 6h (page) - 5% of budget in 6h.
      - alert: SBPROXY-SUBSTRATE-AVAIL-6H
        expr: |
          (1 - sbproxy:slo:substrate:availability:30m) > (6 * (1 - 0.999))
          and
          (1 - sbproxy:slo:substrate:availability:6h) > (6 * (1 - 0.999))
        for: 15m
        labels:
          severity: page
          slo_id: SLO-AVAIL-INBOUND
          runbook_id: RB-SUBSTRATE-AVAIL
          window: 6h
          burn_rate: "6"
        annotations:
          summary: "Substrate availability burning (6x over 6h)"
          description: |
            Sustained 5xx ratio above 6x of error budget over the last
            6h. Page on-call.
          runbook_url: "https://docs.sbproxy.dev/runbook#rb-substrate-avail"

      # 3x burn over 24h (ticket).
      - alert: SBPROXY-SUBSTRATE-AVAIL-24H
        expr: |
          (1 - sbproxy:slo:substrate:availability:1h) > (3 * (1 - 0.999))
          and
          (1 - sbproxy:slo:substrate:availability:24h) > (3 * (1 - 0.999))
        for: 1h
        labels:
          severity: ticket
          slo_id: SLO-AVAIL-INBOUND
          runbook_id: RB-SUBSTRATE-AVAIL
          window: 24h
          burn_rate: "3"
        annotations:
          summary: "Substrate availability slow burn (3x over 24h)"
          description: |
            Sustained 5xx ratio above 3x of the 30d budget over the last
            24h. File on-call ticket.
          runbook_url: "https://docs.sbproxy.dev/runbook#rb-substrate-avail"

  # --- Substrate latency ---
  - name: sbproxy_alerts_substrate_latency
    rules:
      - alert: SBPROXY-SUBSTRATE-LATENCY-P95
        expr: sbproxy:slo:substrate:latency_p95:5m > 0.030
        for: 5m
        labels:
          severity: ticket
          slo_id: SLO-LATENCY-P95
          runbook_id: RB-SUBSTRATE-LATENCY
          window: 5m
        annotations:
          summary: "Inbound p95 latency above 30 ms (sustained)"
          description: |
            sbproxy:slo:substrate:latency_p95:5m exceeded 30 ms for the
            last 5 minutes. Ticket tier.
          runbook_url: "https://docs.sbproxy.dev/runbook#rb-substrate-latency"

      - alert: SBPROXY-SUBSTRATE-LATENCY-P99
        expr: sbproxy:slo:substrate:latency_p99:5m > 0.050
        for: 5m
        labels:
          severity: page
          slo_id: SLO-LATENCY-P99
          runbook_id: RB-SUBSTRATE-LATENCY
          window: 5m
        annotations:
          summary: "Inbound p99 latency above 50 ms (sustained)"
          description: |
            sbproxy:slo:substrate:latency_p99:5m exceeded 50 ms for the
            last 5 minutes. Page tier.
          runbook_url: "https://docs.sbproxy.dev/runbook#rb-substrate-latency"

  # --- Ledger redeem ---
  - name: sbproxy_alerts_ledger
    rules:
      # 14.4x burn against the 99.95% target.
      - alert: SBPROXY-LEDGER-REDEEM-1H
        expr: |
          (1 - sbproxy:slo:ledger:redeem_success:5m) > (14.4 * (1 - 0.9995))
          and
          (1 - sbproxy:slo:ledger:redeem_success:1h) > (14.4 * (1 - 0.9995))
        for: 2m
        labels:
          severity: page
          slo_id: SLO-LEDGER-REDEEM
          runbook_id: RB-LEDGER-REDEEM
          window: 1h
          burn_rate: "14.4"
        annotations:
          summary: "Ledger redeem failing fast (14.4x burn over 1h)"
          description: |
            The ledger redeem success ratio dropped below the burn
            threshold. Page ledger operator.
          runbook_url: "https://docs.sbproxy.dev/runbook#rb-ledger-redeem"

      - alert: SBPROXY-LEDGER-REDEEM-6H
        expr: |
          (1 - sbproxy:slo:ledger:redeem_success:1h) > (6 * (1 - 0.9995))
          and
          (1 - sbproxy:slo:ledger:redeem_success:6h) > (6 * (1 - 0.9995))
        for: 15m
        labels:
          severity: page
          slo_id: SLO-LEDGER-REDEEM
          runbook_id: RB-LEDGER-REDEEM
          window: 6h
          burn_rate: "6"
        annotations:
          summary: "Ledger redeem sustained burn (6x over 6h)"
          description: |
            Sustained ledger redeem failure above 6x burn over the last
            6h. Page ledger operator.
          runbook_url: "https://docs.sbproxy.dev/runbook#rb-ledger-redeem"

      - alert: SBPROXY-LEDGER-LATENCY-P99
        expr: sbproxy:slo:ledger:redeem_latency_p99:5m > 0.200
        for: 5m
        labels:
          severity: ticket
          slo_id: SLO-LEDGER-LATENCY
          runbook_id: RB-LEDGER-LATENCY
          window: 5m
        annotations:
          summary: "Ledger redeem p99 latency above 200 ms"
          description: |
            sbproxy_ledger_redeem_duration_seconds p99 above 200 ms for
            5 min. File ticket; investigate ledger backend latency.
          runbook_url: "https://docs.sbproxy.dev/runbook#rb-ledger-latency"

  # --- Attested meter ---
  #
  # Two rules, and the difference between them is the whole design.
  #
  # A chain gap is money. The meter owed a record, could not write it, and
  # the request was served anyway under the configured posture. Nonzero
  # means revenue went unbilled and no receipt exists to reconstruct it
  # from, so it pages.
  #
  # A divergence is a discrepancy, not a loss. The counter and the chain
  # disagree, which means either receipts were dropped or something is
  # writing units outside the chain. Both are worth knowing and neither is
  # worth failing traffic over, so it files a ticket and never touches the
  # metering failure_mode.
  #
  # Neither rule is a billing source. These counters are lossy telemetry:
  # OTLP drops batches on export failure and cumulative counters reset
  # across a restart. Reconcile against the signed chain; alert off these.
  - name: sbproxy_alerts_meter
    rules:
      - alert: SBPROXY-METER-CHAIN-GAP
        expr: |
          sum by (tenant_id, failure_mode) (increase(sbproxy_meter_chain_gap_total[5m])) > 0
        for: 5m
        labels:
          severity: page
          slo_id: SLO-METER-CHAIN
          runbook_id: RB-METER-CHAIN-GAP
          window: 5m
        annotations:
          summary: "Meter could not write a record it owed (unbilled consumption)"
          description: |
            sbproxy_meter_chain_gap_total moved in the last 5 minutes. A
            request was metered, the receipt could not be written, and the
            call was served under the configured failure_mode. That
            consumption is not on any chain and cannot be invoiced.
            Check disk space and permissions on the ledger path first.
          runbook_url: "https://docs.sbproxy.dev/runbook#rb-meter-chain-gap"

      - alert: SBPROXY-METER-INCOHERENT-RECEIPT
        expr: |
          sum by (tenant_id) (increase(sbproxy_meter_incoherent_receipts_total[5m])) > 0
        for: 5m
        labels:
          severity: page
          slo_id: SLO-METER-CHAIN
          runbook_id: RB-METER-INCOHERENT-RECEIPT
          window: 5m
        annotations:
          summary: "A chained receipt contradicts its own provenance"
          description: |
            A receipt on the chain declares one provenance for a unit and
            carries the evidence of another. It hash-chains and it verifies
            against the published key, so nothing was tampered with: the
            claim itself cannot be true, and the number on it cannot be
            checked by anybody. Reads refuse it, so the chain will not
            reopen for appending either. Run POST /api/meter/verify for the
            sequence number, then look at that entry before invoicing the
            affected tenant.
          runbook_url: "https://docs.sbproxy.dev/runbook#rb-meter-incoherent-receipt"

      - alert: SBPROXY-METER-DIVERGENCE
        expr: |
          sum by (tenant_id) (increase(sbproxy_meter_divergence_total[30m])) > 0
        for: 15m
        labels:
          severity: ticket
          slo_id: SLO-METER-CHAIN
          runbook_id: RB-METER-DIVERGENCE
          window: 30m
        annotations:
          summary: "Meter unit counter and signed chain disagree"
          description: |
            Units counted for this tenant did not match units that reached
            the signed chain, past the export window. Either receipts were
            dropped on the way to the ledger or something is recording
            units outside the chain. Reconcile the ledger for the affected
            tenant; the chain is authoritative and the counter is not.
          runbook_url: "https://docs.sbproxy.dev/runbook#rb-meter-divergence"

      - alert: SBPROXY-METER-STALLED
        expr: |
          sum(increase(sbproxy_meter_receipts_total[15m])) > 0
          and
          sum(changes(sbproxy_meter_chain_seq[15m])) == 0
        for: 15m
        labels:
          severity: ticket
          slo_id: SLO-METER-CHAIN
          runbook_id: RB-METER-STALLED
          window: 15m
        annotations:
          summary: "Meter is classifying attempts but the chain head is flat"
          description: |
            Receipts are being classified while the chain head has not
            moved for 15 minutes. The append path is stalled, which no
            counter shows on its own because the counters keep rising.
            Check sbproxy_meter_append_duration_seconds for backpressure.
          runbook_url: "https://docs.sbproxy.dev/runbook#rb-meter-stalled"

  # --- Audit-log write ---
  - name: sbproxy_alerts_audit
    rules:
      # SLO-AUDIT-WRITE is 100% over 24h. Any sustained failure pages
      # immediately - durable audit is a compliance requirement
      # .
      - alert: SBPROXY-AUDIT-WRITE-FAILURE
        expr: |
          increase(sbproxy_audit_emit_duration_seconds_count{outcome!="ok"}[5m]) > 0
        for: 5m
        labels:
          severity: page
          slo_id: SLO-AUDIT-WRITE
          runbook_id: RB-AUDIT-WRITE
          window: 5m
        annotations:
          summary: "Audit-log write failures (immediate page)"
          description: |
            A non-ok sbproxy_audit_emit_duration_seconds outcome was
            recorded in the last 5 minutes. Audit emission must be 100%;
            sustained failure breaks the SOC 2 compliance contract.
          runbook_url: "https://docs.sbproxy.dev/runbook#rb-audit-write"

      - alert: SBPROXY-AUDIT-LATENCY-P99
        expr: sbproxy:slo:audit:emit_latency_p99:1h > 5
        for: 1h
        labels:
          severity: ticket
          slo_id: SLO-AUDIT-LATENCY
          runbook_id: RB-AUDIT-LATENCY
          window: 1h
        annotations:
          summary: "Audit emit p99 latency above 5 s (sustained 1h)"
          description: |
            sbproxy_audit_emit_duration_seconds p99 above 5 s for 1h.
            Backlog risk; investigate sink throughput.
          runbook_url: "https://docs.sbproxy.dev/runbook#rb-audit-latency"

  # --- AI gateway pre-provider admission (WOR-2595) ---
  #
  # A pre-provider refusal is the one AI failure no other rule in this file
  # can reach. It answers 4xx, so the availability burn-rate alerts stay
  # quiet; it never dials a provider, so no provider error, latency, token,
  # or cost series moves; and it is not a policy verdict, so the decision
  # planes stay quiet too. Left unalerted, a client integration that broke
  # against this gateway is silent until somebody notices the spend fell.
  #
  # Ticket rather than page. The refusals are correct: the gateway is
  # refusing what it was configured to refuse. What needs a human is the
  # caller, and that is next-business-day work, not a 3am page.
  - name: sbproxy_alerts_ai_admission
    rules:
      - alert: SBPROXY-AI-ADMISSION-REFUSAL-SHARE
        expr: sbproxy:ai:admission_refusal_share:5m > 0.05
        for: 15m
        labels:
          severity: ticket
          slo_id: SLO-AI-ADMISSION
          runbook_id: RB-AI-ADMISSION
          window: 5m
        annotations:
          summary: "More than 5% of {{ $labels.surface }} traffic refused before any provider was called"
          description: |
            sbproxy_ai_admission_decisions_total is taking more than 5% of
            the requests arriving on this AI surface, sustained for 15
            minutes. These requests were refused at the inbound shim or the
            stored-prompt resolver, so no provider saw them and no
            provider-side panel shows the loss. Open the AI Gateway
            dashboard and read the refusal reason: a bounded code names
            whether a caller is asking for a governed provider feature, a
            stored prompt is missing, or a client is sending unreadable
            bodies.
          runbook_url: "https://docs.sbproxy.dev/runbook#rb-ai-admission"

  # --- AI gateway post-commit streaming failures (WOR-2650) ---
  #
  # Ticket, not page. The damage is per request and bounded: one caller gets
  # one truncated answer. It is not a fleet outage, and both remedies, widening
  # a transport budget and steering traffic off a provider, are config changes
  # that hold until morning.
  #
  # What makes it worth an alert at all is that nothing else reports it.
  # Response headers carried a 200 before the failure happened, so
  # sbproxy:slo:substrate:availability scores every one of these a success.
  # Failover is impossible past the commit point, so sbproxy_ai_failovers_total
  # cannot carry them. sbproxy_ai_provider_errors_total does move for the two
  # upstream causes, but it counts pre-commit errors on the same series, and
  # those ended in a retry or a clean error status the caller could act on.
  # This is the only family that separates "the provider failed" from "the
  # caller was already being answered when the provider failed".
  - name: sbproxy_alerts_ai_stream_post_commit
    rules:
      - alert: SBPROXY-AI-STREAM-POST-COMMIT
        expr: sbproxy:ai:stream_post_commit_failure_share:5m > 0.01
        for: 15m
        labels:
          severity: ticket
          slo_id: SLO-AI-STREAM-COMMIT
          runbook_id: RB-AI-STREAM-POST-COMMIT
          window: 5m
        annotations:
          summary: "More than 1% of {{ $labels.provider }} responses failed after the gateway committed to them"
          description: |
            More than 1% of the responses this gateway accepted from this
            provider then failed part way through the stream, sustained for
            15 minutes. Headers were already sent with a 200 on them, so
            each of those callers received a truncated body with nothing in
            the response saying so, and no failover was possible. Open the
            AI Gateway dashboard and read the cause: upstream_timeout is a
            transport budget cutting generations that are still running and
            is yours to widen, and upstream_error is the provider resetting
            its own stream. Guardrail terminations are excluded from this
            rule.
          runbook_url: "https://docs.sbproxy.dev/runbook#rb-ai-stream-post-commit"

  # --- Certificate store ---
  #
  # The one TLS failure that looks like a working proxy. A pod whose
  # certificate store fell back to memory serves traffic normally and keeps
  # every other panel green, and the cost only lands on the next restart,
  # when the certificate it was holding is gone and it opens a fresh ACME
  # order. Let's Encrypt allows five duplicate certificates per hostname set
  # per week, so a restart loop turns a storage-path mistake into a hostname
  # that cannot get a certificate at all, days after the mistake was made.
  #
  # Ticket, not page. A shared backend (file, redis, s3, gcs, azure) that
  # will not open now refuses to start, so the fleet-wide issuance lock
  # cannot be lost silently and this alert can only be a pod-local backend
  # (redb, sqlite, memory). One node re-issuing on restart is real damage on
  # a clock of days, and the fix is a disk or a path, which is
  # next-business-day work.
  #
  # `== 1` rather than `> 0` so an absent series stays absent: the gauge
  # exists only in a process that opened a certificate store, and no ACME
  # configuration at all must not read as a healthy 0 or as a firing 1.
  - name: sbproxy_alerts_certs
    rules:
      - alert: SBPROXY-CERT-STORE-DEGRADED
        expr: |
          sbproxy:slo:certs:store_degraded:5m == 1
        for: 10m
        labels:
          severity: ticket
          slo_id: SLO-CERT-STORE
          runbook_id: RB-CERT-STORE-DEGRADED
          window: 5m
        annotations:
          summary: "Certificate store degraded to in-memory on backend {{ $labels.backend }}"
          description: |
            The configured certificate-store backend could not be opened and
            at least one process is running on an in-memory store.
            Certificates do not survive a restart, so each restart opens a
            fresh ACME order against the same hostname set and the CA's
            duplicate-certificate limit is the deadline. Read the error-level
            log line naming the backend, fix acme.storage_path or the
            backend, and restart.
          runbook_url: "https://docs.sbproxy.dev/runbook#rb-cert-store-degraded"

  # --- Cardinality and deprecation (log-only) ---
  - name: sbproxy_alerts_log_only
    rules:
      - alert: SBPROXY-CARD-BUDGET-NEAR-CAP
        expr: sbproxy:cardinality:requests_total > (50000 * 0.9)
        for: 10m
        labels:
          severity: log
          slo_id: SLO-CARD-BUDGET
          runbook_id: RB-CARD-BUDGET
          window: 10m
        annotations:
          summary: "sbproxy_requests_total cardinality at 90% of budget"
          description: |
            Cardinality of sbproxy_requests_total exceeds 90% of the
            50k cap. CI gate (B1.12 / Q1.14) will fail PRs that push
            past it. Log-only.
          runbook_url: "https://docs.sbproxy.dev/runbook#rb-card-budget"

      # SBPROXY-DEPRECATED-FLAG-USE is deleted, not disabled.
      #
      # It alerted on sbproxy_deprecated_flag_use_total, a metric no crate has
      # ever declared. It could not fire, and a rule that cannot fire is worse
      # than no rule: it occupies the slot where a working one would go, and it
      # reads to anyone auditing the file as though deprecation is covered.
      #
      # Restoring it means emitting the counter first. The alert can come back
      # in the same commit that does.

  # --- Mesh inbound admission (WOR-2637) ---
  #
  # The mesh refuses inbound cache RPC connections at six controls and only
  # five of them are a fault, so the rule reads the recorded series that
  # already drops `idle_timeout` rather than the raw counter. A quiet cluster
  # reclaims idle peer connections by itself; alerting on that would page on
  # housekeeping and train on-call to ignore the rule.
  #
  # Ticket rather than page. The mesh is a shared cache and membership plane,
  # not the inbound serving path: a node turning peers away degrades cache
  # coherence and owner routing while it keeps answering its own traffic. What
  # needs a human is a connection cap, a certificate, or a peer, and all three
  # are next-business-day work.
  #
  # The counter is absent, not zero, on a deployment with no mesh, so this rule
  # is silent there rather than permanently satisfied.
  - name: sbproxy_alerts_mesh_admission
    rules:
      - alert: SBPROXY-MESH-INBOUND-REJECTED
        expr: |
          sbproxy:mesh:inbound_rejected:5m > 0
        for: 10m
        labels:
          severity: ticket
          slo_id: SLO-MESH-ADMISSION
          runbook_id: RB-MESH-ADMISSION
          window: 5m
        annotations:
          summary: "Mesh is refusing inbound peer connections ({{ $labels.reason }})"
          description: |
            This node has been rejecting inbound cache RPC connections for 10
            minutes under a reason that is not the routine idle reclaim.
            connection_limit means the inbound connection cap is reached and
            peers are being turned away. handshake_timeout and
            handshake_failed are mesh mTLS. frame_timeout and write_timeout
            are a peer that opened a request and then stopped talking. The
            peer address is in the transport log line, not in a label.
          runbook_url: "https://docs.sbproxy.dev/runbook#rb-mesh-admission"

  # --- Storage backend operations ---
  #
  # `crates/sbproxy-storage/src/metrics.rs` asks for exactly this rule in its
  # module docs: group the error counter by `error_kind` so a disconnected
  # backend surfaces on its own rather than as a shape in someone else's
  # latency chart.
  #
  # Ticket rather than page, on the same reasoning as the mesh rule above: the
  # mesh Redis backend is the only production caller of the storage layer
  # today, so losing it costs shared mesh state and not inbound serving. A
  # deployment that grows a second caller on the request path should raise this
  # tier locally and say so in its own runbook.
  - name: sbproxy_alerts_storage
    rules:
      - alert: SBPROXY-STORAGE-BACKEND-ERRORS
        expr: |
          sbproxy:storage:op_errors:5m > 0
        for: 10m
        labels:
          severity: ticket
          slo_id: SLO-STORAGE-OPS
          runbook_id: RB-STORAGE-BACKEND
          window: 5m
        annotations:
          summary: "Storage backend {{ $labels.backend }} returning {{ $labels.error_kind }} errors"
          description: |
            sbproxy_storage_op_errors_total has been moving for 10 minutes.
            disconnected and timeout are the backend or the network between
            here and it, and the mesh is running without its shared store
            until they clear. key_too_large and value_too_large are a caller
            writing past the storage layer's caps and will repeat until that
            call site is fixed. Read the error ratio on the Mesh Admission and
            Storage dashboard to size the damage before deciding which.
          runbook_url: "https://docs.sbproxy.dev/runbook#rb-storage-backend"

  # --- Forward stubs (Waves 2-5) ---
  #
  # The following placeholders are intentionally not yet wired:
  #
  # - SBPROXY-RAIL-QUORUM (page, immediate) - Wave 3 (G3.4 facilitator
  #   quorum). Fires when fewer than one healthy facilitator per chain.
  # - SBPROXY-DR-RESTORE-MISSED (page) - Wave 2 monthly restore-drill;
  #   fires when the calendar window passes without a successful drill.
  # - SBPROXY-KYA-ANCHOR-EXPIRED (page) - Wave 5 KYA trust-anchor
  #   freshness.
  # - SBPROXY-CLASSIFIER-DRIFT (ticket) - Wave 5 prompt-injection
  #   classifier drift.
  # - SBPROXY-ANOMALY-NOISE-BUDGET (ticket) - Wave 5 anomaly detector.
  #
  # These come online in their respective task waves and reuse the same
  # severity / slo_id / runbook_id label conventions defined here.
