apiVersion: v2
name: sbproxy
description: |
  OSS Kubernetes operator for sbproxy. Installs the SBProxy and SBProxyConfig
  CustomResourceDefinitions plus an operator Deployment that reconciles them
  into proxy Deployments, Services, and ConfigMaps.
type: application
# Chart version. Bump on every chart change. Independent of appVersion:
# this is the packaging's own semver, so a values or template edit bumps it
# without the application underneath having moved.
version: 0.1.3
# App version. Tracks the SBproxy release this chart is cut against, which is
# the workspace version in the root Cargo.toml. `image.tag` defaults to this
# value, so bumping here is the only edit a release needs; override with
# `--set image.tag=...` to run a locally built image.
appVersion: "1.14.0"
keywords:
  - sbproxy
  - proxy
  - operator
  - reverse-proxy
home: https://github.com/soapbucket/sbproxy
sources:
  - https://github.com/soapbucket/sbproxy
maintainers:
  - name: Soap Bucket LLC
    url: https://soapbucket.com
