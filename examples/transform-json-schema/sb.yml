# yaml-language-server: $schema=../../schemas/sb-config.schema.json
# JSON Schema validation transform.
#
# Validates the upstream JSON response body against a JSON Schema. Schemas
# are compiled once at config-load time. Remote `$ref` resolution is
# disabled, so the schema must be self-contained.
#
# Two origins:
#   - `schema-ok.local` returns a body that matches the schema, so the
#     transform lets it through.
#   - `schema-bad.local` returns a body that violates the schema, so the
#     transform refuses the response.
#
# `fail_on_error: true` is the legacy spelling of `failure_posture:
# closed`, and a closed transform's contract is that the client never
# sees the untransformed body. That holds on the `type: static` action
# both origins use, not only on a proxied one: a refusal here answers
# `500` with `x-sbproxy-transform-error: json_schema` and the invalid
# body is never written. See README.md for the proxied comparison, which
# refuses with a `502` because the upstream's headers are already
# committed by the time the transform runs.
#
# Run:
#   make run CONFIG=examples/transform-json-schema/sb.yml
#
# Test:
#   # Valid - body matches schema, transform passes through.
#   curl -i -H 'Host: schema-ok.local' http://127.0.0.1:8080/
#
#   # Invalid - body violates schema, the closed posture refuses with a 500.
#   curl -i -H 'Host: schema-bad.local' http://127.0.0.1:8080/

proxy:
  http_bind_port: 8080

origins:
  "schema-ok.local":
    action:
      type: static
      status: 200
      content_type: application/json
      json_body:
        id: 1
        title: "valid post"
        userId: 1
    transforms:
      - type: json_schema
        fail_on_error: true
        schema:
          type: object
          required: [id, title, userId]
          properties:
            id: { type: integer }
            title: { type: string }
            userId: { type: integer }

  "schema-bad.local":
    action:
      type: static
      status: 200
      content_type: application/json
      json_body:
        id: "should-be-int-but-is-string"
        title: 42
    transforms:
      - type: json_schema
        fail_on_error: true
        schema:
          type: object
          required: [id, title, userId]
          properties:
            id: { type: integer }
            title: { type: string }
            userId: { type: integer }
