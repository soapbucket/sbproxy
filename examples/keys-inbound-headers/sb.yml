# yaml-language-server: $schema=../../schemas/sb-config.schema.json
# Minted keys presented in whatever header a tool already sends.
#
# A minted key normally rides in `Authorization: Bearer`. Plenty of tools do
# not send that: an Anthropic SDK sends `x-api-key`, Azure OpenAI sends
# `api-key`, and internal tools send whatever their author picked. Rather than
# rewrite those tools, sweep the headers they already use.
#
# A minted token is `sbp_<16 hex>_<64 hex>`, a fixed 85 characters over a fixed
# alphabet, so a swept header is accepted or rejected without a store lookup.
# A caller's own `sk-proj-...` or `sk-ant-...` provider key is not a minted
# token and passes straight through to the upstream that owns it. That is what
# lets minted keys and existing keys work side by side on the same header.
#
# Setup:
#   export OPENAI_API_KEY=sk-...
#   export SBPROXY_KEY_PEPPER=a-long-random-server-pepper
#   export SBPROXY_KEY_MASTER=a-long-random-master-key
#   make run CONFIG=examples/keys-inbound-headers/sb.yml
#
# Mint a key (the plaintext token is returned exactly once):
#   TOKEN=$(curl -s -u admin:admin -X POST http://127.0.0.1:9090/admin/keys \
#     -H 'Content-Type: application/json' \
#     -d '{"name":"anthropic-sdk"}' | jq -r .token)
#
# Present it the way the Anthropic SDK would, in x-api-key:
#   curl -s http://127.0.0.1:8080/v1/messages \
#     -H 'Host: anthropic.local' \
#     -H "x-api-key: $TOKEN" \
#     -H 'Content-Type: application/json' \
#     -d '{"model":"claude-3-5-sonnet-20241022","max_tokens":64,
#          "messages":[{"role":"user","content":"hi"}]}'
#
# The proxy consumes x-api-key and never forwards it upstream.
#
# Native credential instead: keep sending only your own upstream credential,
# with no minted key on any swept header. This is a separate governed mode,
# not something layered on top of a minted key: once a minted key resolves
# from any swept header, SBproxy governs the request with the origin's own
# configured `api_key` and never looks at the caller's credential, no matter
# what else is present. Presenting a minted key in x-sb-api alongside your
# own credential in Authorization does not forward that credential; only
# the operator's `api_key` above reaches the upstream. Requires the
# `native_key_policy` allowlist below and the matching
# `accept_native_credentials_for` on the provider entry; without both, a
# recognized caller-owned credential is refused with 403 before dispatch.
#   curl -s http://127.0.0.1:8080/v1/messages \
#     -H 'Host: anthropic.local' \
#     -H 'Authorization: Bearer <your own upstream key>' \
#     -H 'Content-Type: application/json' \
#     -d '{"model":"claude-3-5-sonnet-20241022","max_tokens":64,
#          "messages":[{"role":"user","content":"hi"}]}'
#
# SBproxy forwards that credential unmodified and never holds or stores it.

proxy:
  http_bind_port: 8080

  admin:
    enabled: true
    port: 9090
    username: admin
    password: admin

  key_management:
    enabled: true
    store:
      backend: embedded
      path: /tmp/sbproxy-keys-inbound-headers.redb
    crypto:
      pepper: env:SBPROXY_KEY_PEPPER
      master_key: env:SBPROXY_KEY_MASTER
    failure_posture: closed
    inbound:
      # Swept in the order listed; the first well-shaped token wins. Two
      # different tokens in two headers is a 400 rather than a silent pick.
      headers:
        - name: authorization
          scheme: "Bearer "
        - name: x-api-key
          scheme: ""
        - name: x-sb-api
          scheme: ""
      # Leave false unless this origin has no other auth provider. When true a
      # request carrying no minted key is refused with a 401.
      require: false
      # provider_hints ships non-empty by default, so a caller-owned key
      # (sk-proj-..., sk-ant-...) landing in a swept header is recognized as
      # a native provider credential. Without an explicit allowlist here,
      # SBproxy refuses every recognized credential with 403 before
      # dispatch (a boot-time WARN names the recognized providers when this
      # is missing). Required for the "sidecar" pattern below, where the
      # caller keeps sending their own upstream credential.
      native_key_policy:
        allowed_providers: [openai]

origins:
  anthropic.local:
    action:
      type: ai_proxy
      providers:
        - name: openai
          # Also required for the sidecar pattern: without this opt-in, a
          # recognized native credential still has no destination allowed
          # to receive it, and the provider entry only ever uses its own
          # api_key below.
          accept_native_credentials_for: openai
          api_key: env:OPENAI_API_KEY
