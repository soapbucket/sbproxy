# yaml-language-server: $schema=../../schemas/sb-config.schema.json
# LoRA-aware routing across three model-serving replicas.
#
# This example wires the `lora-aware` RoutingStrategy onto a three-target
# load balancer pool. The strategy walks each target's `metadata` map,
# looks for a `loaded_adapters` array, and prefers a healthy target that
# already has the requested adapter warm. If none does, it returns None
# and the configured `algorithm` (least_connections here) gets to pick.
#
# Production config notes:
#
#   - `strategy: lora-aware` compiles the registered strategy into the
#     production load-balancer action. `algorithm: least_connections`
#     remains the fallback when the strategy returns no selection.
#
#   - The `metadata.loaded_adapters` array on each target is the
#     metadata contract the strategy reads. Operators can generate and
#     hot-reload it from their adapter inventory source of truth.
#
#   - The strategy is fail-soft: missing or malformed `loaded_adapters`
#     metadata is treated as "no adapters loaded" rather than an error,
#     so a single misconfigured target cannot poison the pool.
#
# Run:
#   make run CONFIG=examples/lora-aware-routing/sb.yml
#
# Test:
#   curl -sS -H 'Host: ai.local' \
#     'http://127.0.0.1:8080/v1/chat?adapter=alice-tone' \
#     -d '{"prompt":"hello"}'

proxy:
  http_bind_port: 8080

origins:
  "ai.local":
    action:
      type: load_balancer

      # Fallback selector when lora-aware has no warm match.
      algorithm: least_connections

      # Compile the registered production strategy.
      lb_method: plugin
      strategy: lora-aware

      targets:
        # Replica 0: warm for alice-tone and bob-style.
        - url: https://test.sbproxy.dev/lora-replica-0
          weight: 1
          # The strategy reads this production metadata directly.
          metadata:
            loaded_adapters:
              - alice-tone
              - bob-style

        # Replica 1: warm for carol-voice only. Cold for alice-tone.
        - url: https://test.sbproxy.dev/lora-replica-1
          weight: 1
          metadata:
            loaded_adapters:
              - carol-voice

        # Replica 2: warm for alice-tone (so it competes with replica 0
        # for adapter=alice-tone requests). The strategy will pick
        # whichever of {0, 2} has fewer in-flight requests; a tie breaks
        # on the lower index.
        - url: https://test.sbproxy.dev/lora-replica-2
          weight: 1
          metadata:
            loaded_adapters:
              - alice-tone
              - dave-formal
