# yaml-language-server: $schema=../../schemas/sb-config.schema.json
# HTML transform.
#
# Rewrites HTML responses from test.sbproxy.dev/html (a small fixed-shape
# sample page maintained for exactly this kind of example).
# This config:
#   - removes the upstream `<h1>` element
#   - injects a stylesheet at the end of <head>
#   - injects a banner at the start of <body>
#   - stamps a `data-rewritten` attribute on every matching `<p>`
#
# Run:
#   make run CONFIG=examples/transform-html/sb.yml
#
# Test:
#   # Original upstream response
#   curl -s https://test.sbproxy.dev/html
#
#   # Proxied response: no h1, banner injected, every <p> tagged
#   curl -s -H 'Host: html.local' http://127.0.0.1:8080/html

proxy:
  http_bind_port: 8080

origins:
  "html.local":
    action:
      type: proxy
      url: https://test.sbproxy.dev
    transforms:
      - type: html
        remove_selectors:
          - h1
        inject:
          - position: head_end
            content: '<link rel="stylesheet" href="https://cdn.example.com/sbproxy.css">'
          - position: body_start
            content: '<div id="sb-banner">Served via sbproxy</div>'
        rewrite_attributes:
          - selector: p
            attribute: data-rewritten
            value: "true"
