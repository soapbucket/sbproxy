# yaml-language-server: $schema=../../schemas/sb-config.schema.json
# rail-x402-base-sepolia - the same route pointed at a real facilitator.
#
# This file is manual. CI never runs it, nothing here spends funds on your
# behalf, and no credential is committed. Four fields have to be replaced
# with values your facilitator publishes before it settles anything:
#
#   rails.x402.facilitators[0].facilitator_url - the facilitator's
#       complete API root over HTTPS. The adapter appends exactly
#       `/verify` or `/settle` and nothing else.
#   rails.x402.network  - CAIP-2 identifier for the chain you settle on.
#   rails.x402.asset    - the asset contract on that network.
#   rails.x402.pay_to   - your own receive address on that network.
#
# Validate it without holding any of its secrets:
#   sbproxy validate -f examples/rail-x402-base-sepolia/sb-testnet.yml
#
# Serve it:
#   export SBPROXY_PAYMENT_BINDING_KEY="$(openssl rand -hex 32)"
#   sbproxy serve -f examples/rail-x402-base-sepolia/sb-testnet.yml
#
# You also need a client that can produce an x402 `exact` payload for the
# scheme your facilitator verifies. See docs/402-challenge.md for the
# exact envelope the proxy accepts.

proxy:
  http_bind_port: 8080

  payments:
    state_path: /var/lib/sbproxy/payments.sqlite3
    challenge_binding_key: secret://env/SBPROXY_PAYMENT_BINDING_KEY
    authorization_timeout_ms: 2000
    max_body_bytes: 1048576

    worker:
      reconcile_interval_ms: 1000
      max_reconcile_batch: 32
      shutdown_timeout_ms: 5000

    rails:
      x402:
        scheme: exact
        # REPLACE: the chain you settle on, as a CAIP-2 identifier.
        network: "eip155:84532"
        # REPLACE: the asset contract on that network.
        asset: "0x036CbD53842c5426634e7929541eC2318f3dCF7e"
        quote_currency: USD
        asset_decimals: 6
        # REPLACE: your own receive address. The placeholder below
        # receives nothing and belongs to nobody.
        pay_to: "0x1111111111111111111111111111111111111111"
        max_timeout_seconds: 60
        extra:
          name: USDC
          version: "2"
        # REPLACE: the API root your facilitator publishes. HTTPS only,
        # no query, no fragment, no `/verify` or `/settle` suffix.
        facilitators:
          - facilitator_url: https://facilitator.example/api
        verify_timeout_ms: 700
        settle_timeout_ms: 1200
        breaker:
          failure_threshold: 3
          open_ms: 5000
          half_open_max: 1

origins:
  "blog.test.sbproxy.dev":
    action:
      type: proxy
      url: https://test.sbproxy.dev

    policies:
      - type: ai_crawl_control
        price: 0.001
        currency: USD
        header: crawler-payment

        crawler_user_agents:
          - GPTBot
          - ChatGPT-User
          - ClaudeBot
          - anthropic-ai
          - CCBot
          - PerplexityBot
          - Google-Extended

        free_paths:
          - /robots.txt
          - /health

        tiers:
          - route_pattern: /article*
            price:
              amount_micros: 1000
              currency: USD
            content_shape: html
            paywall_position: top_of_page
