# Stack for the rail-x402-base-sepolia example.
#
# Three containers on one bridge network:
#
#   sbproxy                  - the gateway, mounts ./sb.yml read-only on :8080
#   mock-x402-facilitator    - stub answering /verify and /settle with the
#                              pinned x402 v2 shapes, published on :8081
#   mock-origin              - nginx serving a single article HTML
#
# The stub is a wire-shape reference, not a settlement backend: it serves
# plain HTTP and the rail requires an HTTPS API root. See sb-testnet.yml
# and the README for pointing the rail at a real facilitator.
#
# Bring up:    docker compose up -d --wait
# Validate:    docker compose config
# Tear down:   docker compose down -v

services:

  # --- sbproxy data plane ---
  sbproxy:
    build:
      context: ../..
      dockerfile: Dockerfile.cloudbuild
    image: sbproxy:30-rail-x402
    container_name: sbproxy_30_x402
    command: ["serve", "-f", "/etc/sbproxy/sb.yml"]
    ports:
      - "8080:8080"
    volumes:
      - ./sb.yml:/etc/sbproxy/sb.yml:ro
    environment:
      - SB_LOG_LEVEL=info
    depends_on:
      mock-x402-facilitator:
        condition: service_healthy
      mock-origin:
        condition: service_healthy
    # No healthcheck: the runtime image (Dockerfile.cloudbuild's
    # gcr.io/distroless/cc-debian12 stage) has no shell and no wget, so
    # a CMD-SHELL wget probe can never succeed here. Verify liveness
    # from the host instead (curl http://localhost:8080/health).
    networks:
      - x402sb

  # --- x402 facilitator stub ---
  #
  # The only two endpoints an x402 rail ever calls, plus a health probe:
  #   POST /verify                 -> 200 {"isValid":true}
  #   POST /settle                 -> 200 {"success":true,"transaction":...}
  #   GET  /__health               -> 200 (compose health probe)
  #
  # It performs no signature verification and moves no value. Published on
  # :8081 so the wire shapes can be read with curl.
  mock-x402-facilitator:
    image: nginx:1.27.3-alpine
    container_name: sbproxy_30_x402_facilitator
    ports:
      - "8081:80"
    volumes:
      - ./mock-x402-facilitator/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/__health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - x402sb

  # --- Mock origin (article server) ---
  mock-origin:
    image: nginx:1.27.3-alpine
    container_name: sbproxy_30_x402_origin
    volumes:
      - ./mock-origin/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/__health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - x402sb

networks:
  x402sb:
    driver: bridge
