# yaml-language-server: $schema=../../schemas/sb-config.schema.json
# AI gateway: model group (one public model name, several deployments).
#
# A `model_groups:` entry binds one name your callers send as `model` to a list
# of members. Each member names a provider on this action, the upstream model id
# that provider serves, and its share of traffic. Members may serve DIFFERENT
# model ids, which is what a same-model-name pool cannot express: here the
# public name `chat` fronts `gpt-4o-mini` on one deployment and
# `gpt-3.5-turbo` on the other. Both are real OpenAI model ids, so the
# walkthrough below runs as written against one OPENAI_API_KEY; in a real
# deployment the second member would be another vendor's endpoint, an Azure
# deployment name for example, with its own key and base_url.
#
# The group carries its own routing strategy, independent of the action's, and
# resolves before every model gate, so `blocked_models`, per-key allowlists, the
# per-model rate limits, and the budget scope all judge the member's real model
# id rather than the group name.
#
# The simpler shape still works: two providers that both declare `gpt-4o-mini`
# in `models:` form a pool the action's own `routing:` load-balances. Reach for
# a group when the model ids differ, or when one public name needs a balancing
# policy of its own.
#
# Setup:
#   export OPENAI_API_KEY=sk-...
#   make run CONFIG=examples/ai-model-group/sb.yml
#
# Test (every request addresses the one public name; the group splits 9:1):
#   curl -s http://127.0.0.1:8080/v1/chat/completions \
#     -H 'Host: ai.local' -H 'Content-Type: application/json' \
#     -d '{"model":"chat","messages":[{"role":"user","content":"In one sentence, what is load balancing?"}]}' \
#     | jq -r '.model, .choices[0].message.content'

proxy:
  http_bind_port: 8080

origins:
  "ai.local":
    action:
      type: ai_proxy
      routing: round_robin

      providers:
        - name: openai-deployment-a
          provider_type: openai
          api_key: ${OPENAI_API_KEY}
          default_model: gpt-4o-mini
          models:
            - gpt-4o-mini

        - name: openai-deployment-b
          provider_type: openai
          # In production this would be a second deployment's key / base_url,
          # for example an Azure OpenAI deployment with its own model id.
          api_key: ${OPENAI_API_KEY}
          models:
            - gpt-3.5-turbo

      model_groups:
        - name: chat
          routing: weighted
          members:
            - provider: openai-deployment-a
              model: gpt-4o-mini
              weight: 9
            - provider: openai-deployment-b
              model: gpt-3.5-turbo
              weight: 1
