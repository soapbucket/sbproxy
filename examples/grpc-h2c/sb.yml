# yaml-language-server: $schema=../../schemas/sb-config.schema.json
# gRPC over HTTP/2 cleartext (h2c).
#
# Proxies plaintext gRPC clients to an upstream gRPC server. gRPC
# requires HTTP/2 end-to-end; when the downstream client does not
# negotiate TLS+ALPN (the common case for sidecars, in-cluster
# traffic, and tonic Channels speaking `http://...`), the proxy
# needs to detect the HTTP/2 connection preface on the unencrypted
# port and serve the connection as h2. That is what
# `proxy.http2_cleartext: true` does.
#
# Without `http2_cleartext`, the listener parses the h2 preface
# (`PRI * HTTP/2.0\r\n\r\nSM\r\n\r\n`) as a malformed HTTP/1.1
# request and tears the connection down with `FRAME_SIZE_ERROR`.
# TLS-fronted gRPC over `https_bind_port` does not need this flag
# because ALPN negotiates h2 during the TLS handshake.
#
# This directory boots its own upstream: `fixture.py` is a Python
# grpcio Echo service on :50051. `grpc-web.example.com` accepts
# browser gRPC-Web. `grpc-json.example.com` transcodes REST/JSON
# onto the same unary method (descriptor: echo.pb).
#
# Run:
#   python3 fixture.py &
#   make run CONFIG=examples/grpc-h2c/sb.yml
#
# Test:
#   curl -sS -H 'Host: grpc-json.example.com' \
#       -H 'Content-Type: application/json' \
#       -d '{"message":"hello"}' \
#       http://127.0.0.1:8080/echo

proxy:
  http_bind_port: 8080
  # Opt in to HTTP/2 cleartext on the plain HTTP listener so
  # plaintext gRPC clients can pass through.
  http2_cleartext: true

  # Only because the demo gRPC server runs on loopback: the SSRF guard
  # refuses private/loopback upstream addresses unless allowlisted. A
  # production config pointing at a real upstream does not need this
  # block. Without it every request 502s with "SSRF: upstream resolved
  # to private network" even though the h2c listener itself is working.
  extensions:
    upstream:
      allow_private_cidrs:
        - '127.0.0.1/32'

origins:
  "grpc.example.com":
    action:
      type: grpc
      url: "grpc://127.0.0.1:50051"
  "grpc-web.example.com":
    action:
      type: grpc
      url: "grpc://127.0.0.1:50051"
      grpc_web: true
  "grpc-json.example.com":
    action:
      type: grpc
      url: "grpc://127.0.0.1:50051"
      transcode:
        descriptor_set: examples/grpc-h2c/echo.pb
        routes:
          - method: POST
            path: /echo
            grpc_method: sbproxy_e2e.echo.Echo.Hello
            body: "*"
