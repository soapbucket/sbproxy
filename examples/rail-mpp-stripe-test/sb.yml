# yaml-language-server: $schema=../../schemas/sb-config.schema.json
# rail-mpp-stripe-test - Payment HTTP Authentication settling on Stripe.
#
# Two surfaces, one rail:
#
#   protocols.payment_auth - the wire protocol. `WWW-Authenticate: Payment`
#                            on the 402, `Authorization: Payment` on the
#                            retry, `Payment-Receipt` on the paid 2xx.
#   rails.stripe           - what actually settles it. Payment Auth is a
#                            credential transport, not a network that
#                            moves funds, so there is no `mpp` rail to
#                            configure.
#
# `usage_reporters.stripe_meter` is here to make the split visible: meter
# events record consumption and can never settle a payment or open a
# route.
#
# Validate it without holding any of its secrets:
#   sbproxy validate -f examples/rail-mpp-stripe-test/sb.yml
#
# Serve it (a Stripe test-mode key is enough; nothing here charges a real
# card):
#   export SBPROXY_PAYMENT_BINDING_KEY="$(openssl rand -hex 32)"
#   export SBPROXY_PAYMENT_RECOVERY_KEY="$(openssl rand -hex 32)"
#   export STRIPE_SECRET_KEY=sk_test_...
#   docker compose up -d --wait
#
# Probe the challenge:
#   curl -is -H 'Host: feed.test.sbproxy.dev' \
#        -H 'User-Agent: ClaudeBot/1.0' \
#        -H 'Accept-Payment: stripe;intent=charge' \
#        http://127.0.0.1:8080/feed/articles/2026

proxy:
  http_bind_port: 8080

  # The mock-origin backend resolves to the docker-compose bridge
  # network (172.16.0.0/12), which the SSRF guard treats as private by
  # default. Allowlisted here because this example's whole point is a
  # self-contained compose stack; a production config pointing at a
  # real upstream does not need this block.
  extensions:
    upstream:
      allow_private_cidrs:
        - '172.16.0.0/12'

  payments:
    state_path: /var/lib/sbproxy/payments.sqlite3
    challenge_binding_key: env:SBPROXY_PAYMENT_BINDING_KEY
    authorization_timeout_ms: 2000
    max_body_bytes: 1048576

    # Required whenever the Stripe rail is enabled. A create that crashed
    # between the dispatch stamp and the recorded response is recovered by
    # replaying byte-identical request bytes under the same idempotency
    # key. Those bytes carry a single-use payment token in the Payment
    # Auth form, so they are only ever stored encrypted.
    recovery_encryption:
      key_id: payments-2026-08
      key: env:SBPROXY_PAYMENT_RECOVERY_KEY
      # Hard expiry, 1 through 23 hours. The ceiling sits one hour below
      # Stripe's documented idempotency-key retention so a same-key
      # recovery cannot race the provider forgetting the request.
      max_age_hours: 23

    worker:
      reconcile_interval_ms: 1000
      max_reconcile_batch: 32
      shutdown_timeout_ms: 5000

    protocols:
      payment_auth:
        # Declared rather than assumed. A config written against another
        # draft fails at load instead of emitting bytes no client parses.
        draft: draft-ryan-httpauth-payment-01
        # The protection space. It is the first slot of the challenge
        # binding, so changing it invalidates outstanding challenges. A
        # quote or backslash here is rejected.
        realm: feed.test.sbproxy.dev
        # The only registered method and intent in this release.
        method: stripe
        intent: charge

    rails:
      stripe:
        # Named, never inlined.
        api_key: env:STRIPE_SECRET_KEY
        # The only version accepted. A silent follow of the account's
        # dashboard default would authorize requests against a
        # PaymentIntent contract nobody reviewed.
        api_version: 2026-06-24.dahlia
        # The only account context accepted. No Stripe-Account header is
        # sent, so a payer cannot choose who gets paid.
        account_context: platform
        # Copied into the method details of a Payment Auth request.
        business_network_id: profile_test_example
        # Checked against the built-in ISO-4217 table, so a mis-declared
        # currency cannot charge a hundred times the quoted price.
        quote_currency: USD
        currency_decimals: 2
        payment_method_types: [card]
        # Also offer the direct PaymentIntent mode, for clients that speak
        # Stripe already. Only manual capture is accepted: preparing a
        # challenge must not take money for a resource not yet delivered.
        direct_payment_intent:
          enabled: true
          capture_method: manual

    usage_reporters:
      # Accounting, not settlement. A reporter cannot build a receipt and
      # cannot move an intent to Succeeded.
      stripe_meter:
        event_name: sbproxy_feed_fetches
        customer_field: stripe_customer_id
        # Which request-path record is authoritative for this meter
        # event. Required, and deliberately without a default: one
        # request can produce a request receipt, an AI usage record, and
        # a record per MCP tool call, and billing two of them against
        # one meter charges the customer twice for one sale.
        #
        # `http` bills the signed request receipt, so it needs a
        # `proxy.attestation` block with a role that writes receipts and
        # a `billable` outcome table naming this unit. This example does
        # not configure one, because its subject is the payment rails
        # rather than metering: the reporter is here to show that a
        # meter event can never settle a payment. See docs/metering.md
        # for the attestation half.
        source: http
        unit: feed_fetch

origins:
  "feed.test.sbproxy.dev":
    action:
      type: proxy
      url: http://mock-origin:80

    policies:
      - type: ai_crawl_control
        price: 0.005
        currency: USD
        header: crawler-payment

        crawler_user_agents:
          - GPTBot
          - ChatGPT-User
          - ClaudeBot
          - anthropic-ai
          - CCBot
          - PerplexityBot
          - Google-Extended

        free_paths:
          - /robots.txt
          - /health

        # One priced route at $0.005. The currency has to match the
        # rail's quote_currency; the proxy converts nothing.
        tiers:
          - route_pattern: /feed/*
            price:
              amount_micros: 5000
              currency: USD
            content_shape: markdown
            paywall_position: top_of_page
