# Stack for the `ai-crawl-tiered` example. Three containers on
# one bridge network:
#
#   sbproxy      - the gateway, mounts ./sb.yml read-only on :8080
#   mock-ledger  - nginx returning a fixed redeem JSON on POST
#                  /v1/ledger/redeem
#   mock-origin  - nginx serving three article shapes (preview HTML,
#                  feed Markdown, full HTML)
#
# Image tags are pinned to specific versions so a `:latest` rebase
# upstream cannot change CI behavior. Bump deliberately.
#
# Bring up:    docker compose up -d --wait
# Validate:    docker compose config
# Tear down:   docker compose down -v

services:

  # --- sbproxy data plane ---
  #
  # Builds the proxy from the workspace source. Cloud Build's variant
  # (`Dockerfile.cloudbuild`) is the reference Dockerfile; it builds a
  # release binary and wraps it in distroless/cc-debian13. Operators
  # who want to pin a specific release can swap `build:` for
  # `image: soapbucket/sbproxy:<tag>` once a public image tag
  # is available.
  sbproxy:
    build:
      context: ../..
      dockerfile: Dockerfile.cloudbuild
    image: sbproxy:24-ai-crawl-tiered
    container_name: sbproxy_24_tiered
    command: ["serve", "-f", "/etc/sbproxy/sb.yml"]
    ports:
      - "8080:8080"
    volumes:
      - ./sb.yml:/etc/sbproxy/sb.yml:ro
    environment:
      - SB_LOG_LEVEL=info
    depends_on:
      mock-ledger:
        condition: service_healthy
      mock-origin:
        condition: service_healthy
    # No healthcheck: the runtime image (Dockerfile.cloudbuild's
    # gcr.io/distroless/cc-debian12 stage) has no shell and no wget, so
    # a CMD-SHELL wget probe can never succeed here. Verify liveness
    # from the host instead: the proxy data plane exposes `/health` on
    # its main listener unconditionally regardless of Host header.
    # `/healthz` (and `/readyz`) live on the admin port (default 9090),
    # which this example does not enable.
    networks:
      - tieredsb

  # --- Mock HTTP ledger ---
  mock-ledger:
    image: nginx:1.27.3-alpine
    container_name: sbproxy_24_tiered_ledger
    volumes:
      - ./mock-ledger/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # `wget -q -O /dev/null` (GET, discard body) plus 127.0.0.1
      # explicit. The default `localhost` resolves to ::1 (IPv6) under
      # BusyBox in this image, but nginx only listens on IPv4 because
      # the upstream entrypoint script `10-listen-on-ipv6-by-default.sh`
      # cannot modify the read-only-mounted /etc/nginx/conf.d/default.conf.
      # 127.0.0.1 forces IPv4 resolution and avoids the mismatch.
      #
      test: ["CMD-SHELL", "wget -q -O /dev/null --tries=1 http://127.0.0.1/__ledger_health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - tieredsb

  # --- Mock origin (article server) ---
  mock-origin:
    image: nginx:1.27.3-alpine
    container_name: sbproxy_24_tiered_origin
    volumes:
      - ./mock-origin/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # `wget -q -O /dev/null` (GET, discard body) plus 127.0.0.1
      # explicit. The default `localhost` resolves to ::1 (IPv6) under
      # BusyBox in this image, but nginx only listens on IPv4 because
      # the upstream entrypoint script `10-listen-on-ipv6-by-default.sh`
      # cannot modify the read-only-mounted /etc/nginx/conf.d/default.conf.
      # 127.0.0.1 forces IPv4 resolution and avoids the mismatch.
      #
      test: ["CMD-SHELL", "wget -q -O /dev/null --tries=1 http://127.0.0.1/__origin_health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - tieredsb

networks:
  tieredsb:
    driver: bridge
