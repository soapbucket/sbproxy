# Stack for the `feature-flags` example. One container:
#
#   sbproxy - the gateway, mounting ./sb.yml read-only on :8080. The
#             flagged route is served by the proxy itself, so there is
#             no upstream in this stack.
#
# Bring up:    docker compose up -d --wait
# Tear down:   docker compose down -v

services:
  sbproxy:
    build:
      context: ../..
      dockerfile: Dockerfile.cloudbuild
    image: sbproxy-feature-flags:local
    command: ["serve", "-f", "/etc/sbproxy/sb.yml"]
    ports:
      - "8080:8080"
    volumes:
      - ./sb.yml:/etc/sbproxy/sb.yml:ro
    environment:
      - SB_LOG_LEVEL=info
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
