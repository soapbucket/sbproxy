# yaml-language-server: $schema=../../schemas/sb-config.schema.json
# RFC 9457 problem-details default renderer.
#
# Authoring `problem_details:` on an origin tells the proxy to render any
# proxy-generated error on that origin that is not matched by a custom
# `error_pages` entry as `application/problem+json` per RFC 9457. The two
# blocks compose: per-status custom pages still win when authored.
#
# Coverage is the whole class of errors the proxy generates itself:
# authentication denials, policy denials from the `policies:` chain, and
# upstream connection failures. Denials whose body a protocol pins (the
# 429 rate-limit set, the AI-crawl payment family, agent-to-agent chain
# refusals) keep their own shapes, as does the 404 for a Host matching no
# origin, since no origin config is resolved for it.
#
# This origin is protected by API key authentication and carries an
# ip_filter policy, so it can show both halves. `error_pages` matches 401
# explicitly with a hand-authored JSON body; everything else falls through
# to the renderer.
#
# Run:
#   sbproxy serve -f sb.yml
#
# Try:
#   # 401 hits the custom error_pages entry (authored body wins).
#   curl -sv -H 'Host: api.local' http://127.0.0.1:8080/get 2>&1 | grep -E '^< HTTP|^\{'
#
#   # A policy denial has no authored page, so the renderer shapes it.
#   # The API key is present so the request reaches the policy chain;
#   # policies run after authentication.
#   curl -sv -H 'Host: api.local' -H 'X-Api-Key: secret-key' \
#        -H 'X-Forwarded-For: 203.0.113.7' \
#        http://127.0.0.1:8080/get 2>&1 | grep -E '^< HTTP|^< content-type|^\{'

proxy:
  http_bind_port: 8080
  # Needed only so the curl above can present a client IP for ip_filter
  # to judge; without it every request looks like it came from loopback.
  trusted_proxies:
    - 127.0.0.1/32

origins:
  "api.local":
    action:
      type: proxy
      url: https://test.sbproxy.dev

    authentication:
      type: api_key
      header_name: X-Api-Key
      api_keys:
        - secret-key

    policies:
      - type: ip_filter
        blacklist:
          - 203.0.113.0/24

    # Per-status custom page for 401. Wins over the problem-details
    # fallback when the proxy generates a 401.
    error_pages:
      - status: 401
        content_type: application/json
        body: '{"error":"unauthorized","hint":"set X-Api-Key"}'

    # Default RFC 9457 renderer for every other proxy-generated error.
    # `type_base_uri` yields stable `type` URIs of the form
    # `https://api.example.com/errors/<status>`. `include_detail: false`
    # would suppress the internal error string from the `detail` field,
    # which is the setting to reach for when a policy's own message
    # names a matched rule id.
    problem_details:
      enabled: true
      type_base_uri: "https://api.example.com/errors"
      include_detail: true
