# yaml-language-server: $schema=../../schemas/sb-config.schema.json
# WebSocket proxy with an auth gate on the upgrade request.
#
# `type: websocket` proxies `ws://`/`wss://` upstreams. The gateway
# forwards the HTTP Upgrade request through the same auth/policy/
# transform pipeline as any other origin; once the upstream answers
# 101 the connection becomes a byte pipe in both directions, with
# frame headers scanned to enforce max_message_size (payloads are
# never read).
#
# `bearer` auth here shows that a policy applied to the origin runs
# before the upgrade completes: a request without a valid token never
# reaches the WebSocket backend.
#
# No live public WebSocket endpoint ships with this repo, so fixture.py
# stands in for one: a stdlib-only RFC 6455 handshake + echo server.
#
# Run:
#   python3 fixture.py &
#   make run CONFIG=examples/websocket-proxy/sb.yml
#
# Test: see README.md for the full walkthrough (handshake, auth gate,
# the failure mode for a non-upgrade request, and watching the
# enforcement telemetry: the teardown counter on the admin metrics
# endpoint and the policy_denied event in the NDJSON file below).

proxy:
  http_bind_port: 8080

  # Metrics-only admin surface so the teardown counter in the README is
  # readable at http://127.0.0.1:9091/metrics.
  admin:
    enabled: true
    port: 9091
    # username/password default to admin / changeme; override in real configs.

  # Only because the demo upstream runs on loopback: the SSRF guard
  # refuses private/loopback upstream addresses unless allowlisted. A
  # production config pointing at a real WebSocket backend does not
  # need this block.
  extensions:
    upstream:
      allow_private_cidrs:
        - '127.0.0.1/32'

# Every websocket enforcement verdict (the max_message_size teardown
# demonstrated in the README, and subprotocol refusals) writes a
# policy-violation audit record, and that record bridges onto this feed
# as a policy_denied event. This sink writes them one JSON object per
# line, next to wherever the proxy was started.
events:
  sink: file
  path: websocket-proxy-events.ndjson
  types:
    - policy_denied

origins:
  "ws.local":
    action:
      type: websocket
      url: ws://127.0.0.1:8100
      max_message_size: 65536

    authentication:
      type: bearer
      tokens:
        - svc-token-alpha
