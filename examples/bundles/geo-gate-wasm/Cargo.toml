[package]
name = "geo-gate"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "geo_gate"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"   # optimize for binary size
lto = true
codegen-units = 1
strip = true
panic = "abort"
