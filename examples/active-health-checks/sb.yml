# yaml-language-server: $schema=../../schemas/sb-config.schema.json
# Active health checks for load balancer targets.
#
# Each target with a `health_check` block gets a background probe
# loop. Every `interval_secs` (the probe period), the proxy GETs the
# probe URL and tracks consecutive success/failure counts:
#   * `unhealthy_threshold` failures in a row marks the target unhealthy.
#   * `healthy_threshold` successes in a row brings it back.
#
# Unhealthy targets are excluded from `select_target` until they
# recover. Probe results also feed the outlier detector when one is
# configured (so passive and active signals share state).
#
# IPv6 targets work too: `http://[2001:db8::1]:8080`. The probe URL
# builder preserves bracketing.
#
# A target's `url` only ever contributes scheme/host/port to routing;
# any path segment on it (like the `/status/503` below) is cosmetic
# and ignored when forwarding real traffic, so both targets serve
# `GET /get` identically. What differs is each target's own
# `health_check.path`, which the proxy probes on an absolute basis
# (it replaces, not appends to, the target's path). The second
# target's probe path is pinned to `/status/503`, which always
# answers 503, so it fails every probe and is excluded after
# `unhealthy_threshold` (3) consecutive failures, automatically,
# with no manual intervention needed.
#
# Run:
#   make run CONFIG=examples/active-health-checks/sb.yml
#
# Test:
#   curl -H 'Host: localhost' http://127.0.0.1:8080/get
#   # Every response looks identical (both targets resolve to the same
#   # upstream host), so this does not reveal which target answered.
#   # Roughly 20s after startup (tokio's first probe tick fires
#   # immediately, so the 3rd failing probe lands at ~2x interval_secs)
#   # the second target is marked unhealthy and dropped from rotation;
#   # traffic keeps flowing through the first target the whole time.

proxy:
  http_bind_port: 8080

origins:
  "localhost":
    action:
      type: load_balancer
      algorithm: round_robin
      targets:
        - url: https://test.sbproxy.dev
          health_check:
            path: /status/200
            interval_secs: 10        # probe period in seconds
            timeout_ms: 2000
            unhealthy_threshold: 3
            healthy_threshold: 2
        - url: https://test.sbproxy.dev/status/503
          health_check:
            path: /status/503
            interval_secs: 10
            timeout_ms: 2000
            unhealthy_threshold: 3
            healthy_threshold: 2
