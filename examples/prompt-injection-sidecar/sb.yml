# yaml-language-server: $schema=../../schemas/sb-config.schema.json
# prompt_injection_v2 with the out-of-process sidecar detector.
#
# The primary detector runs in a separate process over gRPC. The proxy
# holds one client and sends the prompt to a sidecar that implements the
# shared InferenceService contract. A verified in-process ONNX fallback
# is mandatory: an unavailable, overloaded, or malformed sidecar can
# never silently turn a protected request into an unscored allow.
#
# The same config works against the minimal OSS sidecar
# (`sbproxy-classifier-sidecar`) and the richer OSS sidecar;
# switching between them is a deployment change, not a config change.
#
# Run the OSS sidecar (supply your own ONNX model + tokenizer; OSS does
# not ship weights):
#   cargo run -p sbproxy-classifier-sidecar -- \
#     --listen 127.0.0.1:9440 \
#     --default-model prompt-injection \
#     --model prompt-injection=/models/model.onnx:/models/tokenizer.json
#
# Run the proxy:
#   make run CONFIG=examples/prompt-injection-sidecar/sb.yml
#
# Export the four SBPROXY_PROMPT_INJECTION_FALLBACK_* variables described
# in this example's README before starting the proxy.
#
# See docs/prompt-injection-v2.md for the fallback contract and a
# Kubernetes co-location manifest.

proxy:
  http_bind_port: 8080

origins:
  # tag mode: every request is scored and the upstream sees the verdict
  # headers, but nothing is rejected.
  "tag.local":
    action:
      type: proxy
      url: https://test.sbproxy.dev

    policies:
      - type: prompt_injection_v2
        action: tag
        detector: sidecar
        threshold: 0.5
        # No `enable_body_aware` here: tag stamps headers onto the
        # upstream request, which is already assembled by the time the
        # body is read, so tag + body-aware is refused at config
        # compile on a proxy origin. Tag mode scores the URI + headers;
        # body scanning pairs with block or log (see block.local).
        detector_config:
          # gRPC endpoint of the sidecar.
          endpoint: http://127.0.0.1:9440
          # Model id to request; must match an id the sidecar serves
          # (its --model / --default-model). Empty selects the
          # sidecar's default model.
          model: prompt-injection
          # Label the model emits for an injection verdict. Compared
          # case-insensitively, so "injection" matches "INJECTION".
          injection_label: injection
          # Per-call timeout in milliseconds. Covers the lazy connect
          # on the first request after the sidecar comes online.
          timeout_ms: 250
          # Required verified local fallback for every transport,
          # timeout, RPC, admission, or response-validation failure.
          fallback:
            model_path: "${SBPROXY_PROMPT_INJECTION_FALLBACK_MODEL_PATH}"
            tokenizer_path: "${SBPROXY_PROMPT_INJECTION_FALLBACK_TOKENIZER_PATH}"
            model_sha256: "${SBPROXY_PROMPT_INJECTION_FALLBACK_MODEL_SHA256}"
            tokenizer_sha256: "${SBPROXY_PROMPT_INJECTION_FALLBACK_TOKENIZER_SHA256}"
            labels: [safe, injection]
            injection_label: injection

  # Block mode rejects an injection verdict from either the sidecar or
  # the mandatory verified local fallback.
  "block.local":
    action:
      type: proxy
      url: https://test.sbproxy.dev

    policies:
      - type: prompt_injection_v2
        action: block
        detector: sidecar
        threshold: 0.7
        enable_body_aware: true
        block_body: '{"error":"prompt injection detected"}'
        block_content_type: application/json
        detector_config:
          endpoint: http://127.0.0.1:9440
          model: prompt-injection
          injection_label: injection
          timeout_ms: 250
          fallback:
            model_path: "${SBPROXY_PROMPT_INJECTION_FALLBACK_MODEL_PATH}"
            tokenizer_path: "${SBPROXY_PROMPT_INJECTION_FALLBACK_TOKENIZER_PATH}"
            model_sha256: "${SBPROXY_PROMPT_INJECTION_FALLBACK_MODEL_SHA256}"
            tokenizer_sha256: "${SBPROXY_PROMPT_INJECTION_FALLBACK_TOKENIZER_SHA256}"
            labels: [safe, injection]
            injection_label: injection
