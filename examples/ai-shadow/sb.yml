# yaml-language-server: $schema=../../schemas/sb-config.schema.json
# AI shadow / side-by-side evaluation.
#
# Each request is forwarded to the primary provider as usual. Eligible
# sampled non-streaming chat evaluation requests may also be copied to
# the shadow provider concurrently. Mutating and non-chat AI surfaces
# are never copied. The shadow response is drained and never reaches
# the client; metadata is logged at `target=sbproxy_ai_shadow` so it can
# be filtered into a dedicated stream:
#
#   {provider, status, latency_ms, prompt_tokens, completion_tokens, finish_reason}
#
# Useful for:
#   * Validating a model swap before flipping primary traffic.
#   * Comparing finish_reason / token counts across providers.
#   * Spot-checking guardrail or routing changes without exposing
#     experimental output to users.
#
# `sample_rate: 0.1` mirrors 10% of traffic. Set to 1.0 to mirror
# every request (doubles spend on the shadow leg).
#
# Two targets are configured below, so each sampled request is copied
# to both. One draw is taken per request and both rates are compared
# against it, so the 0.1 target only ever fires on requests the 0.5
# target also fired on: the two are comparable on the narrower one's
# whole population. Each target produces its own usage row, tagged
# `shadow`, joined back to the primary by `shadow_of`, and its own
# `sbproxy_ai_shadow_calls_total{target=...}` series.
#
# Run:
#   export OPENAI_API_KEY=sk-...
#   export ANTHROPIC_API_KEY=sk-ant-...
#   export GEMINI_API_KEY=...
#   make run CONFIG=examples/ai-shadow/sb.yml
#
# Test:
#   curl http://127.0.0.1:8080/v1/chat/completions \
#     -H 'Host: ai.local' \
#     -H 'Content-Type: application/json' \
#     -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"What is 2+2?"}]}'
#
# Then watch the proxy logs for `shadow response` events, one per
# target that fired, and the per-target counters:
#
#   curl -su admin:changeme http://127.0.0.1:9090/metrics \
#     | grep sbproxy_ai_shadow_calls_total
#
#   sbproxy_ai_shadow_calls_total{target="anthropic",status_class="2xx",finish_reason="stop"} 1
#   sbproxy_ai_shadow_calls_total{target="gemini",status_class="2xx",finish_reason="stop"} 4
#
# The usage rows carry the rest of the comparison: `tag: shadow`,
# `provider` naming the target, `shadow_of` joining back to the
# primary, and `finish_reason`, `cost_usd`, and `latency_ms` per
# target. Shadow response *text* is drained rather than retained, so
# what you compare here is numbers, not answers.

proxy:
  http_bind_port: 8080
  # So the per-target shadow counters can be scraped locally. The admin
  # server is off by default and `/metrics` is behind basic auth, so
  # without this block the curl below reaches nothing. Loopback-only.
  admin:
    enabled: true
    port: 9090
    username: admin
    password: ${SBPROXY_ADMIN_PASSWORD:-changeme}

origins:
  "ai.local":
    action:
      type: ai_proxy
      routing:
        strategy: round_robin
      providers:
        - name: openai
          api_key: ${OPENAI_API_KEY}
          default_model: gpt-4o-mini
        - name: anthropic
          api_key: ${ANTHROPIC_API_KEY}
          default_model: claude-haiku-4-5
          # Exclude this provider from primary routing. A disabled provider
          # may still be selected explicitly by the shadow block below.
          enabled: false
        - name: gemini
          api_key: ${GEMINI_API_KEY}
          default_model: gemini-2.5-flash
          enabled: false
      shadow:
        # Shadow evaluation is non-streaming only. Slow or failed shadow
        # calls never delay or reject the primary response. Each target
        # takes its own slot out of the shared 16-task / 64 MiB
        # admission ceiling; a target that cannot get one is dropped as
        # `saturated` and the others still run.
        #
        # No two targets may name the same provider: the provider name
        # is what labels the metric and identifies the ledger row.
        targets:
          - provider: anthropic
            sample_rate: 0.1
            timeout_ms: 30000
            task_timeout_ms: 30000
            # Without this override the shadow leg would forward the
            # primary request's model name (e.g. gpt-4o-mini) to
            # Anthropic unchanged, and Anthropic has no such model, so
            # every shadow call would fail with 404. Set this to a
            # model the shadow provider actually serves.
            model: claude-haiku-4-5
          - provider: gemini
            # A wider rate than the target above. The populations nest:
            # every request the 0.1 target saw, this one saw too.
            sample_rate: 0.5
            timeout_ms: 30000
            task_timeout_ms: 30000
            model: gemini-2.5-flash
