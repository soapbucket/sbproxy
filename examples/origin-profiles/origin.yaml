# Project-owned origin profiles: the project half.
#
# This is what the checkout team commits at sbproxy/origin.yaml in its
# own repository. It is not a config file the proxy loads; the
# aggregator reads it and composes it against the runtime config.
#
# It never names a hostname. There is no field that could hold one.

name: checkout

# What this service needs from whoever deploys it. An unbound input with
# no default is a resolve error naming both the input and the entry, not
# a warning and not literal passthrough.
#
# An input binds as text. Anything credential-bearing belongs in the
# entry's `overrides:` block instead: a profile is a confined document,
# so `${VAR}`, `env:NAME` and `file:/path` are all refused inside it,
# and so is a secret written out in full.
inputs:
  - name: upstream_host
    description: the regional upstream this deployment sends to
  - name: shop_origin
    description: browser origin allowed to call this service
    default: https://shop.example.com

spec:
  api:
    # The layer that applies in every environment.
    base:
      action:
        type: proxy
        url: "https://{{vars.upstream_host}}"
        preserve_query: true
      policies:
        # Merged by name against origin_defaults. The fields this entry
        # does not mention survive from the floor, so `burst` and
        # `type` both come through unchanged.
        - name: rate_limit
          requests_per_minute: 1200
        # A name the floor does not carry is appended after it. Adding a
        # second entry of a *locked* floor entry's type would be refused
        # instead: a lock binds the effect, not the name.
        - name: checkout_request_limit
          type: request_limit
          max_body_size: 1048576
          max_url_length: 2048
      request_modifiers:
        - name: service_headers
          headers:
            set:
              X-Service: checkout
      cors:
        allowed_origins:
          - "{{vars.shop_origin}}"
        allowed_methods: [GET, POST]
    environments:
      # Structural differences only. Selected by the entry's
      # `environment:` field.
      prod:
        action:
          host_override: checkout.internal.example.com
      staging:
        action:
          url: https://checkout-staging.internal.example.com
          preserve_query: false
  webhooks:
    base:
      action:
        type: proxy
        url: https://checkout-hooks.internal.example.com
      policies:
        # An unnamed entry in a project profile is always an addition.
        - type: ip_filter
          whitelist:
            - 203.0.113.0/24
