# yaml-language-server: $schema=../../schemas/sb-config.schema.json
# AI gateway: unified CEL policy plane.
#
# One sandboxed CEL expression decides cross-cutting AI-gateway rules over
# the signals the gateway already computes (guardrail verdicts, budget
# state, routing candidate, principal context) and emits a small closed set
# of typed actions, instead of those rules living in four separate config
# blocks. The expression returns one action token or a list of them.
#
# Recognized actions: allow, block, redact, route_to:<model>,
# compression:<selector>, set_sink_tag:<tag>, audit:<priority>.
#
# Here: route free-tier traffic that asks for the expensive model down to
# the cheap one, select a named stateless compression profile, and tag the
# spend record so it is queryable later.
#
# The `ai.*` namespace exposes:
#   ai.surface, ai.model, ai.provider
#   ai.principal.tenant, ai.principal.api_key_id, ai.principal.tier
#   ai.guardrails.flagged, ai.guardrails.flagged_count, ai.guardrails.labels
#   ai.budget.fraction, ai.budget.exceeded
#   ai.tokens.input_est
#
# `ai.principal.tier` is resolved from the request's attribution tags, and
# attribution is stamped on the governed-credential path: the request must
# authenticate with a declared credential (the virtual key below) for the
# `SB-Attr-Risk-Tier` header to reach the policy. An unkeyed request has an
# empty tier and never matches the "free" branch.
#
# The provider points at a local OpenAI-shaped fixture (fixture.py) that
# echoes the dispatched model back, so both policy branches are observable
# without a provider account.
#
# Run:
#   cd examples/ai-policy-cel
#   docker compose up -d --wait
#
# Test (a free-tier request for gpt-4o is rerouted to gpt-4o-mini):
#   curl -s http://127.0.0.1:8080/v1/chat/completions \
#     -H 'Host: ai.local' -H 'Content-Type: application/json' \
#     -H 'Authorization: Bearer sk-demo-app-key' \
#     -H 'SB-Attr-Risk-Tier: free' \
#     -d '{"model":"gpt-4o","messages":[{"role":"user","content":"Hi"}]}' \
#     | jq -r '.model'
#
# Test (any other tier keeps the requested model):
#   curl -s http://127.0.0.1:8080/v1/chat/completions \
#     -H 'Host: ai.local' -H 'Content-Type: application/json' \
#     -H 'Authorization: Bearer sk-demo-app-key' \
#     -H 'SB-Attr-Risk-Tier: standard' \
#     -d '{"model":"gpt-4o","messages":[{"role":"user","content":"Hi"}]}' \
#     | jq -r '.model'

proxy:
  http_bind_port: 8080

origins:
  "ai.local":
    action:
      type: ai_proxy
      require_governed_key: true
      routing: round_robin

      providers:
        - name: openai
          provider_type: openai
          # The fixture ignores the credential; the field exists because
          # OpenAI-shaped provider configuration carries one. Against the
          # real provider this would be ${OPENAI_API_KEY}.
          api_key: ${FIXTURE_API_KEY:-fixture-local-token}
          base_url: http://127.0.0.1:18080/v1
          allow_private_base_url: true
          default_model: gpt-4o-mini
          models:
            - gpt-4o
            - gpt-4o-mini

      # The route default is off. CEL can select the named stateless profile.
      compression:
        levers: []
        profiles:
          compact:
            levers:
              - type: window_fit
                completion_reserve_tokens: 1024
                input_budget_tokens: 512

      ai_policy:
        expression: |
          ai.principal.tier == "free" && ai.model == "gpt-4o"
            ? ["route_to:gpt-4o-mini", "compression:compact", "set_sink_tag:downgraded-free-tier"]
            : ["allow"]
        # Applied when the expression errors or returns an unknown value.
        # Defaults to allow (fail-open) so a policy bug cannot take the
        # gateway down.
        on_error: allow

    # The governed credential that activates attribution. Requests
    # authenticate with `Authorization: Bearer sk-demo-app-key`; the
    # matched principal is what the `SB-Attr-Risk-Tier` header rides on,
    # which is where `ai.principal.tier` comes from.
    credentials:
      - name: demo-app
        type: ai_provider
        provider: openai
        # Placeholder demo value. Invent your own in production.
        key: sk-demo-app-key
        attrs:
          project: cel-policy-demo
          tags: [ai-policy-cel]
        models:
          allow: [gpt-4o, gpt-4o-mini]
