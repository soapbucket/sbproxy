# cargo-nextest configuration for SBproxy.
#
# `scripts/check.sh` and the required PR lane prefer `cargo nextest run` for
# faster test scheduling. nextest does not run doc tests, so callers that need
# doctest coverage must run `cargo test --doc` separately.

[profile.default]
# Local runs should surface flaky failures instead of hiding them.
retries = 0

[profile.ci]
# CI should report the whole failure set in one run and retry transient flakes
# once. The e2e package is excluded from the required PR lane, but the profile is
# still useful for manual nextest runs.
retries = 1
fail-fast = false

[profile.ci.junit]
path = "junit.xml"

[test-groups.sbproxy-e2e]
# Each e2e test starts its own proxy process and listener. Keep those serialized
# when a developer runs the full workspace through nextest.
max-threads = 1

# The override has to be repeated per profile. nextest resolves scalar settings
# like `retries` by falling back to `default`, but `overrides` is a per-profile
# array and does not merge, so a profile that omits this runs the e2e package at
# full parallelism no matter what `default` says.
#
# That is not hypothetical. `scripts/check.sh` runs the test lane with
# `--profile ci`, and the required PR lane excludes `sbproxy-e2e`, so the only
# way to reach e2e through the gate is `SBPROXY_CHECK_E2E=1`, which nobody had
# paired with `--profile ci` until WOR-2203. The first run that did launched
# roughly 790 proxy processes concurrently against a config comment promising
# they were serialized.
[[profile.default.overrides]]
filter = 'package(sbproxy-e2e)'
test-group = 'sbproxy-e2e'

[[profile.ci.overrides]]
filter = 'package(sbproxy-e2e)'
test-group = 'sbproxy-e2e'
