[package]
name = "sbproxy-middleware"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[dependencies]
sbproxy-plugin.workspace = true
sbproxy-config.workspace = true
sbproxy-security.workspace = true
sbproxy-cache.workspace = true
sbproxy-observe.workspace = true
# Idempotency middleware: KVStore trait used as the OSS-friendly
# backend abstraction so the middleware doesn't pull a redis client of
# its own. Redis-backed deployments wire RedisKVStore from the platform
# crate; in-memory tests use the bundled InMemoryIdempotencyCache.
sbproxy-platform.workspace = true
# WOR-2301: the central secret resolver, so `message_signatures.key`
# resolves an `env:NAME`, `file:PATH`, `${VAR}`, or provider-URI
# reference through the same path every other secret-bearing config
# field uses, instead of the reference text becoming the HMAC shared
# secret or the Ed25519 public key.
sbproxy-vault.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
ureq = "2"

# RFC 9421 signature verification crypto
hmac = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = "2"
# ECDSA P-256 verification for the RFC 9421 `ecdsa-p256-sha256`
# algorithm. `ring` is already the workspace's crypto provider (rustls
# installs `ring`, and sbproxy-tls / sbproxy-vault / sbproxy-modules all
# depend on it), so this adds an edge rather than a crate: no new code
# enters the dependency graph and NOTICE already carries the attribution.
ring = { workspace = true }
hex = { workspace = true }
bytes = { workspace = true }
# Constant-time equality for digest / signature comparison.
subtle = { workspace = true }

# Response compression backends
flate2 = "1"
brotli = "3"
zstd = "0.13"

# Rate-limit middleware (WOR-66): parking_lot for the bucket mutex (we
# avoid std::sync::Mutex's poisoning semantics on the request-hot path),
# lru for the bounded per-key bucket cache.
parking_lot = { workspace = true }
lru = "0.18"

[dev-dependencies]
tempfile = "3"
serde_yaml = { workspace = true }
rand = { workspace = true }
# WOR-2301: reset_process_resolver_for_test, so the message-signature
# key-resolution tests in signatures.rs are not order-dependent on
# cargo test's single-process fallback run (see sbproxy-core/Cargo.toml
# for the same pattern).
sbproxy-vault = { path = "../sbproxy-vault", features = ["test-support"] }
