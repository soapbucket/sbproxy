[package]
name = "sbproxy-platform"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[features]
default = ["redb-store", "sqlite-store"]
redb-store = ["dep:redb"]
sqlite-store = ["dep:rusqlite"]

[dependencies]
sbproxy-plugin.workspace = true
# `secure_fs` puts the 0o600 in the open(2) call that creates an embedded
# store file, rather than chmod-ing after redb's own umask-dependent
# `File::create`. See storage::embedded::EmbeddedKvStore::open.
sbproxy-util.workspace = true
anyhow.workspace = true
bytes.workspace = true
hex.workspace = true
dashmap.workspace = true
parking_lot.workspace = true

# Async runtime bridge. `rt` supports spawn_blocking for sync backends;
# `macros`+`net` are required by the async Redis client (AsyncRedisKVStore).
tokio = { workspace = true, features = ["rt", "macros", "sync", "net"] }
# Redis client for validated connection config and AsyncRedisKVStore, including
# rustls for `rediss://`.
redis = { workspace = true, features = ["connection-manager", "tokio-rustls-comp"] }
async-trait = { workspace = true }
prometheus = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

# Optional storage backends
redb = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }

[dev-dependencies]
rcgen = { workspace = true }
tempfile = "3"
# `time` is only needed by the embedded ephemeral-store tests, which sleep
# past a TTL to prove an expired entry reads as absent.
tokio = { workspace = true, features = ["rt", "macros", "sync", "net", "time"] }
