[package]
name = "sbproxy-meter"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[features]
default = []

# One workspace crate appears here and only one may: sbproxy-util, the
# std-only leaf. It carries no dependencies of its own, so it cannot
# reintroduce the coupling this list exists to prevent. Everything else is
# still barred: this crate must stay compilable by an operator who meters a
# plain REST API and has no interest in the AI stack, so it depends on none of
# sbproxy-core, sbproxy-modules, sbproxy-ai, or sbproxy-config. The
# third-party entries below are what the hash chain in `ledger` costs:
# hashing, hex, Ed25519, a timestamp, a mutex, JSON, an error type, and a log
# line.
[dependencies]
# WOR-2626: owner-only creation of the signed ledger file. Inlining the
# helper here instead is how the workspace ended up with four duration
# parsers.
sbproxy-util.workspace = true

serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
# WOR-1540: Ed25519-signed ledger entries. Same major as the RFC 9421
# verifier in sbproxy-middleware, declared the way every other crate in this
# workspace declares it.
ed25519-dalek = "2"
chrono.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
tracing.workspace = true
