  # --- Wave 5 / G5.4: headless-browser detection ---
  #
  # These entries are emitted by the headless detector
  # (`sbproxy-security/headless_detect.rs`) when a request's TLS
  # fingerprint matches a published headless-library JA3/JA4. Their
  # `expected_user_agent_pattern` is intentionally a sentinel that
  # never matches a real header so the UA-matching path does not also
  # claim them; the resolver entry-point is the TLS fingerprint
  # signal, not the User-Agent string. It carries `(?i)` like every
  # other pattern here, not because case could matter to a string that
  # matches nothing, but because a pattern compiled verbatim without
  # that flag is warned about at load and a sentinel is not the thing
  # an operator should be reading that warning for.

  - id: headless-browser
    vendor: Unknown
    purpose: unknown
    contact_url: https://sbproxy.dev/docs/configuration
    expected_user_agent_pattern: "(?i)^__sbproxy_never_matches__$"
    expected_reverse_dns_suffixes: []
    expected_keyids: []
    robots_compliance_score: 0.10
    aliases: []
    deprecated: false

  - id: headless-puppeteer
    vendor: Puppeteer
    purpose: unknown
    contact_url: https://pptr.dev/
    expected_user_agent_pattern: "(?i)^__sbproxy_never_matches__$"
    expected_reverse_dns_suffixes: []
    expected_keyids: []
    robots_compliance_score: 0.10
    aliases: []
    deprecated: false

  - id: headless-playwright
    vendor: Playwright
    purpose: unknown
    contact_url: https://playwright.dev/
    expected_user_agent_pattern: "(?i)^__sbproxy_never_matches__$"
    expected_reverse_dns_suffixes: []
    expected_keyids: []
    robots_compliance_score: 0.10
    aliases: []
    deprecated: false

  # --- Coding agents (WOR-2707) ---
  #
  # User-Agent classification only. These are not verified crawlers:
  # reverse_dns_suffixes and keyids stay empty. Patterns mirror the
  # ADRF baseline so `agent_budget` can key on the same agents that
  # walkthrough documents (Cursor/0.42.0 and the CLI prefixes).
  # Each pattern carries `(?i)` because the loader warns on a
  # case-sensitive shipped entry.

