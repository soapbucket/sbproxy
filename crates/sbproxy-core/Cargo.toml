[package]
name = "sbproxy-core"
# Tracks the real product/release version (the `sbproxy` binary's
# `--version` also inherits it), not an independent library version:
# `env!("CARGO_PKG_VERSION")` calls inside this crate feed the admin
# `/health` endpoint (and the dashboard's VERSION tile), so a stale
# pinned version here silently misreports the running release.
version.workspace = true
edition = "2021"
license.workspace = true
publish = false

# --- AI Governance feature flags ---
#
# Library consumers opt in; the `sbproxy` binary turns these on via its own
# `default` feature set.
#
# Flags:
# - agent-class : `agent_class` resolver on `RequestContext`. The
# resolver combines UA match, reverse-DNS verification, and bot-auth
# keyid; the resolved value is exposed to CEL, Lua, JS, and WASM.
[features]
default = []
# WOR-1680/1652: real NVIDIA GPU discovery for the local model host.
# Off by default (the lean binary needs no GPU libraries); on a GPU
# host the `sbproxy` binary forwards this in. Without it the model-host
# runtime uses a zero-GPU probe, so serve: providers reject admission
# cleanly rather than pretending to serve on a CPU box.
gpu-nvidia = ["sbproxy-model-host/gpu-nvidia"]
# WOR-1800: Apple Silicon (Metal) unified-memory discovery for the model
# host. The `sbproxy` binary forwards this in by default; it only affects
# macOS builds (the probe module is `target_os = "macos"`-gated) and is
# harmless elsewhere.
gpu-apple = ["sbproxy-model-host/gpu-apple"]
# Hugging Face weight download for the model host. Same gating.
model-weights = ["sbproxy-model-host/weights"]
# Pulls the resolver in `sbproxy-modules::policy::agent_class` and the
# reverse-DNS verifier in `sbproxy-security::agent_verify` into the
# request pipeline. Off by default for library consumers; the
# `sbproxy` binary turns it on via its own default feature set.
agent-class = [
    "dep:sbproxy-classifiers",
    "sbproxy-modules/agent-class",
    "sbproxy-security/agent-class",
]
# Forwards through to `sbproxy-tls/tls-fingerprint`,
# enabling JA3 / JA4 / JA4H capture in the request pipeline. The
# `tls_fingerprint` and `headless_signal` fields on `RequestContext`
# are present unconditionally (so types resolve either way) but stay
# `None` when the feature is off.
tls-fingerprint = [
    "sbproxy-tls/tls-fingerprint",
    "sbproxy-security/tls-fingerprint",
    "dep:sbproxy-classifiers",
]
# WOR-227 (scaffold). When on, the admin server compiles in
# `include_dir!("../../ui/dist")` and serves the embedded asset
# tree at `/admin/ui/*`. Off by default so the standard build does
# not depend on a prior `pnpm build` and binary size stays slim.
# Real views land in follow-up tickets; this feature only wires
# the scaffold mount.
embed-admin-ui = ["dep:include_dir"]
# WOR-1235: run the semantic-cache embedding model in-process (tract) for a
# single-binary deploy. Pulls in the ONNX engine. The `sbproxy` binary turns
# this on by default; library consumers leave it off (the `source: inprocess`
# config then returns a clear error and the cache treats it as a miss).
inprocess-embed = ["dep:sbproxy-classifiers"]
# In-process MiniLM classifier backing the `type: classifier` AI
# guardrail. Shares the ONNX runtime already pulled in by
# `inprocess-embed`, so enabling it adds no new dependency.
inprocess-classify = ["dep:sbproxy-classifiers"]
# WOR-2098: route-scoped RAG retrieval. `rag` pulls in the runtime crate
# and the per-pipeline registry in `rag_runtime`; the `rag-*` features
# select individual embedding and vector-store adapters, and `rag-full`
# turns on every documented provider (the `sbproxy` binary's default).
# Off by default so library consumers keep RAG out of their graph.
rag = ["dep:sbproxy-rag"]
rag-embedding-openai = ["rag", "sbproxy-rag/embedding-openai"]
rag-embedding-compatible = ["rag", "sbproxy-rag/embedding-compatible"]
rag-embedding-cohere = ["rag", "sbproxy-rag/embedding-cohere"]
rag-embedding-bedrock = ["rag", "sbproxy-rag/embedding-bedrock"]
rag-embedding-vertex = ["rag", "sbproxy-rag/embedding-vertex"]
rag-vector-chroma = ["rag", "sbproxy-rag/vector-chroma"]
rag-vector-pinecone = ["rag", "sbproxy-rag/vector-pinecone"]
rag-vector-qdrant = ["rag", "sbproxy-rag/vector-qdrant"]
rag-vector-redis = ["rag", "sbproxy-rag/vector-redis"]
rag-vector-weaviate = ["rag", "sbproxy-rag/vector-weaviate"]
# WOR-2100: authoritative payment settlement. `payments` pulls in the
# billing crate's durable store, dispatch gate, authoritative service, and
# recovery-only worker, and compiles `billing_runtime`. Each rail feature
# adds exactly one adapter and implies `payments`.
#
# No payment feature joins any default set. A build that does not ask for
# settlement carries no SQLite settlement store, no provider adapters, and
# no recovery worker, and `proxy.payments` in a configuration document
# still parses so `sbproxy validate` reads the same file on every build.
# The runtime assembly is where a configured-but-not-compiled rail becomes
# a startup failure naming the missing feature.
payments = ["dep:sbproxy-billing", "sbproxy-billing/runtime", "sbproxy-modules/payments"]
payment-mpp = ["payments", "sbproxy-billing/mpp", "sbproxy-modules/payment-mpp"]
payment-stripe = ["payments", "sbproxy-billing/stripe"]
payment-x402 = ["payments", "sbproxy-billing/x402"]
payment-lightning-cln = ["payments", "sbproxy-billing/lightning-cln"]
payment-lightning-lnd = ["payments", "sbproxy-billing/lightning-lnd"]
rag-full = [
  "rag-embedding-openai",
  "rag-embedding-compatible",
  "rag-embedding-cohere",
  "rag-embedding-bedrock",
  "rag-embedding-vertex",
  "rag-vector-chroma",
  "rag-vector-pinecone",
  "rag-vector-qdrant",
  "rag-vector-redis",
  "rag-vector-weaviate",
]

[dependencies]
sbproxy-plugin.workspace = true
sbproxy-util.workspace = true
# `request_error_summary`: every outbound webhook, mirror, and OIDC
# call in this crate logs a reqwest failure, and that error's Display
# ends with " for url ({url})" (WOR-2629).
sbproxy-httpkit.workspace = true
sbproxy-config.workspace = true
sbproxy-federation.workspace = true
# WOR-2673: the IAB CoMP marketplace bridge served on
# `/.well-known/iab-comp/*` for origins that configure `comp:`.
# Leaf crate: it depends on sbproxy-storage and nothing else in the
# workspace, so this edge does not widen the request path's graph.
sbproxy-licensing.workspace = true
sbproxy-tls.workspace = true
sbproxy-modules.workspace = true
sbproxy-mcp-gateway.workspace = true
# WOR-1717: optional TLS on the hand-rolled admin listener.
rustls = { workspace = true }
tokio-rustls = { workspace = true }
# WOR-819: REST <-> gRPC transcoding is driven from the request pipeline
# (proxy_http.rs) using the descriptor-backed Transcoder; the compiled
# transcoder lives on the `grpc` action in sbproxy-modules but its methods
# are called here.
sbproxy-transport.workspace = true
sbproxy-middleware.workspace = true
sbproxy-observe.workspace = true
sbproxy-extension.workspace = true
sbproxy-ai.workspace = true
# WOR-2127: the metering vocabulary the `proxy.attestation` block lowers
# into. The conversion lives here rather than in sbproxy-meter, which
# depends on no workspace crate so an operator metering a plain REST API
# can compile it without the gateway; deriving JsonSchema on its types
# would end that. Acyclic: the edge only runs this way.
sbproxy-meter.workspace = true
# WOR-2098: route-scoped RAG runtime construction, pulled in only by the
# `rag` feature. The workspace entry ships `default-features = false`, so
# provider adapters activate solely through the `rag-*` forwards above.
sbproxy-rag = { workspace = true, optional = true }
# WOR-2100: authoritative payment settlement, pulled in only by the
# `payments` feature. The workspace entry ships `default-features = false`,
# so the durable store, the service, the recovery worker, and every rail
# adapter activate solely through the forwards above. The billing crate
# depends on none of the crates in this graph, which is what keeps the
# dependency acyclic while core owns the runtime assembly.
sbproxy-billing = { workspace = true, optional = true }
# WOR-1680: own the local model-host runtime (spawn/supervise engines
# for serve: providers) as a process-global built at dispatch time.
sbproxy-model-host.workspace = true
sbproxy-cache.workspace = true
# WOR-2673: builds the object-storage cache-reserve client from config.
# Already in this crate's dependency graph through sbproxy-modules' storage
# action, so naming it here adds no new external crate.
object_store = { workspace = true }
sbproxy-platform.workspace = true
# Agent identity: the signed catalog subscriber and the owner-approval
# queue. The admin listener owns the routes; that crate owns what they mean.
sbproxy-agent-registry.workspace = true
sbproxy-openapi.workspace = true
sbproxy-security.workspace = true
# Process secret resolver, used to turn a response-cache encryption key
# reference into key material at boot. Already in the graph through
# sbproxy-modules; this makes the use direct.
sbproxy-vault.workspace = true
# WOR-1546: the dynamic key plane (mutable store, policy cache, at-rest crypto).
# Redis backend/tier + cross-replica invalidation enabled here so the assembly
# in `key_plane.rs` can build either backend from config.
sbproxy-keystore = { workspace = true, features = ["embedded", "redis-backend", "secrets-manager"] }
# WOR-1562/1563: the mesh distributed-cache tier + CRDT spend/rate counters for
# the key plane (consistent-hash ring, gossip replication, G-Counter, sliding
# window). Pulls sbproxy-mesh transitively.
sbproxy-mesh = { workspace = true }
# Agent-detect engine (WOR-499). The pipeline runs the scorer per request
# when enabled and stashes the AgentDetection on the request context for the
# scripting bridges and the trust_tier combiner. Non-optional: behaviour is
# gated by a default-off config flag, not a cargo feature, so server.rs stays
# free of #[cfg] noise on the hot path.
sbproxy-agent-detect.workspace = true
# Optional: only pulled in when the `agent-class` feature is on. The
# request context references `sbproxy_classifiers::AgentId` etc., and
# the scripting bridges read those types to expose `request.agent_id`.
sbproxy-classifiers = { workspace = true, optional = true }
# WOR-2672 follow-up: `classifier_hooks` builds an `IntentDetectionHook`
# on `FallbackClassifier` (WOR-2665's optional-degrade sidecar client).
# Acyclic: `sbproxy-classifier-client` depends only on
# `sbproxy-classifier-proto`, not on this crate or `sbproxy-ai`, and
# `sbproxy-ai` already pulls it in unconditionally, so this is not a new
# edge in the build graph, only a direct one.
sbproxy-classifier-client.workspace = true

# Pingora
pingora-core.workspace = true
pingora-proxy.workspace = true
pingora-http.workspace = true
pingora-error.workspace = true
pingora-runtime.workspace = true

# Bloom filter for hostname pre-check
bloomfilter.workspace = true

# CIDR matching for trusted_proxies / X-Forwarded-For trust boundary
ipnetwork.workspace = true

# Enterprise hook registration (link-time plugin pattern)
inventory.workspace = true

# Concurrency and data structures
arc-swap.workspace = true
# parking_lot: no-poison mutexes on the request-path budget/mesh
# counters so a panic while held cannot cascade (WOR-1691).
parking_lot.workspace = true
# lru: the anomaly detector's per-day distinct-value sets are keyed on
# client-controlled strings, so they need bounded memory and O(1)
# eviction rather than a map that grows with whatever arrives.
lru.workspace = true
compact_str.workspace = true
smallvec.workspace = true
bytes.workspace = true

# URL parsing
url.workspace = true

# HTTP types (HeaderMap for auth checks)
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true

# Async
async-trait.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }

# Hot reload
notify.workspace = true

# Observability
tracing.workspace = true
prometheus.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Serialization (for action_config access)
serde_json.workspace = true
serde.workspace = true
# TlsFingerprintConfig parses
# proxy.extensions.tls_fingerprint from the operator YAML.
serde_yaml.workspace = true
redb.workspace = true

# Regex for forward-rule path constraints and whole-path matchers
regex.workspace = true

# HTTP client (for AI proxy forwarding)
reqwest.workspace = true
futures.workspace = true
# WOR-892 PR2: ID-token signature verification on /oidc/callback.
jsonwebtoken.workspace = true

# UUID generation (for session cookies)
uuid.workspace = true
# ULID parsing for session_id / parent_session_id
ulid.workspace = true

# Identity / hashing for webhook envelope (instance_id tag, config_revision)
rand.workspace = true
sha2.workspace = true
# Scrubs resolved prompt-persistence key material on drop, the same way the
# response-cache key material is handled.
zeroize.workspace = true
hmac.workspace = true
hex.workspace = true
# Constant-time equality for admin Basic Auth, session MAC, and CSRF
# token comparison.
subtle.workspace = true
chrono.workspace = true

# WOR-227 scaffold. Optional; only pulled in by the `embed-admin-ui`
# feature. The macro embeds `ui/dist/` at compile time so the
# binary serves the admin SPA without a separate static-asset
# deployment.
include_dir = { workspace = true, optional = true }

argon2.workspace = true
base64.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
sbproxy-classifier-proto = { path = "../sbproxy-classifier-proto" }
tonic.workspace = true
tokio-stream = { version = "0.1", features = ["net"] }
tracing-subscriber.workspace = true
rcgen.workspace = true
tempfile = "3"
loom = "0.7"
# Thread-local allocation counts pin the bounded chargeback exporters without
# installing a workspace-global allocator or adding unsafe test code.
allocation-counter = "0.8.1"
# WOR-2298: reset_process_resolver_for_test, so the WOR-2285 secret-resolver
# delegation tests in key_plane.rs and cluster.rs are not order-dependent on
# cargo test's single-process fallback run.
sbproxy-vault = { path = "../sbproxy-vault", features = ["test-support"] }
