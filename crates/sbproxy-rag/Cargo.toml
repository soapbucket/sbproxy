# WOR-2098: retrieval-augmented generation runtime. The default build
# compiles only the bounded domain core (query extraction, chunk
# selection, template rendering, orchestration, stale-context cache).
# Every provider adapter sits behind a cargo feature so a binary carries
# exactly the embedding and vector-store integrations it opted into.

[package]
name = "sbproxy-rag"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[features]
default = []
embedding-openai = []
embedding-compatible = ["embedding-openai"]
embedding-cohere = []
embedding-bedrock = []
embedding-vertex = []
vector-chroma = []
vector-pinecone = []
vector-qdrant = []
vector-redis = ["dep:redis", "dep:rustls"]
vector-weaviate = []
full = [
  "embedding-openai",
  "embedding-compatible",
  "embedding-cohere",
  "embedding-bedrock",
  "embedding-vertex",
  "vector-chroma",
  "vector-pinecone",
  "vector-qdrant",
  "vector-redis",
  "vector-weaviate",
]

[dependencies]
sbproxy-ai.workspace = true
sbproxy-httpkit.workspace = true
sbproxy-security.workspace = true

async-trait.workspace = true
bytes.workspace = true
lru.workspace = true
minijinja.workspace = true
parking_lot.workspace = true
percent-encoding.workspace = true
# The rustls comparator is required for safe rediss:// support; the
# workspace redis dependency ships tokio-comp + streams only.
redis = { workspace = true, optional = true, features = ["tokio-rustls-comp"] }
# Direct rustls dependency so the rediss:// path can install the ring
# CryptoProvider itself; a workspace build that unifies both provider
# features would otherwise panic at the first TLS handshake in a process
# that never selected one.
rustls = { workspace = true, optional = true }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
tokio.workspace = true
