[package]
name = "sbproxy-config"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[dependencies]
sbproxy-capability.workspace = true
sbproxy-plugin.workspace = true
sbproxy-platform.workspace = true
sbproxy-observe.workspace = true
# WOR-2476: the top-level `egress:` section compiles straight to the GF
# egress authorizer, the same runtime type `l2_store` already builds a
# concrete `Arc<dyn KVStore>` for above. sbproxy-security is a leaf (no
# sbproxy-* dependencies of its own), so this adds no cycle.
sbproxy-security.workspace = true

serde = { workspace = true }
# `preserve_order` explicit here (WOR-2585 fix), not left to arrive
# incidentally: `config_json_schema()` embeds a `serde_json::to_value`
# of each config type's default instance, and cedar-policy-core (a
# sbproxy-extension dependency, not this crate's) forces the same
# feature on for any build that also compiles sbproxy-extension. A
# `cargo build --workspace` and a scoped `cargo run -p sbproxy-config
# --bin generate-schema` therefore disagreed on default-value key
# order (declaration order vs `BTreeMap`-sorted) depending on which
# packages happened to share the build, and `schema_is_committed_
# verbatim` caught the mismatch. Declaring it here keeps both
# invocations, and the schema this crate serves over the admin API,
# identical regardless of what else the graph happens to pull in.
serde_json = { workspace = true, features = ["preserve_order"] }
serde_yaml = { workspace = true }
# WOR-1140: collect unknown/misspelled config keys at parse time so a
# typo in a (often protection-disabling) key fails boot instead of being
# silently dropped.
serde_ignored = "0.1"
anyhow = { workspace = true }
http = { workspace = true }
compact_str = { workspace = true }
smallvec = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tempfile = "3"
# WOR-1081: JSON Schema generation from the Rust config types so
# editor tooling (vscode-yaml, IntelliJ) validates `sb.yml`
# against the runtime-truth types instead of a hand-rolled file.
schemars = { workspace = true }
# Signed config bundles (see `config_bundle`). Ed25519 is the default
# algorithm; HMAC-SHA256 exists only for single-operator setups and refuses
# to verify without an explicit acknowledgement. The digest and the signature
# are compared with `subtle` rather than a hand-rolled constant-time helper,
# and the signing input is the RFC 8785 canonical JSON that
# `serde_json_canonicalizer` produces, so a signature survives any
# re-serialization that preserves the parsed values.
sha2 = { workspace = true }
hmac = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
serde_json_canonicalizer = { workspace = true }
subtle = { workspace = true }
ed25519-dalek = "2"
# WOR-2456: content-addressed blob compression for the revision ring
# (`revision_store`). Version pinned to match the crate already resolved
# in the workspace lockfile via sbproxy-middleware's compression path, so
# this adds no new dependency to the graph.
zstd = "0.13"
# WOR-2456: lineage identifiers for the revision ring. Already a
# workspace dependency (used for request-id generation elsewhere); this
# just extends its use to this crate.
uuid = { workspace = true }
# WOR-2565: parse `deprecation:` block instants (RFC 3339 / YYYY-MM-DD)
# and format the RFC 8594 `Sunset` HTTP-date at config compile. Already
# a workspace dependency; dual MIT/Apache-2.0, so NOTICE is unaffected.
chrono = { workspace = true }
# WOR-2679: in-process git fetch when the `git` binary is missing
# (distroless has none). Dual MIT OR Apache-2.0, so NOTICE is unaffected.
# 0.84 is the newest line whose graph resolves on crates.io and that
# carries gix-date >= 0.12 (RUSTSEC-2025-0140). `sha1` is required once
# default-features are off; `blocking-http-transport-reqwest-rust-tls`
# is the file:// / git:// / ssh:// client plus HTTPS via rustls;
# `worktree-mutation` is the checkout after fetch; `max-performance-safe`
# and `revision` decode packs and peel a pinned sha without zlib-ng.
gix = { version = "0.84", default-features = false, features = [
    "blocking-http-transport-reqwest-rust-tls",
    "worktree-mutation",
    "max-performance-safe",
    "revision",
    "sha1",
] }

[dev-dependencies]
rcgen = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Killing a hung `git` has to reach the whole process group, not just the
# direct child: git shells out, and reaping only the child orphans its
# grandchildren with the scratch files still open.
#
# rustix rather than libc because this crate is `#![forbid(unsafe_code)]`,
# which an `#[allow]` cannot override. rustix wraps the same syscall
# safely, is already in the lockfile, and is Apache-2.0 WITH
# LLVM-exception OR Apache-2.0 OR MIT, so NOTICE is unaffected.
rustix = { version = "0.38", features = ["process"] }
