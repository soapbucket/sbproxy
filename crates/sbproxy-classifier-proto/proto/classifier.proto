syntax = "proto3";

// Shared inference contract for the sbproxy classifier sidecar (WOR-704).
//
// This proto is the ONLY artifact shared between the OSS minimal sidecar and
// the enterprise rich sidecar: both implement `InferenceService`, so the
// proxy speaks to whichever is deployed through one client. It is
// deliberately self-contained (no imports) and minimal -- the enterprise
// sidecar adds its own RPCs (Judge, admin, license-leak) as a superset.
// proto3 keeps field/RPC additions backward compatible.
package sbproxy.classifier.v1;

// Inference RPCs the proxy calls on the hot path, plus capability probes.
service InferenceService {
  // Classify text into scored labels (prompt-injection, agent-class, ...).
  rpc Classify (ClassifyRequest) returns (ClassifyResponse);
  // Produce embedding vectors for one or more texts.
  rpc Embed (EmbedRequest) returns (EmbedResponse);
  // Extractively prune text with a token-classification model.
  rpc Compress (CompressRequest) returns (CompressResponse);
  // Describe a loaded model (used for capability negotiation at startup).
  rpc ModelInfo (ModelInfoRequest) returns (ModelInfoResponse);
  // Report sidecar version + the set of model ids it can serve.
  rpc Version (VersionRequest) returns (VersionResponse);
}

message ClassifyRequest {
  // Logical model id to route to (e.g. "prompt-injection-v2",
  // "agent-class"). Empty selects the sidecar's default classifier.
  string model = 1;
  // Text to classify.
  string text = 2;
  // Return at most this many labels (0 = all).
  uint32 top_k = 3;
}

message ClassifyResponse {
  // Scored labels, highest score first.
  repeated Label labels = 1;
  // Inference latency in microseconds, for the proxy's metrics.
  uint64 latency_us = 2;
}

message Label {
  string name = 1;
  double score = 2;
}

message EmbedRequest {
  // Logical embedding-model id. Empty selects the default.
  string model = 1;
  // Texts to embed.
  repeated string texts = 2;
}

message EmbedResponse {
  // One embedding per input text, in request order.
  repeated Embedding embeddings = 1;
  uint64 latency_us = 2;
}

message Embedding {
  repeated float values = 1;
}

message CompressRequest {
  // Logical token-classification model id. Empty selects the default.
  string model = 1;
  // Text to prune. Callers retain any surrounding structured markup.
  string text = 2;
  // Exactly one target is required. Servers reject an unset target.
  oneof target {
    // Fraction of source tokens to retain, greater than 0 and at most 1.
    double retain_ratio = 3;
    // Absolute number of source tokens to retain, greater than 0.
    uint32 target_tokens = 4;
  }
}

message CompressResponse {
  // Extractive result assembled from spans of the request text.
  string text = 1;
  // Source token count according to the compression model tokenizer.
  uint32 original_tokens = 2;
  // Result token count according to the compression model tokenizer.
  uint32 compressed_tokens = 3;
  // Inference latency in microseconds, for the proxy's metrics.
  uint64 latency_us = 4;
}

message ModelInfoRequest {
  // Model id to describe. Empty describes the default classifier.
  string model = 1;
}

message ModelInfoResponse {
  // Resolved model id.
  string model = 1;
  // Whether the sidecar has this model loaded and ready to serve.
  bool loaded = 2;
  // Output label names, when the model exposes a fixed label set.
  repeated string labels = 3;
  // Embedding dimensionality, for embedding models (0 otherwise).
  uint32 embedding_dim = 4;
}

message VersionRequest {}

message VersionResponse {
  // Sidecar build version, e.g. "sbproxy-classifier 0.1.0".
  string version = 1;
  // Logical model ids this sidecar can serve.
  repeated string models = 2;
}

// The enterprise-superset RPCs (WOR-2665). `InferenceService` above is the
// contract both the minimal OSS sidecar and the rich sidecar implement;
// `ClassifierService` is additional surface only the rich sidecar
// (`sbproxy-classifier`) serves. Kept in the same proto file (rather than a
// second crate) so one generated client crate can carry both stubs, per the
// comment on `InferenceService`: one client reaches whichever sidecar is
// deployed. A caller talking only to the minimal sidecar never constructs a
// `ClassifierServiceClient`, so this costs nothing when unused.
//
// `Classify`-shaped multi-tenant work (heuristic pattern classification,
// intent detection, content-type detection) and tenant administration
// (register/delete/list) are server today over the TCP + MessagePack
// transport on port 9400 only; see `docs/classifier-sidecar.md` for why
// that surface, rather than this one, carries them for the initial port.
service ClassifierService {
  // Heuristic quality score for an AI-generated response: refusal-phrase
  // detection, length, repetition, formatting, and casing signals combined
  // into one score plus the per-signal breakdown.
  rpc Quality (QualityRequest) returns (QualityResponse);
  // Per-token streaming safety check. The caller streams one message per
  // token (or per small chunk) as it arrives from the upstream provider;
  // the server streams back one verdict per input message, so a caller can
  // cut a response short the moment a rule matches instead of waiting for
  // the full body. `rules` is read from the first message in the stream and
  // ignored on subsequent ones, so a caller sets it once per stream.
  rpc StreamSafety (stream SafetyToken) returns (stream SafetyVerdict);
}

message QualityRequest {
  // Tenant id, for future per-tenant weighting. Unused by the heuristic
  // scorer today; carried so a client does not need a breaking change when
  // per-tenant weights ship.
  string tenant = 1;
  // AI-generated text to score.
  string text = 2;
}

message QualityResponse {
  // Overall score, 0.0 (poor) to 1.0 (excellent).
  double score = 1;
  // Per-signal scores: "length", "coherence", "repetition", "formatting",
  // "error_patterns", "casing".
  map<string, double> signals = 2;
}

message SafetyToken {
  // Tenant id. Read from the first message; ignored afterward.
  string tenant = 1;
  // Case-insensitive substrings that block the stream when matched against
  // the tokens accumulated so far. Read from the first message; ignored
  // afterward, so a caller sends the rule set once per stream.
  repeated string rules = 2;
  // The next token (or chunk) of the streaming response.
  string token = 3;
}

message SafetyVerdict {
  // False once any rule has matched; stays false for the rest of the
  // stream, since the caller is expected to stop forwarding output at that
  // point.
  bool safe = 1;
  // True on the message where a rule first matched.
  bool blocked = 2;
  // Which rule matched, empty when `blocked` is false.
  string reason = 3;
}
