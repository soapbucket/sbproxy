[package]
name = "sbproxy-plugin"
# 0.1 -> 0.2: breaking change to the plugin trait API (WOR-620) -- trait
# methods now return PluginError instead of anyhow::Error. 0.x breaking
# changes bump the minor per semver.
#
# 0.2 -> 0.3: breaking change to ActionOutcome (WOR-2276). The enum gained
# the data-bearing `Response` variant that the bundle action contract
# returns, which drops its `Copy` impl and makes any exhaustive match on
# the 0.2 variants non-exhaustive. See `ActionOutcome`'s rustdoc for the
# migration.
#
# 0.3 -> 0.4: removal of the `RequestEnricher` trait, the
# `PluginKind::Enricher` variant, and the `ExtensionHookKind::Enricher`
# variant. The trait shipped in the first commit and was never
# implemented, never dispatched, and reachable from no config key; its
# only output channel was a `&mut dyn Any` whose concrete type lives in
# an internal crate, so no out-of-tree implementor could write anything
# through it. Enrichment that runs early and annotates the request
# context is `IdentityResolverHook` (plus `MlClassifierHook` and
# `AnomalyDetectorHook`), which are dispatched and take a typed
# `RequestContextView` rather than a type-erased context.
version = "0.4.0"
edition = "2021"
license.workspace = true
publish = false

[dependencies]
inventory = { workspace = true }
# arc-swap backs the lock-free runtime hook registries (WOR-1691): the
# request path reads them without taking a lock or risking a poisoned
# mutex; startup registration appends via a retrying RCU.
arc-swap = { workspace = true }
# `serde` is the (de)serialization framework behind the credentials-epic
# Principal / Credential / SecretRef types. Already pulled transitively
# by `serde_json` but listed explicitly here so
# `#[derive(Serialize, Deserialize)]` resolves without relying on a
# transitive feature.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
compact_str = { workspace = true }
# `url` is the type behind `PolicyDecision::Confirm::webhook_url`
# (added per docs/adr-policy-verdict-shape.md, WOR-147 / WOR-201
# Phase 0). `chrono` is the type behind `expires_at`; the `serde`
# feature is on so the audit-event work in WOR-201 PR 1c can
# (de)serialise the timestamp without a second feature bump.
url = { workspace = true }
chrono = { workspace = true, features = ["serde"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
