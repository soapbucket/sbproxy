[package]
name = "sbproxy-agent-detect"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

# Agent fingerprint library (WOR-499 Module 1.1). Surfaces an
# `AgentDetection` value (score / agent_id / provenance / confidence /
# signals_used) the rest of the proxy can branch on. The crate-skeleton
# slice (WOR-584) shipped the types; slice 2 (WOR-585) ships the
# ADRF YAML rule-pack format + parser + matcher; the signal extractors,
# hot reload, scripting bindings, and the CatBoost ONNX scorer ride
# later slices (WOR-586 through WOR-592).

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
regex = { workspace = true }
anyhow = { workspace = true }
# Slice 5 (WOR-588): lock-free swap of the live rule pack so the hot
# path reads through a single atomic pointer load.
arc-swap = { workspace = true }
# Slice 3 (WOR-586): pull in `sbproxy-tls` so the detection layer can
# build `TlsSignals` directly from the existing `TlsFingerprint`
# captured at handshake time. This keeps TLS types in the foundational
# `sbproxy-tls` crate and the detection crate layered on top of it.
sbproxy-tls = { path = "../sbproxy-tls" }
# Slice 4 (WOR-587) uses SHA-256 for the request header-order hash.
sha2 = { workspace = true }
# Slice 9 (WOR-592): pure-Rust ONNX runtime for the CatBoost JA4
# scorer. Same engine/version as `sbproxy-classifiers`, avoiding the
# system ONNX Runtime dependency in proxy binaries. Held at 0.21 with
# `sbproxy-classifiers` and `sbproxy-modules`; the advisories against this
# line and why the bump is blocked are documented on that crate's
# declaration and in deny.toml. Keep the three in step.
tract-onnx = "0.21"

[dev-dependencies]
tempfile = "3"
# Builds the malicious ONNX fixture in `tests/external_data_refusal.rs`
# by encoding a `tract_onnx::pb::ModelProto`. Pinned to the prost major
# `tract-onnx` 0.21 generates against, so the encoder and the decoder
# under test share one `Message` trait.
prost_011 = { package = "prost", version = "0.11" }
