[package]
name = "sbproxy-ai"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[dependencies]
sbproxy-plugin.workspace = true
sbproxy-util.workspace = true
sbproxy-config.workspace = true
sbproxy-cache.workspace = true
sbproxy-security.workspace = true
sbproxy-httpkit.workspace = true
sbproxy-platform.workspace = true
# WOR-1542: evaluate the AI decision policy plane on the sandboxed CEL
# engine. sbproxy-extension does not depend on sbproxy-ai, so this is
# acyclic.
sbproxy-extension.workspace = true
# The metrics cardinality limiter and the per-label budget table. Every
# attribution tag that reaches a Prometheus label from this crate is
# caller-settable through an `SB-Attr-*` header, so it needs the same
# bound the rest of the workspace's label values get.
#
# This is acyclic, and it was already in the graph before it was named
# here: `sbproxy-config` and `sbproxy-extension` above both depend on
# `sbproxy-observe`, and `sbproxy-observe`'s own dependencies are
# `sbproxy-capability`, `sbproxy-plugin`, `sbproxy-util`,
# `sbproxy-security`, and `sbproxy-meter`, none of which depends on any
# workspace crate at all.
sbproxy-observe.workspace = true
sbproxy-model-host.workspace = true
# WOR-1637: the compat judge implements the extension's async Judge trait.
async-trait.workspace = true
# WOR-1223: local embedding source for the semantic cache. Only the
# sidecar client is used here; the in-process embedder lives in sbproxy-core
# because sbproxy-classifiers depends on sbproxy-ai (would be a cycle).
sbproxy-classifier-client.workspace = true
# WOR-2125: the usage ledger's hash chain, signing, and verifier live in the
# metering crate now, generic over the payload. sbproxy-meter has no workspace
# dependencies at all, so this stays acyclic by construction.
sbproxy-meter.workspace = true
# WOR-2648: `SecretString` for the AWS access key, secret key, session
# token, and external ID an `aws_sigv4:` block carries. Its Debug and
# Display both render `[REDACTED]` and it zeroes on drop, which a bare
# String does not. Acyclic: sbproxy-vault depends only on
# sbproxy-observe, which this crate already pulls in above.
sbproxy-vault.workspace = true

serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
# WOR-2174: the schema output guardrail compiles a real JSON Schema
# validator once at config publication. Same workspace declaration the
# json_schema transform, request_validator policy, and OpenAPI
# validator already resolve (remote $ref resolution stays disabled:
# no resolve-http feature). Promoted from dev-dependencies.
jsonschema.workspace = true
# WOR-2099: bounded binary encoding for the distributed semantic-cache wire.
# The same workspace declaration the mesh transport uses, so Redis, mesh, and
# the mesh RPC frames all resolve one copy.
postcard.workspace = true
# WOR-1686: JsonSchema on ProviderConfig so a committed schema covers
# the serve: block (editor autocomplete). ModelHostConfig already
# derives it; this pulls the provider surface in.
schemars.workspace = true
anyhow.workspace = true
bytes.workspace = true
# WOR-800: prompt-store template rendering.
minijinja.workspace = true
tokio.workspace = true
smallvec.workspace = true
regex.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
zeroize.workspace = true
arc-swap.workspace = true
# WOR-1913: durable per-model local-vs-cloud savings tallies. redb is the
# workspace embedded KV store (also used by the platform keystore, cache,
# and observe rollups); the value ledger persists a LaneSplit per served
# model so the dollars-saved report survives a restart.
redb.workspace = true
lru = "0.18"
reqwest.workspace = true
tracing.workspace = true
chrono.workspace = true
sha2.workspace = true
hex.workspace = true
# Exact binary-weight accounting for weighted rollout validation and selection.
# Every finite f64 is represented in subnormal units so positive bands cannot
# disappear through rounding and mathematical sums above f64::MAX are refused.
num-bigint = "0.4.6"
# Constant-time comparison for the A2A bearer token in
# `agent_orchestration::auth`, the same crate `sbproxy-config`,
# `sbproxy-middleware`, and `sbproxy-modules` already use for
# secret-equivalent comparisons.
subtle.workspace = true
# WOR-1540: Ed25519-signed entries for the verifiable usage ledger. The
# signing itself moved to sbproxy-meter in WOR-2125; what is left here is the
# key type in the `ledger verify` surface. Same major as the RFC 9421 verifier
# in sbproxy-middleware, and the same major sbproxy-meter pins, so the
# `VerifyingKey` handed across the seam is one type rather than two.
ed25519-dalek = "2"
prometheus.workspace = true
rand.workspace = true
futures.workspace = true
base64.workspace = true
thiserror.workspace = true
url.workspace = true
# WOR-1916: S3/GCS usage sinks write JSON objects via the workspace
# object_store crate (same backend as storage action / ACME cert store).
object_store = { workspace = true }

# Embedded provider catalog: gzipped YAML at build time, decompressed
# on first lookup. flate2 is the standard Rust gzip implementation;
# serde_yaml is already in the workspace via the OSS config crate.
flate2 = "1"
serde_yaml.workspace = true

# WOR-2648: AWS SigV4 request signing for Bedrock and SageMaker, which
# do not accept a bearer token. `aws-sigv4` is the AWS-maintained
# canonicalizer and signer, already in the lockfile as a transitive
# dependency of the SDK sbproxy-vault uses, so this promotes an existing
# resolution rather than adding a new one; hand-rolling the canonical
# request is exactly the kind of "close enough" that fails as an
# authentication error rather than as a visible bug. `aws-config` brings
# the standard credential provider chain (env, profile, EKS web
# identity, ECS task role, EC2 instance profile) and the STS
# `AssumeRoleProvider`; `aws-credential-types` is the `Credentials`
# type the two exchange, whose Debug already redacts the secret key.
#
# The feature list matches crates/sbproxy-vault/Cargo.toml exactly so
# the workspace resolves one copy: `default-https-client` routes through
# smithy's hyper-rustls 0.23 stack rather than the legacy `rustls`
# feature's vulnerable rustls-webpki 0.101.
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
aws-credential-types = { version = "1" }
aws-sigv4 = { version = "1" }

# Pre-request token estimation for fail-fast TPM enforcement (WOR-232).
# Ships the cl100k_base and o200k_base BPEs used by GPT-4, GPT-4o, and
# the o-series. The crate caches its `CoreBPE` singletons internally
# so each tokenizer pays its initialization cost once per process.
tiktoken-rs = "0.11"

[dev-dependencies]
tempfile = "3"
tracing-subscriber.workspace = true
# Test-only, thread-local allocation observation for the finance validator.
# Its safe API preserves this crate's `forbid(unsafe_code)` policy while making
# a caller-sized scratch allocation before refusal mutation-visible.
allocation-counter = "0.8.1"
