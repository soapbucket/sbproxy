# AI Provider Registry.
#
# Source of truth for known AI / LLM provider metadata. Loaded by the
# AI gateway at startup; the embedded copy ships with the binary, and
# operators may override via `proxy.ai_providers_file` in sb.yml to
# point at a custom catalog on disk.
#
# Each entry maps to `sbproxy_ai::providers::ProviderInfo`. Fields:
#   - name            : canonical identifier used in sb.yml
#   - display_name    : human-readable label
#   - aliases         : alternative names accepted by the lookup
#   - default_base_url: upstream API base URL
#   - auth_header     : HTTP header carrying the API key
#   - auth_prefix     : prefix prepended to the key (e.g. "Bearer ")
#   - format          : wire format - openai|anthropic|google|bedrock|custom
#   - supports_streaming
#   - supports_embeddings
#   - data_posture    : declared data-handling posture, per the vendor's
#       published data-processing terms (a catalog claim, not an audit):
#         retains_data : prompt data sent to a stock account is retained
#                        (e.g. an abuse-monitoring window). Default true.
#         zdr_available: the vendor offers a zero-data-retention
#                        arrangement. Default false. Whether a given
#                        deployment operates under one is declared per
#                        provider entry in sb.yml (`data_posture.zdr`),
#                        not here.
#         data_region  : optional vendor-declared processing region;
#                        reserved for zone/locality-aware selection and
#                        not consulted by the posture filter.
#       Entries with no vendor commitment carry the pessimistic default
#       spelled out, so a posture-constrained deployment fails closed
#       rather than optimistically routing to an unknown posture.
#
# Adding providers: append an entry below; the registry will pick it up
# automatically on next startup. Replacing the embedded set entirely:
# point `proxy.ai_providers_file` at your own YAML.

providers:
  # --- Tier 1: Major cloud providers ---
  - name: openai
    display_name: OpenAI
    default_base_url: https://api.openai.com/v1
    auth_header: Authorization
    auth_prefix: "Bearer "
    format: openai
    supports_streaming: true
    supports_embeddings: true
    # API inputs/outputs are not used for training by default but are
    # retained up to 30 days for abuse monitoring; zero data retention
    # is offered for approved use cases (OpenAI API data-usage policy).
    data_posture:
      retains_data: true
      zdr_available: true

  - name: anthropic
    display_name: Anthropic
    default_base_url: https://api.anthropic.com/v1
    auth_header: x-api-key
    auth_prefix: ""
    format: anthropic
    supports_streaming: true
    supports_embeddings: false
    # API inputs and outputs are deleted within 30 days by default,
    # extending to two years where trust-and-safety classifiers flag
    # them; zero-data-retention agreements are applied per organization
    # (Anthropic privacy center, data-retention article).
    data_posture:
      retains_data: true
      zdr_available: true

  - name: gemini
    display_name: Google Gemini
    aliases: [google]
    default_base_url: https://generativelanguage.googleapis.com/v1beta
    # The Gemini (AI Studio) REST API authenticates with an API key in the
    # x-goog-api-key header, not an OAuth Bearer token. Vertex AI (below)
    # uses Bearer because it takes a Google OAuth access token instead.
    auth_header: x-goog-api-key
    auth_prefix: ""
    format: google
    supports_streaming: true
    supports_embeddings: true
    data_posture:
      retains_data: true
      zdr_available: false

  - name: azure
    display_name: Azure OpenAI
    aliases: [azure_openai]
    # The v1 API surface appends /v1 to the resource endpoint and
    # drops the dated api-version parameter; api-key remains supported
    # alongside Entra bearer tokens (Azure OpenAI v1 API docs).
    default_base_url: https://{resource}.openai.azure.com/openai/v1
    auth_header: api-key
    auth_prefix: ""
    format: openai
    supports_streaming: true
    supports_embeddings: true
    # Prompts and completions are stored for human review under abuse
    # monitoring, with no duration published on the current page;
    # eligible customers can apply for modified abuse monitoring to
    # disable it (Azure OpenAI abuse-monitoring docs).
    data_posture:
      retains_data: true
      zdr_available: true

  - name: bedrock
    display_name: AWS Bedrock
    aliases: [aws_bedrock]
    default_base_url: https://bedrock-runtime.{region}.amazonaws.com
    auth_header: Authorization
    auth_prefix: ""
    format: bedrock
    supports_streaming: true
    supports_embeddings: true
    # Bedrock's platform default is zero data retention, but the abuse
    # detection page carves out named models: classifier-flagged
    # traffic to the OpenAI GPT-5.x family is retained up to 30 days
    # with no opt-in, and the model name passes straight through from
    # the caller, so a stock account can reach a retention window
    # without asking for one. Eligible customers may request full ZDR
    # through their AWS account team (Bedrock abuse-detection docs).
    data_posture:
      retains_data: true
      zdr_available: true

  - name: meta
    display_name: Meta Model API
    aliases: [llama, llama_api, meta_llama]
    # llama.developer.meta.com redirects to ai.developer.meta.com and
    # the shipping product is the Meta Model API. The legacy
    # api.llama.com/compat/v1 host still answers 401 rather than 404,
    # so it reads as live to a spot check; it is not the current base.
    default_base_url: https://api.meta.ai/v1
    auth_header: Authorization
    auth_prefix: "Bearer "
    format: openai
    supports_streaming: true
    supports_embeddings: false
    data_posture:
      retains_data: true
      zdr_available: false

  # --- Tier 2: Dedicated AI providers ---
