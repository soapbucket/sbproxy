[package]
name = "sbproxy-observe"
# Tracks the real product/release version (the `sbproxy` binary's
# `--version` also inherits it), not an independent library version:
# `env!("CARGO_PKG_VERSION")` calls inside this crate stamp OTLP's
# `service.version` resource attribute and the webhook notifier's
# User-Agent, so a stale pinned version here silently defeats
# version-based correlation across a rolling upgrade.
version.workspace = true
edition = "2021"
license.workspace = true
publish = false

[dependencies]
sbproxy-capability.workspace = true
sbproxy-plugin.workspace = true
sbproxy-util.workspace = true
# SSRF guard for alert webhook URLs (WOR-604). No cycle: sbproxy-security
# does not depend on sbproxy-observe.
sbproxy-security.workspace = true
# The meter's self-observation seam (WOR-2129). The direction is the only
# one that works: sbproxy-meter depends on no workspace crate at all and
# must keep not depending on one, so the crate that owns Prometheus and the
# OTLP pipeline reaches down to it rather than the other way round.
sbproxy-meter.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
prometheus.workspace = true
serde.workspace = true
# WOR-1081: JsonSchema on the capture/sink config types so the
# auto-generated `sb-config.schema.json` covers operator inputs
# that flow through observe.
schemars.workspace = true
serde_json.workspace = true
anyhow.workspace = true
# `serde` is on so PolicyVerdictEvent and other typed events can
# (de)serialise the UUID without an intermediate string conversion.
uuid = { workspace = true, features = ["v4", "serde"] }
ulid.workspace = true
regex.workspace = true
http.workspace = true
once_cell = "1"
parking_lot.workspace = true
rand.workspace = true
reqwest = { workspace = true }
tokio.workspace = true
# TaskTracker drains in-flight alert webhook deliveries on shutdown (WOR-652).
tokio-util.workspace = true
# `serde` is on so PolicyVerdictEvent.occurred_at can (de)serialise
# the timestamp directly without a custom adapter.
chrono = { workspace = true, features = ["serde"] }
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
thiserror.workspace = true
flate2 = "1"

# Outbound webhook framework: Ed25519 signing (preferred) with
# HMAC-SHA256 fallback. Already used in
# sbproxy-middleware; share the version.
ed25519-dalek = "2"

# OpenTelemetry OTLP export pipeline. Pinned together: each
# opentelemetry sub-crate version must align across the SDK,
# protocol, and tracing bridge. The `logs` feature flips on the
# OTLP-logs surface that WOR-1046 plumbs into the sink dispatcher;
# the trace + metrics surfaces remain wired the same way as before.
opentelemetry = { version = "0.32", features = ["trace", "metrics", "logs"] }
# rt-tokio-current-thread: the OTLP metrics PeriodicReader needs this
# binding (not plain rt-tokio) so it spawns its own dedicated
# thread+runtime instead of assuming an ambient multi-thread Tokio
# runtime, which does not exist yet at the point main() initializes
# telemetry (Pingora builds its runtime later). Since 0.28 the
# runtime-bound PeriodicReader and BatchLogProcessor live behind the
# `experimental_*_with_async_runtime` features; they are the same
# runtime bindings 0.27 shipped by default, kept so the metrics and
# log pipelines run on the exact runtimes they always did.
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio", "rt-tokio-current-thread", "trace", "metrics", "logs", "experimental_metrics_periodicreader_with_async_runtime", "experimental_logs_batch_log_processor_with_async_runtime"] }
# default-features = false: the 0.28+ default set adds
# reqwest-blocking-client, which would silently switch the OTLP/HTTP
# exporters onto a blocking client. This list reproduces the exact
# effective feature set the 0.27 pin resolved to (its defaults plus
# what was requested), so the HTTP exporters keep using the async
# reqwest client they always have.
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-client", "grpc-tonic", "trace", "metrics", "logs", "internal-logs"] }
opentelemetry-semantic-conventions = "0.32"
tracing-opentelemetry = "0.33"
# WOR-1869: build gRPC MetadataMap for authenticated OTLP export.
# Pinned to match opentelemetry-otlp 0.32's tonic (0.14), NOT the
# workspace tonic (0.12, which the classifier sidecar contract keeps):
# `with_metadata` takes this tonic's MetadataMap by type, so the two
# must agree here even though the workspace carries both majors.
tonic = "0.14"
# WOR-1875: durable usage rollup buckets (the workspace's embedded-KV
# convention; the response cache and keystore use redb the same way).
redb.workspace = true

[dev-dependencies]
# 0.28 moved `ManualReader`, `Pipeline`, and the `MetricReader` trait
# behind `experimental_metrics_custom_reader`. Only the meter
# reconciliation test consumes them, so the feature rides the
# dev-dependency union rather than the shipped one.
opentelemetry_sdk = { version = "0.32.1", features = ["experimental_metrics_custom_reader"] }
tempfile = "3"
# WOR-2333: the redaction test asserts a redacted config still parses,
# which is the property an operator depends on when the Config page
# round-trips it. A substring assertion would not have caught the eaten
# `:` that broke the YAML.
serde_yaml.workspace = true
# WOR-2572: the forced audit-write-failure test lowers RLIMIT_FSIZE and
# ignores SIGXFSZ so a real chain append fails with EFBIG on the held
# file descriptor; both knobs are libc-only and unix-only. Already in
# the dependency graph transitively; this only makes it nameable.
libc = "0.2"
# WOR-1186: validate emitted session-ledger records against the
# canonical schema (vendored copy under tests/).
jsonschema.workspace = true
