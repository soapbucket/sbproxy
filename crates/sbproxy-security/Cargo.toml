[package]
name = "sbproxy-security"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

# --- AI Governance feature flags ---
#
# `agent-class` opts in `agent_verify`, the forward-confirmed reverse-DNS
# verifier. Off-by-default for library consumers; the `sbproxy`
# binary turns it on via its own default feature set.
[features]
default = []
agent-class = []
# Pulls the headless-browser detector
# (`headless_detect.rs`) into the security pipeline. The detector
# reads `RequestContext.tls_fingerprint.ja4` and compares it against
# a TLS-fingerprint catalogue. The embedded catalogue names the agent
# classes and carries no fingerprints, so the detector is inert until an
# operator supplies `catalog_file` (WOR-2296). Off-by-default for
# library consumers.
tls-fingerprint = []

[dependencies]
anyhow.workspace = true
ipnetwork.workspace = true
sha2.workspace = true
hmac.workspace = true
hex.workspace = true
url.workspace = true
# WOR-892 PR1: sealed OIDC session cookies.
aes-gcm.workspace = true
ciborium.workspace = true
base64.workspace = true
rand.workspace = true
zeroize.workspace = true

# PII detection & redaction
regex.workspace = true
aho-corasick = "1"
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tracing.workspace = true
hickory-resolver = "0.26.1"
tokio.workspace = true
# WOR-2165: `sbproxy_egress_refused_total` lives beside the authorizer
# that produces the refusal so every consumer crate reports through one
# family. sbproxy-security is a leaf; the alternative was a per-crate
# counter in each of sbproxy-ai, sbproxy-modules, sbproxy-extension, and
# sbproxy-model-host, and only two of those can reach sbproxy-observe.
# Same workspace version the observe, ai, and mesh crates already
# resolve, so this adds no new lock entries.
prometheus.workspace = true
# WOR-2612 / WOR-2620: `governed_egress` is the one bounded redirect
# loop every credential-carrying egress path dials through, and a
# redirect loop that re-authorizes each hop has to own the client it
# hands each hop's pin set to. Putting it in a consumer crate instead
# would mean one copy per consumer, which is the defect it exists to
# close: three near-copies each got a different subset of the contract
# right. Same workspace version and feature set the observe, ai, and
# extension crates already resolve, so this adds no lock entries; it
# does put reqwest in the build graph of the five crates that depend on
# sbproxy-security without it (cache, config, keystore, mesh,
# middleware), which is a build-order cost in an isolated `-p` build and
# nothing at all in a workspace build.
reqwest.workspace = true

[dev-dependencies]
