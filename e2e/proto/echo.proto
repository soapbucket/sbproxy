// Minimal echo service used by `tests/action_grpc.rs`.
//
// Kept intentionally tiny: a single unary RPC that echoes the input
// message back to the caller. The e2e test spawns a tonic server with
// this service, points the proxy at it via an `action: type: grpc`
// origin, and asserts that the response payload survives the proxy
// round-trip unchanged.

syntax = "proto3";

package sbproxy_e2e.echo;

service Echo {
  // Echo returns the message it received in the request.
  rpc Hello(EchoRequest) returns (EchoResponse);

  // Server-streaming echo: yields N responses, one per token in the
  // request message split on whitespace. Used by the gRPC-Web
  // server-streaming bridge tests (WOR-819).
  rpc HelloStream(EchoRequest) returns (stream EchoResponse);

  // Always fails with FAILED_PRECONDITION + the request message as
  // the grpc-message. The proxy still cannot inject a body on a
  // trailers-only-in-headers response (Pingora skips both body and
  // trailer filters for HEADERS frames with END_STREAM), so nothing
  // asserts on the response body here. The response *header* filter
  // does run, which is what `grpc_transcode.rs` uses to pin the
  // gRPC-status-to-HTTP-status mapping on the status line.
  rpc HelloError(EchoRequest) returns (EchoResponse);

  // Server-streaming variant of HelloError: emits ONE message, then
  // terminates the stream with FAILED_PRECONDITION carrying the
  // request message as `grpc-message`. The error rides on real
  // HTTP/2 trailers (after the body), which is the case
  // `response_trailer_filter` is built to remap. (WOR-819)
  rpc HelloStreamError(EchoRequest) returns (stream EchoResponse);

  // Bidirectional-streaming echo: reads a stream of requests and
  // emits one response per request as that request arrives. This is
  // the shape the proxy has to keep full-duplex, and the shape
  // WOR-2524 reported as producing a corrupted length-prefix, so the
  // e2e drives it with real interleaved traffic rather than sending
  // every request up front.
  rpc HelloBidi(stream EchoRequest) returns (stream EchoResponse);

  // Bidirectional streaming where the SERVER finishes first: it never
  // reads the request stream and terminates the call immediately with
  // UNIMPLEMENTED. This is the shape gRPC server reflection takes when
  // a client probes a reflection version the server does not
  // implement, and it is what makes an HTTP/2 server discard the
  // request half the client is still writing to.
  rpc HelloBidiServerFirst(stream EchoRequest) returns (stream EchoResponse);

  // Bidirectional streaming where the server emits one reply and then
  // completes the response stream without ever draining the request
  // stream. Same early-close shape as HelloBidiServerFirst, but on the
  // success path rather than the error path.
  rpc HelloBidiOneShot(stream EchoRequest) returns (stream EchoResponse);
}

message EchoRequest {
  string message = 1;
}

message EchoResponse {
  string message = 1;
}
