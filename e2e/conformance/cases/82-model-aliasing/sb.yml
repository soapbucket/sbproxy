# AI proxy with global model aliases plus the per-provider model_map.
#
# `model_aliases` resolves before provider selection; `model_map` renames
# the resolved id on the way to the provider it was already routed to.
proxy:
  http_bind_port: 18080

origins:
  "ai-alias.test":
    action:
      type: ai_proxy
      skip_tls_verify_host: true
      default_model: gpt-4o-mini
      providers:
        - name: mock-openai
          api_key: test-key
          base_url: http://127.0.0.1:18889/v1
          allow_private_base_url: true
          models:
            - gpt-4o-mini
            - gpt-4o
          model_map:
            fast: gpt-4o-mini
            smart: gpt-4o
            cheap: gpt-4o-mini
      model_aliases:
        - alias: house-default
          provider: mock-openai
          model_id: gpt-4o-mini
