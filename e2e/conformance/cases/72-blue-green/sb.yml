# Blue-green deployment using the active deployment group.
# The blue group receives all traffic until active is changed to green.
proxy:
  http_bind_port: 18080

origins:
  "bluegreen.test":
    action:
      type: load_balancer
      algorithm: round_robin
      deployment_mode:
        mode: blue_green
        active: blue
      targets:
        - url: http://127.0.0.1:18888
          host_override: blue.internal
          group: blue
          weight: 1
        - url: http://127.0.0.1:18888
          host_override: green.internal
          group: green
          weight: 1
