# Priority-based routing using the numeric X-Priority threshold, followed by
# header hashing within the eligible target set.
proxy:
  http_bind_port: 18080

origins:
  "priority.test":
    action:
      type: load_balancer
      algorithm:
        header_hash:
          header: X-Priority
      targets:
        - url: http://127.0.0.1:18888
          host_override: high-priority.internal
          priority: 1
          weight: 1
        - url: http://127.0.0.1:18888
          host_override: low-priority.internal
          priority: 8
          weight: 1
        - url: http://127.0.0.1:18888
          host_override: normal-priority.internal
          priority: 10
          weight: 1
