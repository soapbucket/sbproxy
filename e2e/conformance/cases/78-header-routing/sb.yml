# Header-based routing using the load balancer's header hash.
# The tested api, web, and missing-header keys map to the targets below.
proxy:
  http_bind_port: 18080

origins:
  "headerroute.test":
    action:
      type: load_balancer
      algorithm:
        header_hash:
          header: X-Route
      targets:
        - url: http://127.0.0.1:18888
          host_override: api.internal
          weight: 1
        - url: http://127.0.0.1:18888
          host_override: web.internal
          weight: 1
        - url: http://127.0.0.1:18888
          host_override: default.internal
          weight: 1
