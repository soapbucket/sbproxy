proxy:
  http_bind_port: 18080

origins:
  "apikey.test":
    action:
      type: proxy
      url: http://127.0.0.1:18888
    authentication:
      type: api_key
      api_keys:
        - test-key-1
        - test-key-2

  "basic.test":
    action:
      type: proxy
      url: http://127.0.0.1:18888
    authentication:
      type: basic_auth
      users:
        - username: alice
          password: secret123

  "bearer.test":
    action:
      type: proxy
      url: http://127.0.0.1:18888
    authentication:
      type: bearer_token
      tokens:
        - my-bearer-token-1

  "jwt.test":
    action:
      type: proxy
      url: http://127.0.0.1:18888
    authentication:
      type: jwt
      secret: jW7tN3mK9pR4xL2vX5qJ8bN4mW
      # The field is the plural `algorithms`, a list. This case carried
      # the singular `algorithm: HS256` for as long as the file has
      # existed and it was dropped on the floor every run; the config
      # happened to work because HS256 is in the default set a `secret`
      # implies. WOR-2181 refuses unknown keys on an auth block, so the
      # typo is now a config error rather than a silent drop.
      algorithms: [HS256]
