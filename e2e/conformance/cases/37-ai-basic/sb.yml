# Basic AI gateway - chat completions and model listing
proxy:
  http_bind_port: 18080

origins:
  "ai-basic.test":
    action:
      type: ai_proxy
      skip_tls_verify_host: true
      providers:
        - name: mock-openai
          api_key: test-key
          base_url: http://127.0.0.1:18889/v1
          allow_private_base_url: true
          # `default_model` is a PER-PROVIDER field. At action level it
          # was silently ignored (AiHandlerConfig does not deny unknown
          # fields), and the value it named, gpt-4o-mini, is the same
          # one the mock invents for a body with no `model`, so the
          # assertion below passed against a proxy that injected
          # nothing. gpt-4o is a value only the proxy can produce.
          default_model: gpt-4o
          models:
            - gpt-4o-mini
            - gpt-4o
            - gpt-4
