[package]
name = "sbproxy-e2e"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

# This crate ships a small `ProxyHarness` library plus a suite of
# integration tests that spawn a built `sbproxy` binary against
# the example sb.yml files and exercise the documented HTTP
# behaviour. Running it requires a release build of the binary:
#
#     cargo build --release -p sbproxy
#     cargo test  --release -p sbproxy-e2e
#
# Disabled-feature coverage can target a separate no-default-features
# build without overwriting the normal suite binary:
#
#     CARGO_TARGET_DIR=target/no-default-features cargo build -p sbproxy --no-default-features
#
# Each test owns its own ephemeral TCP port and writes a temp
# config so the suite parallelises cleanly.

[lib]
path = "src/lib.rs"

[dependencies]
sbproxy-config.workspace = true
# WOR-1635: the tool-versioning e2e builds lockfile fixtures with the
# same digest the gateway computes.
sbproxy-extension.workspace = true
sbproxy-cache.workspace = true
# Wave 1 Q1.9 (redaction.rs) calls into the legacy regex-based redactor
# as a regression floor; the typed redactor lands in R1.2.
sbproxy-observe.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
anyhow.workspace = true
tokio.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
tempfile = "3"
base64.workspace = true
libc = "0.2"

[dev-dependencies]
# Wave 4 G4.10: boilerplate-stripping e2e calls into the production
# transform's public `apply` method instead of the in-file reference
# stub. Dev-only because no other harness path needs it.
sbproxy-modules.workspace = true

# WOR-1444: deterministic TLS ClientHello e2e coverage generates real
# rustls ClientHello bytes and feeds them through the production parser.
sbproxy-tls.workspace = true

# WOR-2169: the usage-bridge e2e asserts against the settlement SQLite file
# the recovery worker drains, opened read-only so the assertion cannot
# perturb the file the running proxy still owns. Reading the durable row is
# the point of that suite: a metric proves something was counted, and only
# the row proves the provider deduplication identifier that was written.
# Same pin the settlement store already uses, so this compiles nothing new.
rusqlite = { workspace = true }

# WOR-805 publish-signed e2e (web_bot_auth_publish_signed_e2e.rs)
# rehydrates the signed JWKS response as an http::Request and runs
# the production verifier against the published JWK as the trust
# anchor. Dev-only because no other test harness path needs it.
sbproxy-middleware.workspace = true

# JWT signing for auth_jwt.rs (replaces hand-encoded HS256 tokens with
# real `jsonwebtoken::encode` calls so failure modes show up cleanly).
jsonwebtoken = { workspace = true }

# Ed25519 for auth_bot.rs - generates a fresh keypair, signs an RFC 9421
# canonical base, and asserts the proxy accepts/rejects round-trips.
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
rand = { workspace = true }

# RFC 9421 signature base helpers re-used by auth_bot.rs to keep the
# signing path byte-identical to the verifier.
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }

# Wave 8 P0 e2e tests construct/validate ULIDs round-tripped through
# the X-Sb-Session-Id header.
ulid = { workspace = true }

# WebSocket end-to-end coverage for action_websocket.rs - spawns a tiny
# echo server and drives an upgrade through the proxy.
tokio-tungstenite = "0.21"
futures-util = "0.3"

# gRPC end-to-end coverage for action_grpc.rs, and the transport under
# the mock OTLP collector below. Pinned to the 0.14 major that
# `opentelemetry-proto` 0.32 generates against (WOR-2549).
#
# WOR-2549's acceptance sketch asked for one major per family across
# opentelemetry, opentelemetry-proto, opentelemetry_sdk, tonic and
# prost. Three of the five collapse; the tonic/prost half cannot be met
# from here, and the premise that these dev-dependencies are what keep
# the old majors alive is stale:
#
#   * The workspace pins `tonic = "0.12"` / `prost = "0.13"` for the
#     classifier cluster (root Cargo.toml), and `sbproxy`,
#     `sbproxy-core`, `sbproxy-billing` and the four classifier crates
#     build on them. Both tonic majors are in the lock whichever one
#     this crate picks.
#   * `sbproxy-observe` exports through `opentelemetry-otlp 0.32`,
#     whose own manifest requires `opentelemetry-proto = "0.32"`
#     exactly. There is no 0.32-compatible proto release on tonic 0.12:
#     `opentelemetry-proto` moved to `tonic 0.14.1` at 0.31 and stayed
#     there; the last release on `tonic 0.12.3` / `prost 0.13` is 0.28,
#     which would put a second opentelemetry / opentelemetry_sdk /
#     opentelemetry-proto major back in the lock and return the fixture
#     to decoding a different generated type than the product emits.
#
# So the win here is correctness rather than crate count: the mock
# collector now shares the proxy's own generated OTLP type instead of
# decoding 0.27 protos from a 0.32 exporter and working only because
# OTLP is wire-stable. The cost is honest and is paid in the build
# graph, not the runtime one: `tonic-build`, `prost-build`, `petgraph`
# and `pulldown-cmark` each carry two majors while both tonic majors
# exist. Collapsing tonic to one major means moving the workspace pins
# to 0.14, which is a production-crate change and a separate ticket.
#
# `tonic-prost` carries the codec the generated stubs name, which tonic
# 0.14 split out of the core crate.
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"

# WOR-1233: span-arrival e2e. A mock OTLP gRPC collector (built from the
# OTLP proto's TraceServiceServer) receives the proxy's AI spans, and the
# test asserts the gen_ai / OpenInference vocabulary arrives intact.
#
# The five `otlp_*_e2e.rs` files stay five binaries. They were proposed
# as the WOR-2066 consolidation pilot because they already share
# `otlp_span_arrival_common`, but sharing a helper is not the predicate
# consolidation needs. `assert_complete_ai_span_exports` calls
# `LoggingConfig::init_with_resolved_filter_and_telemetry`, the
# process-global tracing subscriber and OTel tracer provider, inside the
# test process; the gRPC and HTTP cases are separate binaries precisely
# so each process initializes it once. Merging them would leave the
# second transport's collector receiving nothing, and the test would
# pass or fail on which module ran first.
# WOR-2549: pinned to the 0.32 major `sbproxy-observe` already exports
# through `opentelemetry-otlp`, so the collector shares one
# opentelemetry / opentelemetry_sdk / opentelemetry-proto compile with
# the proxy instead of keeping a second 0.27 chain alive for this one
# test fixture.
sbproxy-ai.workspace = true
opentelemetry-proto = { version = "0.32", features = ["gen-tonic", "trace", "metrics"] }
tokio-stream = { version = "0.1", features = ["net"] }

# Compression decoders for compression.rs e2e assertions. Pinned to the
# same versions sbproxy-middleware ships so the test bytes round-trip
# through the same encoder/decoder pair the proxy uses at runtime.
flate2 = "1"
brotli = "3"
zstd = "0.13"

# Wave 1 Q1.x mock servers (HTTP ledger for Q1.2, Web Bot Auth directory
# for Q1.4, WBA conformance for Q1.7) are tiny axum apps bound on
# 127.0.0.1:0. Pin to the same axum major already in the workspace lock
# so we do not pull two majors into the build graph.
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }

# Wave 1 Q1.4 (WOR-85): the bot-auth directory loader enforces HTTPS at
# config load, so the mock directory must terminate TLS. axum-server
# wraps the axum Router with rustls termination; rcgen mints a fresh
# self-signed CA + leaf per test run and the proxy trusts that root via
# `directory.trust_roots`. This keeps production HTTPS enforcement on
# while letting the e2e harness exercise the directory fetch path over
# a real TLS transport. The `tls-rustls-no-provider` feature lets us
# install the `ring` crypto provider explicitly to match the workspace
# rustls configuration in `crates/sbproxy/src/main.rs`.
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rcgen = { workspace = true }
rustls = { workspace = true }
sbproxy-mesh.workspace = true

# Rate-limit budget e2e. Lives at the top level so default discovery
# picks it up without an explicit registration; this entry documents
# the test's name for grep-ability.
[[test]]
name = "rate_limit_budget"
path = "tests/rate_limit_budget.rs"

# WOR-1850: authenticated three-process managed-model data-plane proof.
[[test]]
name = "model_cluster_dispatch"
path = "tests/model_cluster_dispatch.rs"

# WOR-1980: real-network acceptance proof for compiled routing strategies.
[[test]]
name = "routing_registry"
path = "tests/routing_registry.rs"

# WOR-2066: one streaming suite instead of five separately linked
# binaries. Each former file is a module of `tests/streaming/main.rs`
# and keeps its own cases; the module name prefixes every test name, so
# `-E 'test(ai_streaming_usage::)'` selects what `--test
# ai_streaming_usage` used to.
[[test]]
name = "streaming"
path = "tests/streaming/main.rs"

[build-dependencies]
# Compiles the in-tree `proto/echo.proto` for the gRPC e2e test. tonic
# 0.14 moved prost codegen out of `tonic-build` into `tonic-prost-build`
# (WOR-2549); the generated stubs name `tonic_prost`, which is a regular
# dependency above.
tonic-prost-build = "0.14"
